name: Google Calendar sync
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run server-side sync
        run: |
          curl -sS -m 60 -X POST "https://ilublhgawgfznxpdrfra.supabase.co/functions/v1/gcal-sync" \
            -H "Content-Type: application/json" -d '{"action":"sync"}' | head -c 600
