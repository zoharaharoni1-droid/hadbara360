<script>
var CDNS=[
  "https://unpkg.com/react@18.2.0/umd/react.production.min.js",
  "https://cdn.staticfile.org/react/18.2.0/umd/react.production.min.js"
];
var CDNS_DOM=[
  "https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js",
  "https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.production.min.js"
];
var CDNS_BABEL=[
  "https://unpkg.com/@babel/standalone@7.23.5/babel.min.js",
  "https://cdn.staticfile.org/babel-standalone/7.23.2/babel.min.js"
];
function loadScript(urls,cb,i){
  i=i||0;
  if(i>=urls.length){cb(new Error("כל ה-CDN נכשלו"));return;}
  var s=document.createElement("script");
  s.src=urls[i];s.crossOrigin="anonymous";
  s.onload=function(){cb(null);};
  s.onerror=function(){loadScript(urls,cb,i+1);};
  document.head.appendChild(s);
}
</script>

<script>
function showError(msg){
  document.getElementById("root").innerHTML=
    '<div style="padding:30px;font-family:sans-serif;direction:rtl;text-align:center;max-width:480px;margin:60px auto">'+
    '<div style="font-size:48px">🚫</div>'+
    '<h2 style="color:#dc2626;margin:16px 0">לא ניתן לטעון</h2>'+
    '<p style="color:#374151;line-height:1.7">המערכת צריכה אינטרנט בפתיחה הראשונה.<br>ודא חיבור ורענן את הדף (F5).</p>'+
    '<div style="background:#fef9c3;border:1px solid #fcd34d;border-radius:8px;padding:14px;margin:16px 0;text-align:right;font-size:14px">'+
    '<strong>💡 רוצה גרסה שעובדת ללא אינטרנט?</strong><br>שלח הודעה ונכין גרסה עם הכל מוטמע בקובץ.'+
    '</div>'+
    '<code style="font-size:11px;color:#9ca3af">'+msg+'</code></div>';
}
var st=document.getElementById("load-status");
function setStatus(s){if(st)st.textContent=s;}
setStatus("מחפש שרתים...");
loadScript(CDNS,function(e){
  if(e){showError("React: "+e.message);return;}
  setStatus("React ✓");
  loadScript(CDNS_DOM,function(e2){
    if(e2){showError("ReactDOM: "+e2.message);return;}
    setStatus("React ✓  ReactDOM ✓");
    loadScript(CDNS_BABEL,function(e3){
      if(e3){showError("Babel: "+e3.message);return;}
      setStatus("הכל נטען — מאתחל...");
      // Babel is loaded — now transform and execute the babel script
      var scripts=document.querySelectorAll('script[type="text/babel"]');
      scripts.forEach(function(s){
        try{
          var code=Babel.transform(s.textContent,{presets:["react"]}).code;
          var el=document.createElement("script");
          el.textContent=code;
          document.body.appendChild(el);
        }catch(err){showError(err.message);}
      });
    });
  });
});
</script>

// Hash password (simple SHA256 via SubtleCrypto)
async function hashPwd(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ─── Secure auth (Supabase Auth) ─────────────────────────────────────────
// כל משתמש CRM מקבל חשבון Supabase Auth. שם המשתמש מומר לכתובת פנימית קבועה.
function authEmail(username){
  const bytes = new TextEncoder().encode(String(username).trim());
  return 'u' + Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('') + '@hadbara360.co.il';
}
function authPwd(p){ return 'h360:' + p; }

async function secureLogin(username, password){
  username = String(username).trim();
  const email = authEmail(username);
  let r = await sb.auth.signInWithPassword({email, password: authPwd(password)});
  if(r.error){
    // משתמש ותיק שעוד לא הועבר: מאמתים את הסיסמה הישנה בשרת ויוצרים לו חשבון
    const chk = await sb.rpc('legacy_check', {p_username: username, p_password: password});
    if(chk.error) throw new Error('שגיאת חיבור לשרת');
    if(!chk.data) throw new Error('שם משתמש או סיסמה שגויים');
    const up = await sb.auth.signUp({email, password: authPwd(password)});
    if(up.error) throw new Error('לא ניתן להשלים את המעבר לכניסה המאובטחת: ' + up.error.message);
    if(!up.data.session) throw new Error('יש לכבות "Confirm email" בהגדרות Supabase');
    const ln = await sb.rpc('legacy_link', {p_username: username, p_password: password});
    if(ln.error || !ln.data){ await sb.auth.signOut(); throw new Error('המעבר לכניסה המאובטחת נכשל, פנו למנהל'); }
  }
  const uid = (await sb.auth.getUser()).data.user?.id;
  const prof = await sb.from('crm_users').select('*').eq('auth_id', uid).eq('active', true).maybeSingle();
  if(prof.error || !prof.data){ await sb.auth.signOut(); throw new Error('המשתמש אינו פעיל'); }
  sb.rpc('touch_login').then(()=>{});
  return prof.data;
}

function apptSnap(a){ const o={}; APPT_SNAP_KEYS.forEach(k=>{ o[k]=a[k]===undefined?null:a[k]; }); return o; }
function apptWithHistory(prev,next,user,reason){

  return {...next, history:[...h,{at:new Date().toISOString(),by:(user&&user.name)||"",role:(user&&user.role)||"",reason:reason||"",before:apptSnap(prev),after:apptSnap(next)}].slice(-30)};

// ─── התראות Push לטלפון ─────────────────────────────────
const VAPID_PUBLIC = "BCfSjv6muBQ5FBqAcA11refeniEF3KPu5QL7LLQr4f4iMiACk-qJWaLgHODribM2AcJfh5mg_3xiP0k53Jn6iAM";
function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent); }
function isStandalone(){ return window.matchMedia && window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true; }
function b64ToU8(b){ const p='='.repeat((4-b.length%4)%4); const s=atob((b+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...s].map(c=>c.charCodeAt(0))); }
async function savePushSub(){
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToU8(VAPID_PUBLIC)});
  const j = sub.toJSON();
  const r = await sb.rpc('save_push_subscription',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});
  if(r.error||!r.data) throw new Error('save failed');
  return true;
}
async function enablePush(){
  if(!pushSupported()) { alert(isIOS()&&!isStandalone() ? 'באייפון: לחצו על כפתור השיתוף ← "הוסף למסך הבית", פתחו את המערכת מהאייקון החדש, ואז הפעילו התראות.' : 'הדפדפן הזה לא תומך בהתראות. נסו בכרום.'); return false; }
  const perm = await Notification.requestPermission();
  if(perm!=='granted'){ alert('ההתראות חסומות. אפשר לאשר אותן בהגדרות הדפדפן/הטלפון.'); return false; }
  try{ await savePushSub(); return true; }catch(e){ alert('לא הצלחנו להפעיל התראות: '+(e.message||e)); return false; }
}
function PushPrompt(){
  const [state,setState]=React.useState(()=>!pushSupported()?(isIOS()&&!isStandalone()?'ios':'none'):(Notification.permission==='granted'?'on':'off'));
  const [hidden,setHidden]=React.useState(()=>{try{return localStorage.getItem('h360_push_hide')==='1'}catch(e){return false}});
  React.useEffect(()=>{ if(state==='on') savePushSub().catch(()=>{}); },[]);

const GOV_API="https://data.gov.il/api/3/action/datastore_search";
function useIlCities(){
  const [list,setList]=React.useState(()=>{try{return JSON.parse(localStorage.getItem("h360_il_cities")||"[]")}catch(e){return []}});
  React.useEffect(()=>{
    if(list.length) return;
    fetch(GOV_API+"?resource_id=5c78e9fa-c2e2-4771-93ff-7f400a12f7ba&limit=2000&fields=%D7%A1%D7%9E%D7%9C_%D7%99%D7%A9%D7%95%D7%91,%D7%A9%D7%9D_%D7%99%D7%A9%D7%95%D7%91")
      .then(r=>r.json()).then(j=>{
        const out=(j.result&&j.result.records||[]).map(r=>({code:String(r["סמל_ישוב"]).trim(),name:String(r["שם_ישוב"]||"").trim()}))
          .filter(c=>c.name&&c.name!=="לא רשום").sort((a,b)=>a.name.localeCompare(b.name,"he"));
        setList(out); try{localStorage.setItem("h360_il_cities",JSON.stringify(out))}catch(e){}
      }).catch(()=>{});
  },[]);
  return list;
}
function useIlStreets(cityCode){
  const [list,setList]=React.useState([]);
  React.useEffect(()=>{
    if(!cityCode){setList([]);return;}
    const key="h360_il_streets_"+cityCode;
    try{const c=localStorage.getItem(key); if(c){setList(JSON.parse(c));return;}}catch(e){}
    fetch(GOV_API+"?resource_id=a7296d1a-f8c9-4b70-96c2-6ebb4352f8e3&limit=5000&fields=%D7%A9%D7%9D_%D7%A8%D7%97%D7%95%D7%91&filters="+encodeURIComponent(JSON.stringify({"סמל_ישוב":Number(cityCode)})))
      .then(r=>r.json()).then(j=>{
        const out=[...new Set((j.result&&j.result.records||[]).map(r=>String(r["שם_רחוב"]||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"he"));
        setList(out); try{localStorage.setItem(key,JSON.stringify(out))}catch(e){}
      }).catch(()=>setList([]));
  },[cityCode]);
  return list;
}

// Check if user can see a tab
function canSeeTab(tab, authUser){
  if(!authUser) return false;
  if(authUser.role === "מנהל") return true;
  if(!tab.perm) return true; // no perm needed
  return authUser.permissions?.[tab.perm] === true;
}

// ── LOGIN SCREEN ──────────────────────────────────────
function LoginScreen({onLogin}){
  const [username,setUsername]=React.useState('');
  const [password,setPassword]=React.useState('');
  const [error,setError]=React.useState('');
  const [loading,setLoading]=React.useState(false);

  const doLogin=async()=>{
    if(!username||!password){setError('נא למלא שם משתמש וסיסמה');return;}
    setLoading(true);setError('');
    try{
      if(!sb){setError('שגיאת חיבור לשרת (Supabase לא נטען)');setLoading(false);return;}
      const data = await secureLogin(username, password);
      onLogin(data);
    }catch(e){setError(e?.message||'שגיאת חיבור');setLoading(false);}
  };

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#f0fdf4 0%,#dcfce7 50%,#f0fdf4 100%)",display:"flex",alignItems:"center",justifyContent:"center",direction:"rtl",fontFamily:"'Inter','Heebo',sans-serif"}}>
      <div style={{background:"#fff",borderRadius:20,boxShadow:"0 20px 60px rgba(0,0,0,0.12)",padding:"48px 40px",width:"100%",maxWidth:420,textAlign:"center"}}>
        <div style={{marginBottom:32}}>
          <img src="logo.png" alt="הדברה 360" style={{height:90,width:"auto",display:"block",margin:"0 auto 12px"}}/>
          <p style={{margin:"8px 0 0",color:"#64748b",fontSize:14}}>מערכת ניהול CRM</p>
        </div>
        <div style={{textAlign:"right",marginBottom:24}}>
          <label style={{display:"block",fontSize:13,fontWeight:600,color:"#374151",marginBottom:6}}>שם משתמש</label>
          <input value={username} onChange={e=>setUsername(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&doLogin()}
            placeholder="הכנס שם משתמש"
            style={{width:"100%",padding:"12px 16px",borderRadius:10,border:"1.5px solid #e2e8f0",fontSize:15,outline:"none",boxSizing:"border-box"}}/>
        </div>
        <div style={{textAlign:"right",marginBottom:24}}>
          <label style={{display:"block",fontSize:13,fontWeight:600,color:"#374151",marginBottom:6}}>סיסמה</label>
          <input type="password" value={password} onChange={e=>setPassword(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&doLogin()}
            placeholder="הכנס סיסמה"
            style={{width:"100%",padding:"12px 16px",borderRadius:10,border:"1.5px solid #e2e8f0",fontSize:15,outline:"none",boxSizing:"border-box"}}/>
        </div>
        {error&&<div style={{background:"#fef2f2",color:"#dc2626",borderRadius:8,padding:"10px 16px",fontSize:13,marginBottom:16,textAlign:"right"}}>{error}</div>}
        <button onClick={doLogin} disabled={loading}
          style={{width:"100%",padding:"14px",background:loading?"#86efac":"#16a34a",color:"#fff",border:"none",borderRadius:12,fontSize:16,fontWeight:700,cursor:loading?"not-allowed":"pointer",transition:"all 0.2s"}}>
          {loading?"מתחבר...":"כניסה למערכת"}
        </button>
        <p style={{marginTop:20,color:"#94a3b8",fontSize:12}}>הדברה 360 © 2025</p>
      </div>
    </div>
  );
}

// ── ADMIN PANEL (ניהול משתמשים) ───────────────────────
function AdminPanel({authUser,onClose}){
  const [users,setUsers]=React.useState([]);
  const [showLog,setShowLog]=React.useState(false);
  const [reviewUrl,setReviewUrl]=React.useState(()=>{try{return localStorage.getItem('h360_review_url')||"";}catch(e){return "";}});
  const [logRows,setLogRows]=React.useState([]);
  const [logUser,setLogUser]=React.useState("");
  const [logErr,setLogErr]=React.useState("");
  const loadLog=async()=>{ const {data,error}=await sb.from('activity_log').select('*').order('at',{ascending:false}).limit(300); if(error){setLogErr('יומן הפעילות עוד לא הופעל (צריך להריץ את סקריפט ה-SQL)');} else {setLogErr('');setLogRows(data||[]);} };
  const [loading,setLoading]=React.useState(true);
  const [showAdd,setShowAdd]=React.useState(false);
  const [editUser,setEditUser]=React.useState(null);
  const [newU,setNewU]=React.useState({name:'',username:'',password:'',role:'פקידה',permissions:{}});
  const [msg,setMsg]=React.useState('');

  const PERM_LABELS=[
    {key:"finance",label:"💰 כספים"},
    {key:"invoices",label:"🧾 חשבוניות"},
    {key:"workers",label:"👥 עובדים"},
    {key:"collabs",label:"🤝 שיתופי פעולה"},
    {key:"regional",label:"🗺️ אזורי"},
    {key:"projects",label:"🏗️ פרויקטים"},
    {key:"maintenance",label:"🔁 אחזקות"},
    {key:"scheduler",label:"⏰ מתזמן"},
    {key:"templates",label:"📄 תבניות"},
  ];

  React.useEffect(()=>{loadUsers();},[]);

  const loadUsers=async()=>{
    setLoading(true);
    const {data}=await sb.from('crm_users').select('*').order('id');
    setUsers(data||[]);setLoading(false);
  };

  const saveNew=async()=>{
    if(!newU.name||!newU.username||!newU.password){setMsg('נא למלא את כל השדות');return;}
    if(String(newU.username).trim()!==newU.username){setMsg('שם המשתמש לא יכול להתחיל או להסתיים ברווח');return;}
    const up=await tmpAuthClient().auth.signUp({email:authEmail(newU.username),password:authPwd(newU.password)});
    if(up.error||!up.data.user){setMsg('שגיאה: '+(up.error?.message||'יצירת החשבון נכשלה'));return;}
    const {error}=await sb.from('crm_users').insert({
      name:newU.name,username:newU.username,password_hash:'migrated',auth_id:up.data.user.id,
      role:newU.role,permissions:newU.permissions,active:true
    });
    if(error){setMsg('שגיאה: '+error.message);return;}
    setMsg('✅ משתמש נוסף בהצלחה!');
    setNewU({name:'',username:'',password:'',role:'פקידה',permissions:{}});
    setShowAdd(false);loadUsers();
  };

  const saveEdit=async()=>{
    const updates={name:editUser.name,role:editUser.role,permissions:editUser.permissions,active:editUser.active};
    const nu=editUser._newuser;
    if(nu!==undefined&&nu!==editUser.username){
      if(!nu||String(nu).trim()!==nu){setMsg('שם המשתמש לא יכול להיות ריק או להתחיל/להסתיים ברווח');return;}
      const ur=await sb.rpc('admin_set_username',{p_user_id:String(editUser.id),p_username:nu});
      if(ur.error){setMsg('שגיאה בשינוי שם המשתמש: '+(ur.error.message||''));return;}
      if(ur.data!=='ok'){setMsg('שגיאה: '+ur.data);return;}
    }
    if(editUser._newpwd){
      const pr=await sb.rpc('admin_set_password',{p_user_id:String(editUser.id),p_password:editUser._newpwd});
      if(pr.error||!pr.data){setMsg('שגיאה בעדכון הסיסמה');return;}
    }
    const {error:upErr}=await sb.from('crm_users').update(updates).eq('id',editUser.id);
    if(upErr){setMsg('שגיאה: '+upErr.message);return;}
    setMsg('✅ נשמר!');setEditUser(null);loadUsers();
  };

  const toggleActive=async(u)=>{
    await sb.from('crm_users').update({active:!u.active}).eq('id',u.id);
    loadUsers();
  };

  const PermToggle=({perms,setPerms})=>(
    <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:8}}>
      {PERM_LABELS.map(p=>(
        <button key={p.key} onClick={()=>setPerms({...perms,[p.key]:!perms[p.key]})}
          style={{padding:"6px 12px",borderRadius:20,border:`1.5px solid ${perms[p.key]?CLR.primary:CLR.border}`,
            background:perms[p.key]?CLR.primaryLight:"#fff",color:perms[p.key]?CLR.primary:CLR.muted,
            fontSize:12,cursor:"pointer",fontWeight:perms[p.key]?700:400}}>
          {p.label}
        </button>
      ))}
    </div>
  );

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",direction:"rtl",padding:16}}>
      <div style={{background:"#fff",borderRadius:20,width:"100%",maxWidth:700,maxHeight:"90vh",overflow:"auto",boxShadow:"0 25px 80px rgba(0,0,0,0.2)"}}>
        <div style={{padding:"16px 18px",borderBottom:"1px solid #e2e8f0",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,background:"#fff",zIndex:2}}>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <button onClick={()=>setShowLog(false)} style={{fontSize:18,fontWeight:800,border:"none",background:"none",cursor:"pointer",color:showLog?"#94a3b8":"#0f172a",fontFamily:"inherit"}}>👥 משתמשים</button>
            <button onClick={()=>{setShowLog(true);loadLog();}} style={{fontSize:18,fontWeight:800,border:"none",background:"none",cursor:"pointer",color:showLog?"#0f172a":"#94a3b8",fontFamily:"inherit"}}>📜 פעילות</button>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:22,cursor:"pointer",color:"#64748b"}}>✕</button>
        </div>
        {showLog&&<div style={{padding:"16px 20px"}}>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
            <select value={logUser} onChange={e=>setLogUser(e.target.value)} style={{padding:"7px 10px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:13}}>
              <option value="">כל המשתמשים</option>
              {[...new Set(logRows.map(r=>r.user_name))].filter(Boolean).map(n=><option key={n} value={n}>{n}</option>)}
            </select>
            <button onClick={loadLog} style={{padding:"7px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"#fff",cursor:"pointer",fontSize:13}}>🔄 רענון</button>
          </div>
          {logErr&&<div style={{color:CLR.danger,fontSize:13,marginBottom:8}}>{logErr}</div>}
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {logRows.filter(r=>!logUser||r.user_name===logUser).map(r=><div key={r.id} style={{display:"flex",gap:10,fontSize:13,padding:"8px 10px",borderRadius:8,background:"#f8fafc",flexWrap:"wrap"}}>
              <span style={{color:"#64748b",whiteSpace:"nowrap"}}>{new Date(r.at).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'})}</span>
              <b>{r.user_name}</b><span>{r.action}</span>{r.details&&<span style={{color:"#475569"}}>— {r.details}</span>}
            </div>)}
            {logRows.length===0&&!logErr&&<div style={{color:"#64748b",fontSize:13}}>אין עדיין פעילות רשומה</div>}
          </div>
        </div>}
        {!showLog&&(()=>{
          const IN={width:"100%",boxSizing:"border-box",padding:"10px 12px",borderRadius:10,border:"1.5px solid #e2e8f0",fontSize:15,fontFamily:"inherit",background:"#fff"};

          return <div style={{padding:"16px 16px 24px"}}>
          {msg&&<div style={{background:isErr?"#fef2f2":"#f0fdf4",color:isErr?"#b91c1c":"#15803d",border:"1px solid "+(isErr?"#fecaca":"#bbf7d0"),borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:14,display:"flex",justifyContent:"space-between",gap:8}}><span>{msg}</span><button onClick={()=>setMsg("")} style={{background:"none",border:"none",cursor:"pointer",color:"inherit",fontSize:16}}>✕</button></div>}

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,gap:10}}>
            <span style={{fontWeight:800,fontSize:17}}>משתמשים <span style={{color:"#94a3b8",fontWeight:600,fontSize:14}}>({users.length})</span></span>
            <button onClick={()=>{setShowAdd(!showAdd);setEditUser(null);}}
              style={{padding:"9px 16px",background:showAdd?"#f1f5f9":CLR.primary,color:showAdd?"#475569":"#fff",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700,fontSize:14}}>
              {showAdd?"סגור":"+ משתמש חדש"}
            </button>
          </div>

          {showAdd&&(
            <div style={{background:"#f8fafc",borderRadius:14,padding:16,marginBottom:16,border:`1.5px solid ${CLR.border}`}}>
              <div style={{fontSize:16,fontWeight:800,marginBottom:12}}>משתמש חדש</div>
              <div style={GRID}>
                <div><label style={LB}>שם תצוגה</label><input value={newU.name} onChange={e=>setNewU({...newU,name:e.target.value})} style={IN}/></div>
                <div><label style={LB}>שם משתמש לכניסה</label><input value={newU.username} autoComplete="off" onChange={e=>setNewU({...newU,username:e.target.value})} style={{...IN,direction:"ltr",textAlign:"right"}}/></div>
                <div><label style={LB}>סיסמה</label><input type="password" autoComplete="new-password" value={newU.password} onChange={e=>setNewU({...newU,password:e.target.value})} style={{...IN,direction:"ltr"}}/></div>
                <div><label style={LB}>תפקיד</label><select value={newU.role} onChange={e=>setNewU({...newU,role:e.target.value})} style={IN}><option>מנהל</option><option>פקידה</option><option>מדביר</option></select></div>
              </div>
              {newU.role!=="מנהל"&&<div><label style={LB}>הרשאות — מה המשתמש רואה</label><PermToggle perms={newU.permissions} setPerms={p=>setNewU({...newU,permissions:p})}/></div>}
              <div style={{marginTop:16,display:"flex",gap:8}}>
                <button onClick={saveNew} style={{flex:1,padding:"11px 20px",background:CLR.primary,color:"#fff",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700,fontSize:15}}>✅ צור משתמש</button>

              </div>
            </div>
          )}

          {loading?<div style={{textAlign:"center",padding:40,color:"#64748b"}}>טוען...</div>:(
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {users.map(u=>(
                <div key={u.id} style={{background:u.active?"#fff":"#f8fafc",border:`1.5px solid ${editUser?.id===u.id?CLR.primary:CLR.border}`,borderRadius:14,padding:"14px 16px"}}>
                  {editUser?.id===u.id?(
                    <div>
                      <div style={{fontSize:16,fontWeight:800,marginBottom:12}}>✏️ עריכת {u.name}</div>
                      <div style={GRID}>
                        <div><label style={LB}>שם תצוגה</label><input value={editUser.name} onChange={e=>setEditUser({...editUser,name:e.target.value})} style={IN}/></div>

                          {editUser._newuser!==undefined&&editUser._newuser!==editUser.username&&<div style={{fontSize:12,color:"#b45309",marginTop:4}}>מהשמירה — הכניסה תהיה עם השם החדש</div>}</div>

                      </div>
                      {u.id!==authUser.id&&<label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:14,marginBottom:12}}>
                        <input type="checkbox" checked={editUser.active} onChange={e=>setEditUser({...editUser,active:e.target.checked})} style={{width:18,height:18}}/> משתמש פעיל</label>}
                      {editUser.role!=="מנהל"&&<div><label style={LB}>הרשאות — מה המשתמש רואה</label><PermToggle perms={editUser.permissions||{}} setPerms={p=>setEditUser({...editUser,permissions:p})}/></div>}
                      <div style={{marginTop:14,display:"flex",gap:8}}>

                      </div>
                    </div>
                  ):(
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
                      <div style={{minWidth:0}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                          <span style={{fontWeight:800,fontSize:16,color:u.active?"#0f172a":"#94a3b8"}}>{u.name}</span>
                          <span style={roleBadge(u.role)}>{roleLabel(u.role)}</span>
                          {!u.active&&<span style={{fontSize:12,color:"#ef4444",fontWeight:700}}>⛔ לא פעיל</span>}
                          {u.id===authUser.id&&<span style={{fontSize:12,color:"#64748b"}}>(אתה)</span>}
                        </div>
                        <div style={{fontSize:13,color:"#64748b",marginTop:3,direction:"rtl"}}>כניסה: <span style={{direction:"ltr",unicodeBidi:"isolate",fontWeight:600,color:"#334155"}}>{u.username}</span>

                      </div>
                      <div style={{display:"flex",gap:6,flexShrink:0}}>
                        <button onClick={()=>{setEditUser({...u,permissions:u.permissions||{}});setShowAdd(false);setMsg("");}} style={{padding:"8px 14px",background:"#f1f5f9",border:"none",borderRadius:10,cursor:"pointer",fontSize:14,fontWeight:700}}>✏️ ערוך</button>
                        {u.id!==authUser.id&&<button onClick={()=>toggleActive(u)} title={u.active?"נטרל משתמש":"הפעל משתמש"} style={{padding:"8px 10px",background:u.active?"#fef2f2":"#f0fdf4",border:"none",borderRadius:10,cursor:"pointer",fontSize:14,fontWeight:700,color:u.active?"#dc2626":"#16a34a"}}>{u.active?"⛔":"✅"}</button>}
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}

          <details style={{marginTop:22,background:"#fefce8",border:"1px solid #fde68a",borderRadius:12,padding:"10px 14px"}}>
            <summary style={{cursor:"pointer",fontWeight:700,fontSize:14}}>⭐ קישור לביקורת בגוגל {reviewUrl?"· מוגדר ✓":"· לא מוגדר"}</summary>
            <div style={{fontSize:13,color:"#64748b",margin:"8px 0"}}>הקישור שנשלח ללקוחות בכפתור "בקשת ביקורת". מעתיקים אותו מפרופיל העסק בגוגל ← "בקשת ביקורות".</div>
            <div style={{display:"flex",gap:6}}>
              <input value={reviewUrl} onChange={e=>setReviewUrl(e.target.value)} placeholder="https://g.page/r/..." style={{...IN,flex:1,minWidth:0,direction:"ltr"}}/>
              <button onClick={()=>{try{ if(reviewUrl.trim()) localStorage.setItem('h360_review_url',reviewUrl.trim()); else localStorage.removeItem('h360_review_url'); }catch(e){} setMsg('✅ קישור הביקורת נשמר');}} style={{padding:"0 16px",borderRadius:10,border:"none",background:"#16a34a",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:14}}>שמור</button>
            </div>
          </details>
        </div>;})()}
      </div>
    </div>
  );

}

function openPrintWindow(title, innerHtml){
  const w=window.open("","_blank");
  if(!w){ alert("הדפדפן חסם את חלון ההדפסה. אפשר הופעת חלונות קופצים לאתר."); return; }
  w.document.write(`<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><title>${title}</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,'Segoe UI',sans-serif;}
    body{padding:32px;color:#111;direction:rtl;background:#fff;}
    table{width:100%;border-collapse:collapse;}
    @media print{ .noprint{display:none;} body{padding:12px;} }
    .btnbar{position:fixed;top:10px;left:10px;display:flex;gap:8px;}
    .btnbar button{padding:8px 16px;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:700;}
  </style></head><body>
  <div class="btnbar noprint">
    <button onclick="window.print()" style="background:#1a5c3a;color:#fff;">🖨️ הדפס / שמור PDF</button>
    <button onclick="window.close()" style="background:#eee;color:#333;">סגור</button>
  </div>
  <div style="margin-top:48px;">${innerHtml}</div>
  </body></html>`);
  w.document.close();
}

        "המדביר משתמש בציוד מגן ובמסכת נשימה המיועדים לעבודה עם חומרי הדברה — לכן אין לשהות באזור בזמן הריסוס.",
        "אין לבצע ריסוס על ספות, מיטות, מזרנים או מצעים.",
        "יש להשאיר חלונות פתוחים בזמן ההדברה ולאחריה, על מנת לאפשר אוורור וייבוש מהיר של התכשירים.",
      ],
      after: [
        "אין להיכנס לאזור המטופל במשך שעתיים לפחות, אלא אם המדביר הנחה אחרת.",
        "אין להכניס תינוקות עד גיל שנתיים לאזור המטופל במשך 4 שעות לפחות. הנחיה זו חלה גם על חצר, מרפסת או כל אזור חיצוני שבו בוצעה ההדברה.",
        "אין להחזיר בעלי חיים לאזור המטופל במשך 8 שעות לפחות.",
        "לפני החזרת בעלי חיים או תינוקות זוחלים — חובה לבצע שטיפה יסודית של הרצפה, גם אם טרם חלף זמן ההמתנה המלא.",
        "ניתן לשטוף את הרצפה מיד לאחר הכניסה לאזור המטופל — אין צורך להמתין 24 שעות כמו בהדברות אחרות.",
        "מומלץ להמשיך לבצע שאיבה של שטיחים, ספות ומזרנים בימים שלאחר ההדברה, על מנת לסייע בסילוק ביצים וגלמים שעדיין לא בקעו.",
      ],
      important: [
        "הדברת פרעושים חייבת להתבצע במקביל לטיפול וטרינרי בבעלי החיים — הדברה בלבד, ללא טיפול בבעל החיים, לא תניב תוצאות מלאות ועלולה לגרום להדבקה חוזרת.",
        "הנחיות המדביר בשטח גוברות על ההנחיות הכלליות, בהתאם לסוג התכשירים ולמאפייני המקום המטופל.",

      ],
    },
  };

  const relevantPests = (pests||[]).filter(p=>INST[p]);
  if(!relevantPests.length){ alert("אין הנחיות מפורטות למזיקים שנבחרו עדיין."); return; }

  const dateStr = date ? (()=>{ const [y,m,d]=date.split("-"); return d+"/"+m+"/"+y; })() : "";

  let pestSections = "";

        ${mkList(inst.during,"#b45309","🟡","בזמן הטיפול")}
        ${mkList(inst.after,"#166534","🟢","לאחר הטיפול")}

      .doc-title { font-size: 18px; color: #374151; margin-top: 4px; }
      .meta { background: #f0f9f4; border-right: 4px solid #1a5c3a; padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; }
      .meta-row { margin: 4px 0; font-size: 13px; }
      .meta-row strong { color: #1a5c3a; }
      .pest-block { margin-bottom: 24px; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
      .pest-title { background: #1a5c3a; color: white; padding: 10px 16px; font-size: 15px; font-weight: bold; }
      .section { padding: 10px 16px; border-bottom: 1px solid #f3f4f6; }
      .section:last-child { border-bottom: none; }
      .section-title { font-weight: bold; font-size: 13px; margin-bottom: 6px; }
      ul { margin: 0; padding-right: 20px; }
      li { margin: 5px 0; line-height: 1.6; font-size: 13px; }
      .footer { margin-top: 24px; border-top: 2px solid #1a5c3a; padding-top: 12px; text-align: center; color: #6b7280; font-size: 12px; }
      .important-note { background: #fef3c7; border: 1px solid #fcd34d; border-radius: 6px; padding: 10px 14px; margin-top: 16px; font-size: 13px; }
      @media print { body { padding: 10px; } }
    </style>
    <div class="header">
      <div>
        <div class="company-name">${company.name}</div>
        <div class="doc-title">הנחיות לפני ואחרי טיפול הדברה</div>
      </div>
      <img src="${LOGO_URL}" alt="לוגו"/>
    </div>
    <div class="meta">
      ${customerName ? `<div class="meta-row"><strong>שם הלקוח:</strong> ${customerName}</div>` : ""}
      ${address ? `<div class="meta-row"><strong>כתובת:</strong> ${address}</div>` : ""}
      ${dateStr ? `<div class="meta-row"><strong>תאריך טיפול:</strong> ${dateStr}</div>` : ""}
      ${pests&&pests.length ? `<div class="meta-row"><strong>מזיקים:</strong> ${pests.join(", ")}</div>` : ""}
    </div>
    ${pestSections}
    <div class="important-note">
      ⚠️ <strong>חשוב:</strong> הנחיות המדביר בשטח גוברות על ההנחיות הכלליות. יעילות ההדברה תלויה בהכנת המקום ובשמירה על ההנחיות. לשאלות — צרו קשר עם ${company.name}.
    </div>
    <div class="footer">
      ${company.name} | ${company.licensePrefix} | מסמך זה הופק אוטומטית ממערכת הדברה 360
    </div>`;

  openPrintWindow("הנחיות הדברה — "+customerName, html);
}

    </div>

}

function printInvoice(inv){
  const vat=Math.round(inv.amount*0.18);
  openPrintWindow(`חשבונית ${inv.invoiceNum}`, invoiceHtml({
    company:COMPANY,docNum:inv.invoiceNum,date:inv.date,customerName:inv.customer,
    phone:inv.phone,address:inv.address,pestType:inv.pestType||"",workerName:inv.workerName||"",
    price:inv.amount,vat,total:inv.amount+vat,payMethod:inv.payMethod,
  }));
}
// שליחת סיכום יומן ביצוע ללקוח בוואטסאפ
function execLogWAText(log){
  const pests=(log.pest||[]).join(", ");
  const mats=(log.materials||[]).filter(m=>m&&m.name).map(m=>"\n  • "+m.name+(m.active?" ("+m.active+")":"")+(m.method?" — "+m.method:"")+(m.stations?" · "+m.stations+" תחנות":"")+((m.areas||[]).length?" · "+m.areas.join(", "):"")).join("");
  return ["שלום "+(log.clientName||"")+" 👋","",
    "מצורף סיכום הטיפול שבוצע אצלכם — "+COMPANY.name,
    "📅 תאריך: "+fmtDate(log.date),
    log.address?"📍 כתובת: "+log.address:"",
    (log.scope||[]).length?"🏠 היקף הטיפול: "+log.scope.join(" · "):"",
    pests?"🐛 מזיקים: "+pests:"",
    mats?"🧪 חומרים:"+mats:"",

// Build a client-facing quote (no discounts/combos shown — only what the customer needs).
// quote = {properties:[{label,price,services,areas,guidance:[{pest,prep,during,returnTime,washing,warranty}]}], total}
function buildClientQuoteText({company,customerName,date,timeWindow,address,quote,price}){
  const L=[];
  L.push(`*הצעת מחיר – ${company.name}*`);
  if(customerName) L.push(`לכבוד: ${customerName}`);
  if(address) L.push(`כתובת: ${address}`);
  if(date) L.push(`מועד מתואם: ${fmtDate(date)}${timeWindow?` בין ${timeWindow}`:""}`);
  L.push("");
  L.push("*פירוט השירות והמחיר:*");
  if(quote&&quote.properties&&quote.properties.length){
    quote.properties.forEach(p=>{
      L.push(`• ${p.label} — ${p.services.join(", ")}: *₪${p.price}*`);
    });
    L.push("");
    L.push(`*סה"כ לתשלום (כולל מע"מ): ₪${quote.total}*`);
  } else {
    L.push(`• הדברה: *₪${price}*`);
  }
  // Guidance per pest (client-relevant only)
  const seen=new Set();
  const guides=[];
  (quote?.properties||[]).forEach(p=>{
    if(p.areas) guides.push({title:`אזורי טיפול ב${p.type||"נכס"}`,lines:[p.areas]});
    (p.guidance||[]).forEach(g=>{
      if(seen.has(g.pest)) return; seen.add(g.pest);
      const lines=[];
      if(g.prep) lines.push(`לפני: ${g.prep}`);
      if(g.during) lines.push(`בזמן: ${g.during}`);
      if(g.returnTime) lines.push(`חזרה: ${g.returnTime}`);
      if(g.washing) lines.push(`שטיפה: ${g.washing}`);
      guides.push({title:g.pest,lines});
    });
  });
  if(guides.length){
    L.push("");
    L.push("*הנחיות הכנה והתנהלות:*");
    guides.forEach(gr=>{ L.push(`*${gr.title}:*`); gr.lines.forEach(l=>L.push(`  - ${l}`)); });
  }
  L.push("");
  L.push("ההצעה תקפה ל-14 יום. נשמח לעמוד לשירותכם!");
  return L.join("\n");
}

// Compute the overall progress of a job from its flags.
// Returns {stage, label, color, steps:[{name,done}]}
function jobProgress(appt, execLogs, finance){
  const log = execLogs?.find(l=>l.apptId===appt.id) || appt.executionLog || null;
  const workDone = !!log || appt.status==="בוצע";
  const invoice = finance?.find(f=>f.apptId===appt.id) || null;
  const invoiced = !!invoice;
  const paid = (log?.paymentDone===true) || (invoice && invoice.status==="שולם");
  const cancelled = appt.status==="בוטל";

  const steps=[
    {name:"שובץ",done:true},
    {name:"בוצעה הדברה",done:workDone},
    {name:"הופקה חשבונית",done:invoiced},
    {name:"התקבל תשלום",done:paid},
  ];

  if(cancelled) return {stage:"בוטל",label:"בוטל",color:"#9ca3af",steps};
  if(workDone&&invoiced&&paid) return {stage:"הושלם",label:"✓ הושלם",color:"#16a34a",steps};
  if(workDone&&invoiced) return {stage:"ממתין לתשלום",label:"ממתין לתשלום",color:"#d97706",steps};
  if(workDone&&paid) return {stage:"בוצע, חסרה חשבונית",label:"בוצע · חסר חשבונית",color:"#d97706",steps};
  if(workDone) return {stage:"בוצעה הדברה",label:"בוצעה הדברה",color:"#2563eb",steps};
  if(appt.status==="בדרך") return {stage:"בדרך",label:"בדרך ללקוח",color:"#2563eb",steps};
  return {stage:"ממתין",label:"ממתין לביצוע",color:"#854d0e",steps};
}

// Small horizontal progress tracker
function ProgressTrack({steps,compact=false}){
  return <div style={{display:"flex",alignItems:"center",gap:compact?3:6,flexWrap:"wrap"}}>

      <div key={i} style={{display:"flex",alignItems:"center",gap:compact?3:6}}>
        <span style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:compact?10:12,
          color:s.done?"#16a34a":"#9ca3af",fontWeight:s.done?600:400}}>
          <span style={{width:compact?14:18,height:compact?14:18,borderRadius:"50%",
            background:s.done?"#16a34a":"#e5e7eb",color:"#fff",display:"inline-flex",
            alignItems:"center",justifyContent:"center",fontSize:compact?9:11,flexShrink:0}}>
            {s.done?"✓":i+1}
          </span>
          {!compact&&s.name}
        </span>
        {i<steps.length-1&&<span style={{color:s.done?"#16a34a":"#d1d5db",fontSize:compact?10:12}}>—</span>}
      </div>
    ))}
  </div>;
}

const DOSE_ALIAS = {"פרמנון 200":"פרמנונה 200","פרמנון":"פרמנונה 200"};
function doseKey(name){ if(!name) return null; if(DOSE_LABELS[name]) return name; if(DOSE_ALIAS[name]) return DOSE_ALIAS[name];
  let best=null; for(const k of Object.keys(DOSE_LABELS)){ if(name.includes(k) && (!best||k.length>best.length)) best=k; } return best; }
function doseOptions(name, memory){
  const base=(DOSE_LABELS[doseKey(name)]||[]).map(o=>({...o,src:"label"}));
  const used=((memory[name]||{}).doses||[]).filter(d=>d&&!base.some(o=>o.dose===d)).map(d=>({label:"שימוש קודם",dose:d,pests:[],src:"used"}));
  return [...base,...used];
}
function pickDose(name, pests, memory){
  const opts=doseOptions(name,memory); const P=(pests||[]).join(" ");

const REG_CATS = [["mine","⭐ שלי"],["spray","ריסוס"],["gel","ג'לים"],["rodent","רעלים למכרסמים"],["powder","אבקה יבשה"],["granule","גרגירים ופתיונות"],["other","אחר"],["all","הכל"]];
const CAT_METHOD = {spray:"ריסוס", gel:"ג'ל", rodent:"תחנת האכלה", powder:"אבקה", granule:"פיזור גרגירים", other:"אחר"};
const REG_OVERRIDE = {"טמפריד":"spray","טרמינטור":"spray","דוקסם PDS":"other"};
function regCat(r){
  const [name,,,form,,purpose]=r;
  if(REG_OVERRIDE[name]) return REG_OVERRIDE[name];

  if(/ג'ל|ג׳ל/.test(form||"")) return "gel";
  if((form||"").trim()==="אבקה") return "powder";
  if(/רטיבה|מסיסה|תרכיז|תחליב|מיקרואמולסיה|נוזל|שמן|גרגרים רחיפים|תרחיף|תרסיס|אירוסול|ערפול/.test(form||"")) return "spray";
  if(/פיתיון|פתיון|גרגר/.test(form||"")) return "granule";

function regExpired(r){ const m=String(r[6]||"").match(/(\d+)\/(\d+)\/(\d+)/); if(!m) return false; return new Date(+m[3],+m[2]-1,+m[1])<new Date(); }
function useRegProducts(){
  const [rows,setRows]=useState(()=>{ try{ const c=JSON.parse(localStorage.getItem('h360_reg')||'null'); if(c&&Array.isArray(c.rows)&&c.rows.length>40) return c.rows; }catch(e){} return REG_SNAPSHOT; });

    if(Date.now()-at<7*864e5) return;

      .then(r=>r.json()).then(j=>{

        const out=recs.filter(x=>/מדביר/.test(x.authorized||"")&&!/phosphide|\(חסר\)/i.test(x.active_ingredients||""))
          .map(x=>[String(x.product||"").replace(/\s+/g," ").replace("לתברוא ה","לתברואה").trim(),String(x.holder||"").trim(),String(x.registered_number||""),String(x.formulation||"").trim(),String(x.active_ingredients||"").replace(/\s+/g," ").replace(/,(?=\S)/g,", ").trim(),String(x.purpose||"").trim(),String(x.expiration_date||"")]);
        if(out.length>40){ setRows(out); try{ localStorage.setItem('h360_reg',JSON.stringify({at:Date.now(),rows:out})); }catch(e){} }

function chemMemory(execLogs){
  const mem={};
  [...(execLogs||[])].sort((a,b)=>String(a.date||"").localeCompare(String(b.date||""))).forEach(l=>(l.materials||[]).forEach(m=>{
    if(!m||!m.name) return; const o=mem[m.name]||{};
    const doses=[...new Set([...(o.doses||[]),...(m.dose?[m.dose]:[])])];
    const byPest={...(o.byPest||{})}; if(m.dose) (l.pest||[]).forEach(p=>{ byPest[p]=m.dose; });
    mem[m.name]={batch:m.batch||o.batch||"",method:m.method||o.method||"",active:m.active||o.active||"",reg:m.reg||o.reg||"",cat:m.cat||o.cat||"",maker:m.maker||o.maker||"",doses,byPest};
  }));
  const loc=chemMemLoad();
  Object.keys(loc).forEach(k=>{ const L=loc[k]; const M=mem[k]||{};
    mem[k]={...M,...Object.fromEntries(Object.entries(L).filter(([kk,v])=>v&&kk!=="byPest"&&kk!=="doses")),
      doses:[...new Set([...(M.doses||[]),...(L.doses||[])])], byPest:{...(M.byPest||{}),...(L.byPest||{})}}; });
  return mem;
}

function myChemicals(execLogs, workerName){
  const cnt={}, last={};
  const logs=(execLogs||[]).filter(l=>!l.deleted&&(!workerName||String(l.workerName||"").trim()===String(workerName).trim()));
  logs.forEach(l=>(l.materials||[]).forEach(m=>{ if(!m||!m.name) return; cnt[m.name]=(cnt[m.name]||0)+1; if(String(l.date||"")>(last[m.name]||"")) last[m.name]=l.date||""; }));
  Object.keys(chemMemLoad()).forEach(n=>{ if(!cnt[n]) cnt[n]=0.5; });
  return Object.keys(cnt).sort((a,b)=>(cnt[b]-cnt[a])||String(last[b]||"").localeCompare(String(last[a]||"")));
}

            <button type="button" onClick={()=>updateField(m.name,"stations",String((parseInt(m.stations)||0)+1))} style={{width:34,height:34,borderRadius:8,border:"1px solid #fed7aa",background:"#fff",fontSize:18,cursor:"pointer"}}>+</button>
          </div>}
          <div style={{fontSize:13,color:CLR.muted,marginBottom:6}}>אזורי יישום (לחיצה לבחירה):</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {[...areas,...extra].map(a=>{const on=(m.areas||[]).includes(a);return <button key={a} type="button" onClick={()=>toggleArea(m,a)} style={chip(on)}>{on?"✓ ":""}{a}</button>;})}
          </div>
        </div>;
      })}
    </div>}
  </div>;
}

function PestPickerDk({selected,onChange}){
  const foodOn=selected.includes("חרקי מזון")||selected.some(p=>FOOD_PESTS.includes(p));
  const toggle=p=>{
    if(p==="חרקי מזון"&&foodOn) return onChange(selected.filter(x=>x!=="חרקי מזון"&&!FOOD_PESTS.includes(x)));
    selected.includes(p)?onChange(selected.filter(x=>x!==p)):onChange([...selected,p]);
  };
  const btn=on=>({background:on?CLR.accent+"33":"transparent",color:on?CLR.accent:CLR.muted,border:`1px solid ${on?CLR.accent:"#e2e8f0"}`,borderRadius:8,padding:"6px 11px",fontSize:14,cursor:"pointer",fontFamily:"inherit"});
  return <div>
    <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
      {PEST_TYPES_LOG.map(p=>{ const on=p==="חרקי מזון"?foodOn:selected.includes(p);
        return <button key={p} type="button" onClick={()=>toggle(p)} style={btn(on)}>{on?"✓ ":""}{p}{p==="חרקי מזון"?(foodOn?" ▲":" ▼"):""}</button>; })}
      {selected.filter(p=>!PEST_TYPES_LOG.includes(p)&&!FOOD_PESTS.includes(p)).map(p=><button key={p} type="button" onClick={()=>toggle(p)} style={btn(true)}>✓ {p}</button>)}
    </div>
    {foodOn&&<div style={{marginTop:8,background:"#fffbeb",border:"1px solid #fcd34d",borderRadius:10,padding:"10px 12px"}}>
      <div style={{fontSize:13,fontWeight:700,color:"#92400e",marginBottom:6}}>🌾 איזה חרקי מזון?</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
        {FOOD_PESTS.map(p=>{const on=selected.includes(p);return <button key={p} type="button" onClick={()=>toggle(p)} style={btn(on)}>{on?"✓ ":""}{p}</button>;})}
      </div>
    </div>}
  </div>;
}

function ExecLogForm({worker,prefillAppt,initialData,onPreview,workers=[],appointments=[],customers=[],execLogs=[],maintenance=[]}){
  const chemMem=React.useMemo(()=>chemMemory(execLogs),[execLogs]);
  // Auto-detect worker from appointment
  const apptWorker = prefillAppt ? workers.find(w=>w.id===prefillAppt.workerId) : null;
  const defaultWorker = apptWorker || worker || {};

  const [f,setF]=useState({
    clientName:    initialData?.clientName    || prefillAppt?.customerName || "",
    customerId:    initialData?.customerId    ?? prefillAppt?.customerId ?? null,
    phone:         initialData?.phone         || (customers.find(c=>String(c.id)===String(prefillAppt?.customerId))||{}).phone || "",
    address:       initialData?.address       || prefillAppt?.address      || "",
    structureType: initialData?.structureType || prefillAppt?.structureType || prefillAppt?.propertyType || (customers.find(c=>String(c.id)===String(prefillAppt?.customerId))||{}).propertyType || "",
    pest:          initialData?.pest          || splitPests(Array.isArray(prefillAppt?.pests)&&prefillAppt.pests.length?prefillAppt.pests:(prefillAppt?.pestType?[prefillAppt.pestType]:[])),
    customPest:    initialData?.customPest    || "",
    pestLevel:     initialData?.pestLevel     || "",
    materials:     initialData?.materials_raw || initialData?.materials || [],
    extermination_notes: initialData?.extermination_notes || "",
    warranty:      initialData?.warranty      || "",
    notes:         initialData?.notes         || prefillAppt?.notes || "",
    paymentDone:   initialData?.paymentDone   ?? true,
    paymentNote:   initialData?.paymentNote   || "",
    paymentMethod: initialData?.paymentMethod || "",
    paymentAmount: initialData?.paymentAmount ?? (prefillAppt?.price||""),
    devices:       initialData?.devices       || [],
    reentry:       initialData?.reentry       || {},
    instructions:  initialData?.instructions  || [],
    date:          initialData?.date          || prefillAppt?.date          || todayStr(),
    workerName:    initialData?.workerName    || defaultWorker.name || "",
    workerLicense: initialData?.workerLicense || defaultWorker.licenseNum || "",
    workerLicenseType: initialData?.workerLicenseType || defaultWorker.licenseType || defaultWorker.license || "",
    extraWorkers:  initialData?.extraWorkers  || [],
    scope:         initialData?.scope || scopeFromProperty({...(customers.find(c=>String(c.id)===String(prefillAppt?.customerId))||{}),...Object.fromEntries(Object.entries(prefillAppt||{}).filter(([k,v])=>["propertyType","rooms","floor","floors","hasYard","sewers","buildingAreas"].includes(k)&&v!==undefined&&v!==""))}),
  });
  const [scopeAdd,setScopeAdd]=useState("");
  // חוזה אחזקה של המקום (לבדיקת תחנות האכלה)
  const contract=(maintenance||[]).find(m=>!m.deleted&&(String(m.id)===String(initialData?.maintenanceId??prefillAppt?.maintenanceId)))
    || (maintenance||[]).find(m=>!m.deleted&&m.status==="פעיל"&&(m.stations||[]).length&&String(m.customerName||"").trim()===String(f.clientName||"").trim());
  const [checks,setChecks]=useState(()=>initialData?.stationChecks||[]);
  const stations=(contract&&contract.stations)||[];
  const chk=num=>checks.find(c=>String(c.num)===String(num))||{num,activity:"",baitReplaced:false};
  const setChk=(num,patch)=>setChecks(cs=>{const ex=cs.find(c=>String(c.num)===String(num));return ex?cs.map(c=>String(c.num)===String(num)?{...c,...patch}:c):[...cs,{num,activity:"",baitReplaced:false,...patch}];});
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  // מילוי אוטומטי של זמני שהייה והנחיות — לפי יומנים קודמים עם אותם חומרים, או לפי ברירת מחדל
  const touched=React.useRef({reentry:!!initialData?.reentry,instr:!!(initialData?.instructions||[]).length});
  const matNames=f.materials.map(m=>m.name); const matKey=[...matNames].sort().join("|"); const pestKey=[...f.pest].sort().join("|");
  React.useEffect(()=>{
    if(!matNames.length) return;
    const prev=suggestFromHistory(execLogs,f.workerName,matNames,f.pest);
    const hasSpray=f.materials.some(m=>!m.method||m.method==="ריסוס");
    if(!touched.current.reentry){
      let r=prev&&prev.reentry?{...prev.reentry}:{};
      if(!prev||!prev.reentry){ const lab=matNames.map(n=>REENTRY_LABEL_ADULTS[n]).filter(Boolean).map(Number); if(lab.length) r.adults=String(Math.max(...lab)); }
      setF(x=>({...x,reentry:r}));
    }
    if(!touched.current.instr){
      const ins=prev&&(prev.instructions||[]).length?prev.instructions:(hasSpray?INSTR_BASE.slice(0,2):[]);
      setF(x=>({...x,instructions:ins}));
    }
  },[matKey,pestKey]);
  const setReentry=(k,v)=>{touched.current.reentry=true;setF(x=>({...x,reentry:{...x.reentry,[k]:x.reentry[k]===v?"":v}}));};
  const toggleInstr=t=>{touched.current.instr=true;setF(x=>({...x,instructions:x.instructions.includes(t)?x.instructions.filter(y=>y!==t):[...x.instructions,t]}));};
  const [instrAdd,setInstrAdd]=useState("");
  const addDevice=type=>setF(x=>({...x,devices:x.devices.some(d=>d.type===type)?x.devices:[...x.devices,{type,qty:1,location:""}]}));
  const setDevice=(i,patch)=>setF(x=>({...x,devices:x.devices.map((d,j)=>j===i?{...d,...patch}:d)}));
  const [devOpen,setDevOpen]=useState(false);

  const addExtraWorker=()=>set("extraWorkers",[...f.extraWorkers,{name:"",license:"",licenseType:""}]);
  const updateExtraWorker=(i,k,v)=>setF(x=>({...x,extraWorkers:x.extraWorkers.map((w,j)=>j===i?{...w,[k]:v}:w)}));
  const removeExtraWorker=(i)=>setF(x=>({...x,extraWorkers:x.extraWorkers.filter((_,j)=>j!==i)}));

  const TREAT_METHOD={
    "דלתא סופר":"ריסוס","ספיר":"ריסוס","אודם":"ריסוס","פרמנון":"ריסוס",
    "פרוג'ל תיקנים":"ג'ל","פרוג'ל נמלים":"ג'ל","אלפא ג'ל":"ג'ל","קוינור ג'ל":"ג'ל",
    "ברקת":"ריסוס","שוהם":"ריסוס",
    "אינוויקט גולד":"ג'ל",
    "רטרים בלוק":"תחנת האכלה","רטרים פסטה":"תחנת האכלה",
  };

  const safety=null; // הנחיות בטיחות
  const allPests=[...f.pest,...(f.customPest?[f.customPest]:[])];
  const valid=f.clientName&&f.address&&allPests.length>0&&f.materials.length>0;

  const PEST_LEVELS=["קלה","בינונית","גבוהה","חמורה"];
  const LICENSE_TYPES=["","מדביר דירות","מדביר שטחים פתוחים","מדביר דירות ושטח פתוח","מדביר חקלאי"];

  return <div style={{color:"#0f172a"}}>

    {/* בחירת לקוח קיים — ממלא שם, כתובת, טלפון וסוג מבנה */}
    {customers.length>0&&<div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:12,padding:"12px 14px",marginBottom:14}}>
      <div style={{fontWeight:700,fontSize:13,color:"#1e40af",marginBottom:8}}>👤 לקוח קיים? בחר ונמלא את הפרטים</div>
      <CustomerSearchSelect customers={customers.filter(c=>!c.deleted)} value={f.customerId||""} onChange={(id,c)=>{
        if(!c){ set("customerId",null); return; }
        const ST=["דירה","בית פרטי","בניין משותף","עסק","מסעדה","מפעל","גן ילדים","מחסן","אחר"];
        setF(x=>({...x,customerId:c.id,clientName:c.name||x.clientName,address:c.address||x.address,phone:c.phone||x.phone,
          structureType:ST.includes(c.propertyType)?c.propertyType:(x.structureType||""),scope:scopeFromProperty(c)}));
      }}/>
    </div>}
    {/* Client + Date */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
      <Inp label="שם לקוח *" value={f.clientName} onChange={v=>set("clientName",v)}/>
      <Inp label="תאריך" type="date" value={f.date} onChange={v=>set("date",v)}/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:12,marginBottom:14}}><Inp label="כתובת מלאה *" value={f.address} onChange={v=>set("address",v)}/><Inp label="טלפון לקוח (לשליחה)" value={f.phone} onChange={v=>set("phone",v)}/></div>

    {/* Structure + Pest level */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
      <Sel label="סוג מבנה (לא חובה)" value={f.structureType} onChange={v=>set("structureType",v)}
        options={["","דירה","בית פרטי","בניין משותף","עסק","מסעדה","מפעל","גן ילדים","מחסן","אחר"]}/>
      <div>
        <label style={{fontSize:12,color:CLR.muted,display:"block",marginBottom:6,fontWeight:600}}>רמת נגיעות</label>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {PEST_LEVELS.map(lv=>(
            <button key={lv} type="button" onClick={()=>set("pestLevel",lv)}
              style={{padding:"6px 14px",borderRadius:8,border:"1.5px solid "+(f.pestLevel===lv?CLR.primary:CLR.border),background:f.pestLevel===lv?CLR.primary:"#fff",color:f.pestLevel===lv?"#fff":CLR.muted,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
              {lv}
            </button>
          ))}
        </div>
      </div>
    </div>

    {/* היקף הטיפול (מהזמנת העבודה) — אפשר להסיר מה שלא בוצע */}
    <div style={{background:"#f0f9ff",border:"1px solid #bae6fd",borderRadius:12,padding:"12px 14px",marginBottom:14}}>
      <div style={{fontWeight:700,fontSize:13,color:"#075985",marginBottom:8}}>🏠 היקף הטיפול {f.scope.length?<span style={{fontWeight:400,color:CLR.muted,fontSize:12}}>(מהזמנת העבודה — ✕ להסרה)</span>:null}</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
        {f.scope.map((x,i)=><span key={i} style={{display:"inline-flex",alignItems:"center",gap:6,background:"#fff",border:"1px solid #7dd3fc",color:"#0c4a6e",borderRadius:20,padding:"6px 6px 6px 12px",fontSize:14,fontWeight:600}}>
          {x}<button type="button" onClick={()=>set("scope",f.scope.filter((_,j)=>j!==i))} style={{border:"none",background:"#e0f2fe",color:"#0369a1",borderRadius:"50%",width:24,height:24,cursor:"pointer",fontSize:13}}>✕</button></span>)}
        {f.scope.length===0&&<span style={{fontSize:13,color:CLR.muted}}>לא הוגדר — אפשר להוסיף</span>}
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {["ריסוס במבנה","חצר / גינה","בורות ביוב","חדר מדרגות","גג"].filter(x=>!f.scope.some(y=>y.startsWith(x))).map(x=><button key={x} type="button" onClick={()=>set("scope",[...f.scope,x])} style={{border:"1px dashed #7dd3fc",background:"transparent",color:"#0369a1",borderRadius:20,padding:"5px 10px",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>+ {x}</button>)}
        <input value={scopeAdd} onChange={e=>setScopeAdd(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&scopeAdd.trim()){set("scope",[...f.scope,scopeAdd.trim()]);setScopeAdd("");}}} placeholder="אחר..." style={{flex:"1 1 90px",minWidth:80,padding:"5px 10px",borderRadius:20,border:"1px solid #bae6fd",fontSize:13,fontFamily:"inherit"}}/>
        {scopeAdd.trim()&&<button type="button" onClick={()=>{set("scope",[...f.scope,scopeAdd.trim()]);setScopeAdd("");}} style={{border:"none",background:"#0284c7",color:"#fff",borderRadius:20,padding:"5px 12px",fontSize:13,cursor:"pointer"}}>הוסף</button>}
      </div>
    </div>

    {/* Pests */}
    <div style={{marginBottom:14}}>
      <label style={{fontSize:12,color:CLR.muted,display:"block",marginBottom:6,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px"}}>מזיקים *</label>

        <input value={f.customPest} onChange={e=>set("customPest",e.target.value)} placeholder="מזיק אחר (הקלד בחופשי)..."
          style={{flex:1,padding:"7px 10px",borderRadius:8,border:"1.5px solid "+CLR.border,fontSize:13,fontFamily:"inherit"}}/>
        {f.customPest&&<span style={{background:CLR.primaryLight,color:CLR.primary,padding:"4px 10px",borderRadius:20,fontSize:12,fontWeight:600}}>✓ {f.customPest}</span>}

      </div>
      {stations.map(st=>{const c=chk(st.num);return <div key={st.num} style={{background:"#fff",border:"1px solid #fed7aa",borderRadius:10,padding:"8px 10px",marginBottom:6}}>
        <div style={{fontSize:13,fontWeight:700,marginBottom:6}}>תחנה {st.num}{st.location?<span style={{fontWeight:400,color:CLR.muted}}> · {st.location}</span>:null}</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:5,alignItems:"center"}}>
          {STATION_ACTIVITY.map(a=>{const on=c.activity===a;const col=a==="פעילות גבוהה"?"#dc2626":a==="פעילות קלה"?"#ca8a04":a==="חסרה / פגומה"?"#475569":"#16a34a";return <button key={a} type="button" onClick={()=>setChk(st.num,{activity:a})} style={{padding:"5px 10px",borderRadius:20,border:`1.5px solid ${on?col:CLR.border}`,background:on?col:"#fff",color:on?"#fff":"#334155",fontSize:12,fontWeight:on?700:500,cursor:"pointer",fontFamily:"inherit"}}>{a}</button>;})}
          <label style={{display:"flex",alignItems:"center",gap:4,fontSize:12,marginRight:"auto",cursor:"pointer"}}><input type="checkbox" checked={!!c.baitReplaced} onChange={e=>setChk(st.num,{baitReplaced:e.target.checked})}/> הוחלף פיתיון</label>
        </div>
      </div>;})}
    </div>}
    {/* מוצרי הדברה — מלכודות, תחנות ניטור, אמצעי מניעה */}
    <div style={{background:"#faf5ff",border:"1px solid #e9d5ff",borderRadius:12,padding:"12px 14px",marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
        <div style={{fontWeight:800,fontSize:14,color:"#6b21a8"}}>🪤 מוצרי הדברה <span style={{fontWeight:400,color:CLR.muted,fontSize:12}}>(מלכודות, ניטור, מניעה — לא חובה)</span></div>
        <button type="button" onClick={()=>setDevOpen(o=>!o)} style={{border:"1px solid #d8b4fe",background:"#fff",color:"#7e22ce",borderRadius:8,padding:"5px 10px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{devOpen?"סגור":"+ הוסף"}</button>
      </div>
      {devOpen&&<div style={{marginTop:10}}>{DEVICE_TYPES.map(g=><div key={g.g} style={{marginBottom:8}}>
        <div style={{fontSize:12,color:CLR.muted,fontWeight:700,marginBottom:4}}>{g.g}</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{g.items.map(it=>{const on=f.devices.some(d=>d.type===it);return <button key={it} type="button" onClick={()=>on?set("devices",f.devices.filter(d=>d.type!==it)):addDevice(it)} style={{padding:"6px 11px",borderRadius:20,border:"1.5px solid "+(on?"#9333ea":"#e9d5ff"),background:on?"#9333ea":"#fff",color:on?"#fff":"#581c87",fontSize:13,fontWeight:on?700:500,cursor:"pointer",fontFamily:"inherit"}}>{on?"✓ ":""}{it}</button>;})}</div>
      </div>)}</div>}
      {f.devices.map((d,i)=><div key={d.type} style={{background:"#fff",border:"1px solid #e9d5ff",borderRadius:10,padding:"8px 10px",marginTop:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <b style={{fontSize:14,flex:"1 1 140px"}}>{d.type}</b>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <button type="button" onClick={()=>setDevice(i,{qty:Math.max(1,(parseInt(d.qty)||1)-1)})} style={{width:30,height:30,borderRadius:8,border:"1px solid #d8b4fe",background:"#fff",fontSize:16,cursor:"pointer"}}>−</button>

        </div>

class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(err){return {err};}
  componentDidCatch(err,info){try{console.error("UI error:",err,info);}catch(e){}}
  render(){ if(!this.state.err) return this.props.children;
    return <div style={{padding:24,direction:"rtl",fontFamily:"system-ui,sans-serif",textAlign:"center"}}>
      <div style={{fontSize:40}}>⚠️</div>
      <div style={{fontWeight:700,fontSize:17,margin:"8px 0"}}>משהו השתבש בתצוגה</div>
      <div style={{fontSize:13,color:"#64748b",marginBottom:16}}>הנתונים שמורים. אפשר לחזור ולהמשיך לעבוד.</div>
      <button onClick={()=>{this.setState({err:null}); if(this.props.onReset) this.props.onReset();}} style={{background:"#16a34a",color:"#fff",border:"none",borderRadius:10,padding:"10px 20px",fontSize:15,fontWeight:700,marginLeft:8}}>חזרה</button>
      <button onClick={()=>location.reload()} style={{background:"#f1f5f9",border:"1px solid #cbd5e1",borderRadius:10,padding:"10px 20px",fontSize:15}}>רענון</button>
      <div style={{fontSize:11,color:"#94a3b8",marginTop:14,direction:"ltr"}}>{String(this.state.err&&this.state.err.message||"")}</div>
    </div>; }
}

  const [prefillAppt,setPrefillAppt]=useState(null);

  const [formKey,setFormKey]=useState(0);
  const [previewData,setPreviewData]=useState(null);
  const [viewLog,setViewLog]=useState(null);

  const myLogs = currentUser.role==="מדביר"
    ? execLogs.filter(l=>l.workerId===currentUser.id||l.workerName===workerObj.name)

  const pendingAppts = appointments.filter(a=>{
    if(currentUser.role==="מדביר") return a.workerId===currentUser.id&&a.status!=="בוצע"&&a.status!=="בוטל";

    const wName = data.workerName || aptWorker?.name || workerObj.name;
    const wLicense = data.workerLicense || selW?.licenseNum || aptWorker?.licenseNum || workerObj.licenseNum || "";
    const wId = selW?.id || aptWorker?.id || workerObj.id || null;
    const newLog={id:savedLog?savedLog.id:nextId(execLogs),docNum:savedLog?savedLog.docNum:nextExecNum(execLogs),apptId:prefillAppt?.id||null,customerId:data.customerId||prefillAppt?.customerId||null,phone:data.phone||"",workerLicenseType:data.workerLicenseType||"",extraWorkers:data.extraWorkers||[],scope:data.scope||[],maintenanceId:data.maintenanceId||null,stationChecks:data.stationChecks||[],date:data.date,clientName:data.clientName,address:data.address,structureType:data.structureType,pest:data.pest,pestLevel:data.pestLevel,materials:data.materials,extermination_notes:data.extermination_notes,warranty:data.warranty,notes:data.notes,workerId:wId,workerName:wName,workerDocName:docNameOf(selW||aptWorker||workerObj)||wName,workerLicense:wLicense,safetyText:data.safety,paymentDone:data.paymentDone,paymentNote:data.paymentNote,paymentMethod:data.paymentDone?(data.paymentMethod||""):"",paymentAmount:data.paymentDone?(data.paymentAmount||""):"",devices:(data.devices||[]).filter(d=>d.type),reentry:data.reentry||{},instructions:data.instructions||[]};
    setExecLogs(ls=>savedLog?ls.map(l=>l.id===newLog.id?newLog:l):[newLog,...ls]);
    if(prefillAppt) setAppointments(as=>as.map(a=>a.id===prefillAppt.id?{...a,status:"בוצע",executionLog:newLog}:a));
    setSavedLog(newLog);
    return newLog;
  };

    </div>
  );

    <div style={{background:"#f8fafc",minHeight:"100%",padding:20,direction:"rtl",fontFamily:"'Inter','Segoe UI',system-ui,sans-serif",color:"#0f172a"}}>

              </div>;})}
          </div>
      }
    </div>
  );
}

const calcInitialTab = () => ({
  type:'דירה', applySurcharges:true, rooms:3, levels:1, floors:4,
  yardType:'none', yardExtra:0, sewers:0, apartments:[], showAptSection:false,
  customName:'', customPrice:'', pests:[], pestScopes:{}, extras:{}, itemCounts:{},
  customPrices:{}, customPestNames:{}, exclusions:[], carcassType:'', carcassSearch:false,
});

// Exact pricing engine — ported verbatim from the user's orderDetails useMemo.
// tabsState: { tabId: tabData }. manualOverrides: { uniqueId: {regular,discount,special} }
function computeOrderDetails(tabsState, manualOverrides){
  let grandTotals = { regular:0, discount:0, special:0 };
  let finalItems = [];
  let groupedItems = {};
  Object.keys(tabsState).forEach(tab=>{ groupedItems[tab]={items:[],subtotals:{regular:0,discount:0,special:0}}; });

  const hasBuildingBaseInOrder = Object.keys(tabsState).some(tabKey=>{
    const data=tabsState[tabKey];
    return data.type==='בניין משותף' && data.pests.some(id=>{ const p=PEST_DATA.find(x=>x.id===id); return p&&(p.isBuildingBase||p.isGeneralProperty); });
  });

  Object.keys(tabsState).forEach(tab=>{
    const tabData=tabsState[tab]; if(!tabData) return;
    const hasActivePestsBase=(tabData.pests||[]).length>0;
    const hasApts=(tabData.apartments||[]).length>0;
    if(!hasActivePestsBase && !tabData.customPrice && !hasApts) return;

    let tabPestsRaw=[];
    const standardInsectsCount=(tabData.pests||[]).filter(id=>{ const p=PEST_DATA.find(x=>x.id===id); return p&&p.category==='insects'&&!p.isCustom; }).length;
    const hasStandardInsects=standardInsectsCount>0;
    const isBuildingTab=tabData.type==='בניין משותף';
    const isYardOnly=tabData.yardType==='only';

    (tabData.pests||[]).forEach(pestId=>{
      let pest={...PEST_DATA.find(p=>p.id===pestId)};
      if(!pest.id) return;
      let standaloneReg=pest.regular, standaloneDis=pest.discount, standaloneSpe=pest.special;
      let extraCharge=tabData.extras[pestId]||0;
      let itemDetails='';
      const count=tabData.itemCounts[pestId]||1;

      if(pest.isAmRoach){
        let scope=tabData.pestScopes?.[pestId]||'regular';
        if(scope==='sewers_only'){ pest.isGeneralProperty=false; pest.applyRoomSurcharge=false; standaloneReg=450; standaloneDis=400; standaloneSpe=350; const extraSewers=Math.max(0,count-5); extraCharge+=(extraSewers*40); itemDetails=` (ביובים בלבד - ${count} פתחים)`; }
        else if(scope==='other_only'){ pest.isGeneralProperty=false; pest.applyRoomSurcharge=false; itemDetails=` (אזור ספציפי / מוגדר בלבד)`; }
      }
      if(pest.isCarcass){
        let typeExtra=0;
        if(tabData.carcassType==='חולדה') typeExtra=50;
        if(tabData.carcassType==='חתול') typeExtra=150;
        if(tabData.carcassType==='כלב') typeExtra=250;
        let searchExtra=tabData.carcassSearch?100:0;
        pest.c_typeExtra=typeExtra; pest.c_searchExtra=searchExtra;
        standaloneReg+=typeExtra+searchExtra; standaloneDis+=typeExtra+searchExtra; standaloneSpe+=typeExtra+searchExtra;
        let cDetails=[]; if(tabData.carcassType) cDetails.push(`סוג: ${tabData.carcassType}`); if(tabData.carcassSearch) cDetails.push('כולל חיפוש ואיתור');
        if(cDetails.length>0) itemDetails=` (${cDetails.join(' | ')})`;
      } else if(pest.isAptInBuilding){ return; }
      else if(pest.isRodentIndoor){
        const hasOutdoorRodent=(tabData.pests||[]).includes('rodents_outdoor');
        if(hasStandardInsects&&hasOutdoorRodent){ standaloneReg=count*150; standaloneDis=count*120; standaloneSpe=count*100; }
        else { standaloneReg=450+(count-1)*150; standaloneDis=400+(count-1)*150; standaloneSpe=350+(count-1)*150; }
        itemDetails=` (${count} ביקורים)`;
      } else if(pest.isRodentOutdoor||pest.id==='building_rodents'){
        if(hasStandardInsects){ standaloneReg=count*150; standaloneDis=count*135; standaloneSpe=count*120; }
        else { const extraCount=Math.max(0,count-2); standaloneReg=300+(extraCount*150); standaloneDis=300+(extraCount*150); standaloneSpe=300+(extraCount*150); }
        itemDetails=` (${count} תיבות)`;
      } else if(pest.isRodentRefill){
        const extraCount=Math.max(0,count-4); standaloneReg=300+(extraCount*50); standaloneDis=300+(extraCount*40); standaloneSpe=300+(extraCount*30); itemDetails=` (${count} תיבות)`;
      } else if(pest.isRodentSewers){
        const extraCount=Math.max(0,count-3); standaloneReg=300+(extraCount*50); standaloneDis=300+(extraCount*40); standaloneSpe=300+(extraCount*30); itemDetails=` (${count} ביובים)`;
      } else if(pest.isCustom){
        standaloneReg=Number(tabData.customPrices[pestId])||0; standaloneDis=standaloneReg; standaloneSpe=standaloneReg;
      }

      let currentName=pest.name;
      if(pest.isFreeTextName&&tabData.customPestNames?.[pestId]) currentName=tabData.customPestNames[pestId];

      if(isYardOnly&&pest.isGeneralProperty&&pest.id!=='am_roach'){ standaloneReg=350; standaloneDis=300; standaloneSpe=250; }
      else if(isBuildingTab&&pest.isGeneralProperty&&pest.id!=='am_roach'){
        standaloneReg=Math.max(450,standaloneReg); standaloneDis=Math.max(400,standaloneDis); standaloneSpe=Math.max(350,standaloneSpe);
        const ex=tabData.exclusions||[];
        if(ex.length>0){ const exText=ex.map(e=>e==='אחר'?'החרגה אחרת':`ללא ${e}`).join(', '); itemDetails+=` (החרגות: ${exText})`; }
      }
      tabPestsRaw.push({ ...pest, tab, name:currentName, standaloneReg, standaloneDis, standaloneSpe, count, extraCharge, itemDetails, uniqueId:`${tab}_${pest.id}` });
    });

    let standardItems=tabPestsRaw.filter(p=>!p.isCustom);
    let customItems=tabPestsRaw.filter(p=>p.isCustom);
    standardItems.sort((a,b)=>{
      const getPriority=p=>{ if(p.isBuildingBase) return 4; if(p.isGeneralProperty) return 3; if(p.category==='rodents') return 2; return 1; };
      const pA=getPriority(a),pB=getPriority(b);
      if(pA!==pB) return pB-pA;
      return b.standaloneSpe-a.standaloneSpe;
    });

    let tabFinalItems=[];
    let tabTotals={regular:0,discount:0,special:0};
    const pushItem=(itemData)=>{
      const oR=manualOverrides[itemData.uniqueId]?.regular, oD=manualOverrides[itemData.uniqueId]?.discount, oS=manualOverrides[itemData.uniqueId]?.special;
      const finalReg=(oR!==undefined&&oR!=='')?Number(oR):itemData.calcRegular;
      const finalDis=(oD!==undefined&&oD!=='')?Number(oD):itemData.calcDiscount;
      const finalSpe=(oS!==undefined&&oS!=='')?Number(oS):itemData.calcSpecial;
      tabTotals.regular+=finalReg; tabTotals.discount+=finalDis; tabTotals.special+=finalSpe;
      tabFinalItems.push({ ...itemData, calcRegular:finalReg, calcDiscount:finalDis, calcSpecial:finalSpe });
    };

    standardItems.forEach((pest,index)=>{
      const isAnchor=index===0, isCombo=!isAnchor, anchor=standardItems[0];
      let calcReg=pest.standaloneReg, calcDis=pest.standaloneDis, calcSpe=pest.standaloneSpe;
      let comboText='', comboBadge='';
      if(!isBuildingTab&&pest.isGeneralProperty&&hasBuildingBaseInOrder){
        const isBasicPest=['am_roach','ants','silverfish'].includes(pest.id);
        if(isBasicPest){ calcReg=400; calcDis=350; calcSpe=300; comboText=' (משולב עם בניין - בסיס)'; comboBadge='דירה בבניין (בסיס)'; }
        else { calcReg=Math.round((pest.standaloneReg*0.7)/10)*10; calcDis=Math.round((pest.standaloneDis*0.7)/10)*10; calcSpe=Math.round((pest.standaloneSpe*0.7)/10)*10; comboText=' (משולב עם בניין - 30% הנחה)'; comboBadge='דירה בבניין (חריג)'; }
        if(isCombo&&pest.category==='insects'){ calcReg=100; calcDis=50; calcSpe=50; comboBadge='מזיק נוסף בדירה'; }
      } else if(isCombo){
        if(pest.isAptInBuilding){ /* surcharge */ }
        else if(pest.isGeneralProperty&&anchor.isGeneralProperty){ calcReg=100; calcDis=50; calcSpe=50; comboText=' (שירות חופף)'; comboBadge='הנחת שירות חופף'; }
        else if(pest.category==='insects'){ calcReg=Math.floor((calcReg*0.5)/50)*50||50; calcDis=Math.floor((calcDis*0.5)/50)*50||50; calcSpe=Math.floor((calcSpe*0.5)/50)*50||50; comboText=' (שירות משולב)'; comboBadge='הנחת שילוב מזיק'; }
        else if(pest.category==='removals'){
          if(pest.isCarcass){ let comboBase=50; if(pest.c_typeExtra>0) comboBase+=50; if(pest.c_searchExtra>0) comboBase+=50; calcReg=comboBase+50; calcDis=comboBase; calcSpe=comboBase; comboText=' (מוזל בשילוב)'; comboBadge='מוזל לשילוב'; }
          else { calcReg=150; calcDis=100; calcSpe=100; comboText=' (מוזל בשילוב)'; comboBadge='מוזל לשילוב'; }
        }
        else if(pest.category==='inspections'){ calcReg=100; calcDis=50; calcSpe=50; comboText=' (מוזל בשילוב)'; comboBadge='מוזל לשילוב'; }
        else if(pest.isRodentIndoor){ calcReg=pest.count*150; calcDis=pest.count*120; calcSpe=pest.count*100; comboText=' (מוזל בשילוב שירות)'; comboBadge='מוזל לשילוב'; }
        else if(pest.isRodentOutdoor){ calcReg=pest.count*150; calcDis=pest.count*135; calcSpe=pest.count*120; comboText=' (120₪ לתיבה בשילוב)'; comboBadge='120₪ לתיבה'; }
        else if(pest.isRodentRefill||pest.isRodentSewers){ calcReg=pest.count*50; calcDis=pest.count*40; calcSpe=pest.count*30; comboText=' (מוזל בשילוב שירות)'; comboBadge='מוזל לשילוב'; }
        else if(pest.category==='specials'){ calcReg*=0.8; calcDis*=0.75; calcSpe*=0.7; comboBadge='הנחת שילוב'; }
      }
      pest.itemDetails+=comboText;
      calcReg+=pest.extraCharge; calcDis+=pest.extraCharge; calcSpe+=pest.extraCharge;
      calcReg=Math.round(calcReg/10)*10; calcDis=Math.round(calcDis/10)*10; calcSpe=Math.round(calcSpe/10)*10;
      let oReg=Math.round((pest.standaloneReg+pest.extraCharge)/10)*10, oDis=Math.round((pest.standaloneDis+pest.extraCharge)/10)*10, oSpe=Math.round((pest.standaloneSpe+pest.extraCharge)/10)*10;
      pushItem({ ...pest, isDiscountedCombo:isCombo, comboBadge, calcRegular:calcReg, calcDiscount:calcDis, calcSpecial:calcSpe, origRegular:oReg, origDiscount:oDis, origSpecial:oSpe });
    });

    customItems.forEach(pest=>{
      let cReg=Math.round((pest.standaloneReg+pest.extraCharge)/10)*10, cDis=Math.round((pest.standaloneDis+pest.extraCharge)/10)*10, cSpe=Math.round((pest.standaloneSpe+pest.extraCharge)/10)*10;
      pushItem({ ...pest, isDiscountedCombo:false, calcRegular:cReg, calcDiscount:cDis, calcSpecial:cSpe, origRegular:cReg, origDiscount:cDis, origSpecial:cSpe });
    });

    if(isBuildingTab&&(tabData.apartments||[]).length>0){
      tabData.apartments.forEach(apt=>{
        const p=Number(apt.price);
        pushItem({ uniqueId:`${tab}_apt_${apt.id}`, tab, name:`הדברת דירה בבניין (דירה ${apt.aptNumber}${apt.floor?`, קומה ${apt.floor}`:''})`, itemDetails:`מזיק: ${apt.pestType}`, calcRegular:p, calcDiscount:p, calcSpecial:p, origRegular:p, origDiscount:p, origSpecial:p, isSurcharge:true, comboBadge:apt.pestType.includes('תיקנים')?'הטבת דירה בבניין':'דירה בבניין (הנחה)' });
      });
    }

    const hasActivePests=tabFinalItems.some(i=>!i.isSurcharge);
    if(hasActivePests||tabData.customPrice>0||hasApts){
      const pushSurcharge=(id,name,reg,dis,spe)=>{ let r=Math.round(reg/10)*10,d=Math.round(dis/10)*10,s=Math.round(spe/10)*10; pushItem({uniqueId:id,tab,name,calcRegular:r,calcDiscount:d,calcSpecial:s,origRegular:r,origDiscount:d,origSpecial:s,isSurcharge:true}); };
      if(tabData.applySurcharges&&hasActivePests){
        if(isYardOnly){
          if(tabData.yardExtra>0) pushSurcharge(`${tab}_yard_extra`,`תוספת חצר (גודל חריג)`,tabData.yardExtra,tabData.yardExtra,tabData.yardExtra);
          if(tabData.sewers>3){ const e=tabData.sewers-3,sp=e*40; pushSurcharge(`${tab}_sewers`,`תוספת ${e} פתחי ביוב (מעל 3)`,sp,sp,sp); }
        } else if(isBuildingTab){
          if(tabFinalItems.some(i=>i.isGeneralProperty||i.isBuildingBase)){
            if(tabData.floors>3){ const c50=1,c100=tabData.floors>4?(tabData.floors-4):0; const v=c50*50+c100*100; pushSurcharge(`${tab}_floors`,`תוספת גובה (${tabData.floors} קומות)`,v,v,v); }
            if(tabData.yardType==='none') pushSurcharge(`${tab}_yard_discount`,`זיכוי (ללא חצר)`,-50,-50,-50);
            else if(tabData.yardExtra>0) pushSurcharge(`${tab}_yard_extra`,`תוספת חצר (גודל חריג)`,tabData.yardExtra,tabData.yardExtra,tabData.yardExtra);
            if(tabData.sewers>5){ const e=tabData.sewers-5,sp=e*40; pushSurcharge(`${tab}_sewers`,`תוספת ${e} פתחי ביוב (מעל 5)`,sp,sp,sp); }
          }
        } else {
          if(tabFinalItems.some(i=>i.isGeneralProperty)){
            if(tabData.rooms>3) pushSurcharge(`${tab}_rooms`,`תוספת גודל (${tabData.rooms} חדרים)`,(tabData.rooms-3)*50,(tabData.rooms-3)*50,(tabData.rooms-3)*50);
            if(tabData.levels>1) pushSurcharge(`${tab}_levels`,`תוספת ${tabData.levels} מפלסים`,(tabData.levels-1)*50,(tabData.levels-1)*50,(tabData.levels-1)*50);
            if(tabData.yardType==='included'){ const ry=100+(tabData.yardExtra||0); pushSurcharge(`${tab}_yard`,`הדברת חצר (כולל עד 3 ביובים)`,ry,ry,ry); }
            let freeSewers=tabData.yardType==='included'?3:0;
            if(tabData.sewers>freeSewers){ const e=tabData.sewers-freeSewers,sp=e*40; pushSurcharge(`${tab}_sewers`,`תוספת ${e} פתחי ביוב`,sp,sp,sp); }
          }
        }
      }
      if(tabData.customPrice>0){ const val=Number(tabData.customPrice); pushSurcharge(`${tab}_custom`,tabData.customName||'תוספת מיוחדת',val,val,val); }
    }

    groupedItems[tab].items=tabFinalItems;
    groupedItems[tab].subtotals=tabTotals;
    grandTotals.regular+=tabTotals.regular; grandTotals.discount+=tabTotals.discount; grandTotals.special+=tabTotals.special;
    finalItems.push(...tabFinalItems);
  });

  return { items:finalItems, groupedItems, totals:grandTotals, totalItemsCount:finalItems.length };
}

// ─── Full calculator UI (inline-styled, faithful behavior) ───
function PricingCalculator({onApply,embedded=false,initialProperty={},externalState=null,setExternalState=null}){
  const [internalState,setInternalState]=useState(()=>{ const t=calcInitialTab(); if(initialProperty.type) t.type=initialProperty.type; if(initialProperty.rooms) t.rooms=initialProperty.rooms; if(initialProperty.floors) t.floors=initialProperty.floors; if(initialProperty.type==='בניין משותף'){t.yardType='included';t.sewers=5;} return {tab1:t}; });
  // If a parent passes externalState, use it (so selections persist across remounts)
  const tabsState = externalState || internalState;
  const setTabsState = setExternalState || setInternalState;
  const [activeTab,setActiveTab]=useState('tab1');
  const [activeCat,setActiveCat]=useState('insects');
  const [tier,setTier]=useState('discount');
  const [multiDiscount,setMultiDiscount]=useState(0);
  const [manualPrice,setManualPrice]=useState(null); // null = use auto-calculated
  const [newApt,setNewApt]=useState({floor:'',aptNumber:'',pestType:'תיקנים/נמלים',customPestName:'',price:250});

  const T=tabsState[activeTab];
  const setTab=(k,v)=>setTabsState(p=>({...p,[activeTab]:{...p[activeTab],[k]:v}}));
  const isBuilding=T.type==='בניין משותף';
  const isYardOnly=T.yardType==='only';

  const order=computeOrderDetails(tabsState,{});
  const tierKey=tier==='regular'?'calcRegular':tier==='discount'?'calcDiscount':'calcSpecial';
  const totalKey=tier;
  const autoGrand=Math.max(0,order.totals[totalKey]-multiDiscount);
  const grand=manualPrice!==null?manualPrice:autoGrand; // manual override takes priority
  const vatIncluded=Math.round(grand-(grand/1.18));
  const beforeVat=grand-vatIncluded;

  const togglePest=id=>{
    const has=(T.pests||[]).includes(id);
    if(has){ const np=T.pests.filter(x=>x!==id); const nc={...T.itemCounts},ns={...T.pestScopes},ncp={...T.customPrices}; delete nc[id];delete ns[id];delete ncp[id]; setTabsState(p=>({...p,[activeTab]:{...p[activeTab],pests:np,itemCounts:nc,pestScopes:ns,customPrices:ncp}})); }
    else { setTabsState(p=>({...p,[activeTab]:{...p[activeTab],pests:[...(p[activeTab].pests||[]),id],itemCounts:{...p[activeTab].itemCounts,[id]:1}}})); }
  };
  const setCount=(id,v)=>setTabsState(p=>({...p,[activeTab]:{...p[activeTab],itemCounts:{...p[activeTab].itemCounts,[id]:Math.max(1,v)}}}));
  const setCustomPrice=(id,v)=>setTabsState(p=>({...p,[activeTab]:{...p[activeTab],customPrices:{...p[activeTab].customPrices,[id]:Math.max(0,parseInt(v)||0)}}}));
  const setScope=(id,v)=>setTabsState(p=>({...p,[activeTab]:{...p[activeTab],pestScopes:{...p[activeTab].pestScopes,[id]:v}}}));
  const setCustomName=(id,v)=>setTabsState(p=>({...p,[activeTab]:{...p[activeTab],customPestNames:{...p[activeTab].customPestNames,[id]:v}}}));
  const setExtra=(id,v)=>setTabsState(p=>({...p,[activeTab]:{...p[activeTab],extras:{...p[activeTab].extras,[id]:Math.max(0,parseInt(v)||0)}}}));
  const addExtra=(id,amt)=>setTabsState(p=>({...p,[activeTab]:{...p[activeTab],extras:{...p[activeTab].extras,[id]:Math.max(0,(p[activeTab].extras[id]||0)+amt)}}}));

  const addTab=()=>{ const id=`tab_${Date.now()}`; setTabsState(p=>({...p,[id]:calcInitialTab()})); setActiveTab(id); };
  const removeTab=(id)=>{ if(Object.keys(tabsState).length===1){alert('חייב להישאר נכס אחד');return;} const ns={...tabsState}; delete ns[id]; setTabsState(ns); if(activeTab===id) setActiveTab(Object.keys(ns)[0]); };

  const toggleExclusion=(area)=>{
    const cur=T.exclusions||[]; const isEx=cur.includes(area);
    let ne=isEx?cur.filter(a=>a!==area):[...cur,area];
    let upd={...T,exclusions:ne};
    if(area==='חצר'){ upd.yardType=isEx?'none':'included'; if(isEx)upd.yardExtra=0; }
    if(area==='ביובים') upd.sewers=isEx?5:0;
    setTabsState(p=>({...p,[activeTab]:upd}));
  };
  const addApt=()=>{
    const aptNum=newApt.aptNumber.trim()||'לא צוין';
    const finalPest=newApt.pestType==='אחר'&&newApt.customPestName.trim()?newApt.customPestName.trim():newApt.pestType;
    const apt={...newApt,aptNumber:aptNum,pestType:finalPest,id:Date.now().toString()};

        guidance,
      });
    });
    onApply&&onApply({price:grand,priceWithVat:grand,pests:pestNames,properties,total:grand});
  };

  const chip=(active)=>({padding:"6px 12px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:active?700:500,background:active?CLR.primary:CLR.surface,color:active?"#fff":CLR.muted,border:`1px solid ${active?CLR.primary:CLR.border}`});

          {Object.keys(tabsState).length>1&&<button type="button" onClick={()=>removeTab(tk)} style={{background:"#fee2e2",color:CLR.danger,border:"none",borderRadius:"0 8px 8px 0",padding:"7px 8px",cursor:"pointer",fontSize:12}}>✕</button>}
        </span>

      <button type="button" onClick={addTab} style={{...chip(false),borderStyle:"dashed",color:CLR.primary}}>+ הוסף נכס</button>
