        <div style={{flex:"1 1 160px"}}>
          <label style={{fontSize:12,color:CLR.muted,display:"block",marginBottom:4}}>סוג נכס</label>
          <select value={T.type} onChange={e=>{const v=e.target.value;setTab('type',v);if(v==='בניין משותף'){setTimeout(()=>{setTabsState(p=>({...p,[activeTab]:{...p[activeTab],type:v,yardType:'included',sewers:5}}));},0);}else{setTimeout(()=>{setTabsState(p=>({...p,[activeTab]:{...p[activeTab],type:v,yardType:'none',sewers:0}}));},0);}}} style={{...numInput,textAlign:"right",fontWeight:600}}>
            {CALC_PROPERTY_TYPES.map(pt=><option key={pt} value={pt}>{pt}</option>)}
          </select>
        </div>
        <button type="button" onClick={()=>setTab('applySurcharges',!T.applySurcharges)} style={{padding:"9px 14px",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:700,border:"none",background:T.applySurcharges?"#16a34a":"#cbd5e1",color:T.applySurcharges?"#fff":"#475569"}}>

              <option value="regular">טיפול רגיל (כל הבית)</option><option value="sewers_only">ביובים בלבד</option><option value="other_only">אזור ספציפי בלבד</option>

function CustomerSearchSelect({customers, value, onChange}){
  const [q,setQ]=useState("");
  const [open,setOpen]=useState(false);
  const ref=React.useRef(null);
  const selected=customers.find(c=>c.id===parseInt(value));
  React.useEffect(()=>{
    const close=e=>{ if(ref.current&&!ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown",close);
    return()=>document.removeEventListener("mousedown",close);
  },[]);
  const filtered=q.length>0
    ? customers.filter(c=>c.name.includes(q)||c.phone.includes(q)||(c.address||"").includes(q)).slice(0,8)
    : customers.slice(0,8);
  return <div ref={ref} style={{position:"relative"}}>
    <div onClick={()=>setOpen(o=>!o)} style={{width:"100%",padding:"8px 10px",borderRadius:8,border:"1px solid "+CLR.border,fontSize:14,boxSizing:"border-box",background:"#f9fafb",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",minHeight:38}}>
      <span style={{color:selected?"#111":CLR.muted}}>{selected?selected.name+" ("+selected.phone+")":"-- בחר לקוח --"}</span>
      <span style={{color:CLR.muted,fontSize:12}}>{open?"▲":"▼"}</span>
    </div>
    {open&&<div style={{position:"absolute",top:"100%",right:0,left:0,zIndex:500,background:"#fff",border:"1px solid "+CLR.border,borderRadius:8,boxShadow:"0 8px 24px rgba(0,0,0,0.12)",maxHeight:280,display:"flex",flexDirection:"column"}}>
      <div style={{padding:"8px 10px",borderBottom:"1px solid #f3f4f6"}}>
        <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="חפש שם, טלפון, כתובת..."
          style={{width:"100%",border:"none",outline:"none",fontSize:13,background:"transparent",direction:"rtl"}}
          onClick={e=>e.stopPropagation()}/>
      </div>
      <div style={{overflowY:"auto",flex:1}}>
        <div onClick={()=>{onChange("",null);setOpen(false);setQ("");}} style={{padding:"8px 12px",cursor:"pointer",fontSize:13,color:CLR.muted,borderBottom:"1px solid #f9fafb"}}
          onMouseEnter={e=>e.currentTarget.style.background="#f9fafb"} onMouseLeave={e=>e.currentTarget.style.background=""}>
          -- ללא לקוח --
        </div>
        {filtered.map(c=>(
          <div key={c.id} onClick={()=>{onChange(c.id,c);setOpen(false);setQ("");}} style={{padding:"8px 12px",cursor:"pointer",borderBottom:"1px solid #f9fafb"}}
            onMouseEnter={e=>e.currentTarget.style.background="#f0f9f4"} onMouseLeave={e=>e.currentTarget.style.background=""}>
            <div style={{fontWeight:600,fontSize:13,color:"#111"}}>{c.name}</div>
            <div style={{fontSize:11,color:CLR.muted}}>{c.phone} · {(c.address||"").slice(0,40)}</div>
          </div>
        ))}
        {filtered.length===0&&<div style={{padding:"16px 12px",textAlign:"center",color:CLR.muted,fontSize:13}}>לא נמצאו לקוחות</div>}
      </div>
    </div>}
  </div>;
}

        {/* Two PDF buttons */}
        <div style={{fontWeight:700,color:"#0f172a",fontSize:14,marginBottom:10}}>📄 הפקת מסמכים</div>

  </div>;
}

// ─── Print Day Schedule ───────────────────────────
function printDaySchedule(date, appointments, workers){
  const toISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const iso=typeof date==="string"?date:toISO(date);
  const dayAppts=[...appointments.filter(a=>a.date===iso)].sort((a,b)=>a.time.localeCompare(b.time));
  const dayNames=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
  const d=new Date(iso+"T12:00:00");
  const dayLabel="יום "+dayNames[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear();

  // Group by worker
  const byWorker={};
  dayAppts.forEach(a=>{
    const key=a.workerName||"לא שובץ";
    if(!byWorker[key]) byWorker[key]=[];
    byWorker[key].push(a);
  });

  const workerSections=Object.entries(byWorker).map(([name,appts])=>{
    const wColor=workers.find(w=>w.name===name)?.color||"#1a5c3a";
    const rows=appts.map(a=>`
      <tr style="border-bottom:1px solid #e5e7eb;">
        <td style="padding:8px 12px;font-weight:600;">${a.time}${a.timeWindow?" ("+a.timeWindow+")":""}</td>
        <td style="padding:8px 12px;">${a.customerName}</td>
        <td style="padding:8px 12px;">${a.pestType}</td>
        <td style="padding:8px 12px;">${a.address}</td>
        <td style="padding:8px 12px;font-weight:700;">₪${a.price}</td>
        <td style="padding:8px 12px;color:#6b7280;font-size:12px;">${a.notes||""}</td>
      </tr>`).join("");
    return `

}

                  if(load===0) return "#f0fdf4"; // free — light green
                  if(load===1) return "#fefce8"; // 1 appt — light yellow
                  if(load>=2) return "#fef2f2";  // busy — light red
                }

              onDragLeave={()=>setDropTarget(null)}

                const prog=jobProgress(a,execLogs,finance);
                return <div key={a.id}
                draggable
                onDragStart={e=>{setDraggedId(a.id);e.dataTransfer.effectAllowed="move";}}
                onDragEnd={()=>{setDraggedId(null);setDropTarget(null);}}
                onClick={e=>{e.stopPropagation();setDetailAppt(a);}}
                style={{background:prog.color+"1a",borderRadius:5,padding:"3px 5px",marginBottom:2,borderRight:`3px solid ${wColor(a.workerId)}`,fontSize:10,cursor:"grab",opacity:draggedId===a.id?0.4:1}}

                <div style={{fontWeight:600,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>⠿ {a.customerName}</div>
                <div style={{color:CLR.muted,fontSize:9}}>{a.pestType}</div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{fontSize:9,color:prog.color,fontWeight:600}}>{prog.label}</div>

                </div>
              </div>;})}
            </td>);})}
        </tr>)}</tbody>
      </table>
    </div>}
    {showNew&&<Modal title={"📝 הזמנת עבודה חדשה — "+(prefill.date?fmtDate(prefill.date):"")+" "+(prefill.time||"")} onClose={()=>setShowNew(false)} width={860}>

    {invAppt&&<InvoiceModal appt={invAppt} customers={customers} onClose={()=>setInvAppt(null)} onSave={rec=>{setFinance(fs=>[...fs,{...rec,id:nextId(fs)}]);setInvAppt(null);}}/>}
    {detailAppt&&<ApptDetailModal appt={detailAppt} customers={customers} workers={workers} currentUser={currentUser}

// Shared intake form body — used both as modal and as the "הזמנת עבודה" page
// Multi-select pest picker + custom pest
// Bordered card wrapping a labelled group of fields (module-level so inputs keep focus)
function FieldCard({title,extra,children}){
  return <div style={{border:`1px solid #d1d5db`,borderRadius:12,padding:"16px 18px",marginBottom:14,background:"#fff",boxShadow:"0 1px 3px rgba(16,24,40,0.06)"}}>
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,paddingBottom:10,borderBottom:`1px solid #eef0f2`}}>
      <div style={{width:4,height:16,background:CLR.primary,borderRadius:2}}/>
      <span style={{fontSize:13,fontWeight:700,color:CLR.primary}}>{title}</span>
      {extra&&<span style={{fontSize:11,color:CLR.muted,fontWeight:400}}>{extra}</span>}
    </div>
    {children}
  </div>;
}
function Section({children}){
  return <div style={{fontSize:13,fontWeight:700,color:CLR.primary,margin:"16px 0 10px",borderBottom:`2px solid ${CLR.primaryLight}`,paddingBottom:6}}>{children}</div>;
}

function PestMultiPicker({selected,onChange,customPest,setCustomPest}){
  const toggle=p=>selected.includes(p)?onChange(selected.filter(x=>x!==p)):onChange([...selected,p]);
  return <div>
    <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
      {PEST_TYPES_CRM.map(p=>{
        const on=selected.includes(p);
        return <button key={p} type="button" onClick={()=>toggle(p)}
          style={{background:on?CLR.primary:CLR.surface,color:on?"#fff":CLR.muted,border:`1px solid ${on?CLR.primary:CLR.border}`,borderRadius:20,padding:"5px 14px",fontSize:13,cursor:"pointer",fontWeight:on?600:400}}>
          {on?"✓ ":""}{p}
        </button>;
      })}
    </div>
    <Inp label="מזיק אחר (לא ברשימה)" value={customPest} onChange={setCustomPest} placeholder="הקלד מזיק נוסף..."/>
  </div>;
}

// Quick-tap chips that append text to notes
function QuickChips({chips,onPick,isOn}){
  return <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
    {chips.map(c=>{const on=isOn?isOn(c):false;return <button key={c} type="button" onClick={()=>onPick(c)} aria-pressed={on}
      style={{background:on?CLR.primaryLight:CLR.surface,border:`1px solid ${on?CLR.primary:CLR.border}`,borderRadius:20,padding:"5px 12px",fontSize:13,cursor:on?"default":"pointer",color:CLR.primary,fontWeight:on?700:400}}>
      {on?"✓":"+"} {c}
    </button>;})}
  </div>;
}

    });

  return lines.join("\n");
}

// ─── Auto-routing: match worker zone to address ──
function suggestWorker(address, workers){
  if(!address) return null;
  const addr = address.toLowerCase();
  // Zone keywords → score per worker
  const ZONE_KEYWORDS = {
    "תל אביב": ["תל אביב","יפו","רמת גן","גבעתיים","בני ברק","פתח תקווה","ראשון לציון","בת ים","חולון","הרצליה","רעננה","כפר סבא","נתניה"],
    "חיפה": ["חיפה","קריות","עכו","נהריה","קריית שמונה","צפת","טבריה","עפולה","נצרת","כרמיאל"],
    "ירושלים": ["ירושלים","בית שמש","מעלה אדומים","מודיעין","לוד","רמלה","בית שמש"],
    "דרום": ["באר שבע","אשדוד","אשקלון","קריית גת","נתיבות","שדרות","אופקים","אילת","דימונה","ערד"],
    "מרכז": ["ראשון לציון","רחובות","נס ציונה","יבנה","גדרה","רמלה","לוד","פתח תקווה","אריאל"],
  };
  let bestWorker = null;
  let bestScore = 0;
  workers.filter(w=>isTech(w)&&w.status==="פעיל").forEach(w=>{
    const zone = (w.zone||"").toLowerCase();
    let score = 0;
    // Direct zone name match
    Object.entries(ZONE_KEYWORDS).forEach(([zName, keywords])=>{
      if(zone.includes(zName.toLowerCase())){
        keywords.forEach(kw=>{ if(addr.includes(kw.toLowerCase())) score+=10; });
      }
    });
    // Keyword in zone matches keyword in address
    const zoneWords = zone.split(/[\s,/]+/).filter(w=>w.length>2);
    zoneWords.forEach(zw=>{ if(addr.includes(zw)) score+=5; });
    if(score > bestScore){ bestScore=score; bestWorker=w; }
  });
  return bestScore>0 ? bestWorker : null;
}

    <FieldCard title="פרטי ההדברה המבוקשת" extra="(ניתן להשלים אחר כך)">

        <div style={{display:"flex",gap:6}}>

          <button type="button" onClick={()=>{
            if(!calcState){
              const t=calcInitialTab();
              t.type=f.propertyType; t.rooms=parseInt(f.rooms)||3; t.floors=parseInt(f.floors)||4;

        </div>
      </div>
      {/* Quote breakdown (client-facing, editable) */}
      {quote&&quote.properties&&quote.properties.length>0&&<div style={{marginTop:12,background:CLR.surface,borderRadius:8,padding:"12px 14px"}}>
        <div style={{fontSize:12,fontWeight:700,color:CLR.primary,marginBottom:8}}>📋 פירוט ללקוח (מהמחשבון — ניתן לערוך)</div>
        {quote.properties.map((p,i)=>(
          <div key={i} style={{display:"flex",gap:8,alignItems:"center",marginBottom:6}}>
            <input value={p.label} onChange={e=>{const np=[...quote.properties];np[i]={...np[i],label:e.target.value};setQuote({...quote,properties:np});}} style={{flex:2,padding:"6px 9px",borderRadius:6,border:`1px solid #d1d5db`,fontSize:13,background:"#fff",boxSizing:"border-box"}}/>

          </div>

        </div>
      </div>}
      <button type="button" onClick={()=>{

    {showWAConfirm&&(()=>{

    {showCalc&&<Modal title="🧮 מחשבון תמחור" onClose={()=>setShowCalc(false)} width={720}>

            const known=r.pests.filter(p=>PEST_TYPES_CRM.includes(p));
            const unknown=r.pests.filter(p=>!PEST_TYPES_CRM.includes(p));
            if(known.length) set("pests",Array.from(new Set([...f.pests,...known])));

          }

        }}/>
    </Modal>}
    {showSend&&(()=>{
      const addr=fullAddress();

          </a>

        <div style={{display:"flex",gap:10}}>
          <Btn full v="secondary" onClick={()=>openPrintWindow("הצעת מחיר",clientQuoteHtml({company:COMPANY,customerName:f.name,date:f.prefDate,timeWindow:f.prefDate?tw:"",address:addr,quote,price:qPrice}))}>📄 הצעת מחיר PDF</Btn>
          <Btn full v="ghost" onClick={()=>{navigator.clipboard&&navigator.clipboard.writeText(text);alert("ההצעה הועתקה");}}>📋 העתק טקסט</Btn>
        </div>
        <div style={{fontSize:11,color:CLR.muted,marginTop:10,textAlign:"center"}}>ההצעה ללקוח כוללת מחיר מפורט והנחיות בלבד — ללא הנחות או שילובים פנימיים.</div>
      </Modal>;
    })()}
  </div>;

  // With side guidance panel (used in the full-page tab)
  const guide=INTAKE_GUIDANCE[f.propertyType]||INTAKE_GUIDANCE["default"];
  const selectedPests=allPests();
  // gather unique pest-guidance lines for chosen pests
  const pestTips=[];
  const seen=new Set();
  selectedPests.forEach(p=>{

  return <div style={{display:"grid",gridTemplateColumns:"1fr 290px",gap:20,alignItems:"start"}}>
    <div>{formBody}</div>
    <div style={{position:"sticky",top:16,display:"flex",flexDirection:"column",gap:14}}>

        {selectedPests.map(p=>{
          const tips=PEST_GUIDANCE[p]||[];
          if(!tips.length) return null;
          return <div key={p} style={{marginBottom:10,background:"#fff",borderRadius:8,padding:"9px 12px",border:"1px solid #bfdbfe"}}>
            <div style={{fontWeight:700,color:"#1e40af",fontSize:12,marginBottom:5,display:"flex",alignItems:"center",gap:6}}>
              <span style={{background:"#1e40af",color:"#fff",borderRadius:4,padding:"1px 7px",fontSize:11}}>🐛 {p}</span>
            </div>

              {tips.map((t,i)=><li key={i}>{t}</li>)}

          </div>;
        })}
      </div>}

      {/* Recent orders history */}
      <div style={{background:CLR.white,border:`1px solid ${CLR.border}`,borderRadius:12,padding:"16px 18px"}}>
        <div style={{fontWeight:700,color:CLR.primary,fontSize:14,marginBottom:10}}>🕘 היסטוריית הזמנות</div>

          : <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:320,overflowY:"auto"}}>
              {recentOrders.slice(0,12).map((o,i)=>(
                <div key={o.id} style={{borderRight:`3px solid ${CLR.primary}`,background:CLR.surface,borderRadius:6,padding:"7px 10px",fontSize:12}}>

                    <span style={{fontWeight:600}}>{i+1}. {o.customerName}</span>
                    <span style={{color:CLR.muted}}>{fmtDate(o.date)}</span>

                  <div style={{color:CLR.muted,marginTop:2}}>{o.pestType} {o.workerName?`· ${o.workerName}`:""} {o.price?`· ₪${o.price}`:""}</div>

            </div>}
      </div>
    </div>
  </div>;
}

// Full-page "הזמנת עבודה" tab — with side guidance panel
// ── תצוגה מפוצלת עם קו גרירה (ימין = טופס, שמאל = יומן) ──
function SplitView({right,left,storageKey,defaultRight=640,minRight=400,minLeft=300}){
  const ref=React.useRef(null);
  const [w,setW]=useState(()=>{try{return parseInt(localStorage.getItem(storageKey))||defaultRight;}catch(e){return defaultRight;}});
  const [drag,setDrag]=useState(false);
  React.useEffect(()=>{
    if(!drag) return;
    const move=e=>{ const r=ref.current&&ref.current.getBoundingClientRect(); if(!r) return; const x=(e.touches?e.touches[0].clientX:e.clientX);
      const nw=Math.max(minRight,Math.min(r.right-x,r.width-minLeft)); setW(nw); };
    const up=()=>{ setDrag(false); };
    window.addEventListener("pointermove",move); window.addEventListener("pointerup",up);
    document.body.style.userSelect="none"; document.body.style.cursor="col-resize";
    return ()=>{ window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up); document.body.style.userSelect=""; document.body.style.cursor=""; };
  },[drag]);
  React.useEffect(()=>{ if(!drag) try{localStorage.setItem(storageKey,String(Math.round(w)));}catch(e){} },[drag,w]);
  return <div ref={ref} style={{display:"flex",alignItems:"flex-start",gap:0,width:"100%"}}>
    <div style={{flex:`0 0 ${w}px`,minWidth:0}}>{right}</div>
    <div onPointerDown={e=>{e.preventDefault();setDrag(true);}} onDoubleClick={()=>setW(defaultRight)} title="גרור כדי לשנות רוחב · דאבל-קליק לאיפוס"
      style={{flex:"0 0 16px",alignSelf:"stretch",cursor:"col-resize",display:"flex",justifyContent:"center",position:"relative",touchAction:"none"}}>
      <div style={{width:drag?4:2,background:drag?CLR.primary:CLR.border,borderRadius:2,height:"100%",minHeight:300,transition:"background .15s"}}/>

// ── לוח זמינות המדבירים (ליד הזמנת עבודה) ──
function apptRange(a){
  const tw=String(a.timeWindow||"").split(/[–-]/).map(x=>x.trim());
  const toMin=t=>{const [h,m]=String(t||"").split(":").map(n=>parseInt(n));return isNaN(h)?null:h*60+(m||0);};
  let st=toMin(tw[0])??toMin(a.time), en=toMin(tw[1]);
  if(st==null) st=9*60; if(en==null||en<=st) en=st+60;
  return [st,en];
}
function AvailabilityPanel({appointments,workers,date,setDate,sel,onPick,compact}){
  const techs=workers.filter(w=>isTech(w)&&w.status!=="לא פעיל");
  const [only,setOnly]=useState("all");
  const [mode,setMode]=useState(()=>{try{return localStorage.getItem('h360_avail_mode')||"day";}catch(e){return "day";}});
  const setModeP=m=>{setMode(m);try{localStorage.setItem('h360_avail_mode',m);}catch(e){}};
  const cols=only==="all"?techs:techs.filter(w=>String(w.id)===String(only));
  const hours=Array.from({length:14},(_,i)=>7+i); // 07:00–20:00
  const d=new Date((date||todayStr())+"T12:00:00");
  const iso=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
  const shift=n=>{const x=new Date(d); if(mode==="month") x.setMonth(x.getMonth()+n,1); else x.setDate(x.getDate()+n*(mode==="week"?7:1)); setDate(iso(x));};
  const unit=mode==="day"?"יום":mode==="week"?"שבוע":"חודש";
  const MONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
  const wkStart=new Date(d); wkStart.setDate(d.getDate()-d.getDay());
  const weekDays=Array.from({length:7},(_,i)=>{const x=new Date(wkStart);x.setDate(wkStart.getDate()+i);return x;});
  const ofW=(a,w)=>String(a.workerId)===String(w.id)||a.workerName===w.name;
  const live=appointments.filter(a=>a.status!=="בוטל");
  const goDay=x=>{setDate(iso(x));setModeP("day");};
  const DAYS=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
  const dayAppts=appointments.filter(a=>a.date===iso(d)&&a.status!=="בוטל");
  const toMin=t=>{const [h,m]=String(t||"").split(":").map(n=>parseInt(n));return isNaN(h)?null:h*60+(m||0);};
  const selSt=toMin(sel&&sel.timeFrom), selEn=toMin(sel&&sel.timeTo);
  const inSel=h=>sel&&sel.date===iso(d)&&selSt!=null&&selEn!=null&&h*60<selEn&&(h+1)*60>selSt;
  const nav={display:"inline-flex",alignItems:"center",gap:4,padding:"7px 10px",borderRadius:8,border:`1px solid ${CLR.border}`,background:"#fff",cursor:"pointer",fontSize:13,fontWeight:600,color:CLR.primary,fontFamily:"inherit"};
  return <div style={{background:"#fff",border:`1px solid ${CLR.border}`,borderRadius:12,padding:12,display:"flex",flexDirection:"column",gap:10,height:compact?"auto":"100%",minHeight:0}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap"}}>
      <div style={{fontWeight:800,fontSize:15,color:CLR.primary}}>📅 יומני המדבירים</div>
      <div style={{display:"flex",gap:2,background:"#e8f5ee",borderRadius:9,padding:3}}>
        {[["day","יומי"],["week","שבועי"],["month","חודשי"]].map(([m,l])=><button key={m} onClick={()=>setModeP(m)} style={{padding:"5px 12px",borderRadius:7,border:"none",cursor:"pointer",fontSize:13,fontFamily:"inherit",fontWeight:mode===m?700:500,background:mode===m?"#fff":"transparent",color:mode===m?"#1a5c3a":"#6b7280"}}>{l}</button>)}
      </div>
    </div>
    <div style={{display:"flex",gap:6,alignItems:"center"}}>
      <button style={nav} onClick={()=>shift(-1)}><span>▶</span><span>{unit} קודם</span></button>
      <button style={{...nav,flex:1,justifyContent:"center",color:"#334155"}} onClick={()=>setDate(todayStr())}>היום</button>
      <button style={nav} onClick={()=>shift(1)}><span>{unit==="חודש"?"חודש הבא":unit==="שבוע"?"שבוע הבא":"יום הבא"}</span><span>◀</span></button>
    </div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
      <b style={{fontSize:15}}>{mode==="day"?`יום ${DAYS[d.getDay()]} · ${d.getDate()}/${d.getMonth()+1}`:mode==="week"?`${weekDays[0].getDate()}/${weekDays[0].getMonth()+1} – ${weekDays[6].getDate()}/${weekDays[6].getMonth()+1}`:`${MONTHS[d.getMonth()]} ${d.getFullYear()}`}</b>

    </div>
    {techs.length>1&&<div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:2}}>

    </div>}
    {techs.length>0&&mode==="week"&&<div style={{overflow:"auto",flex:1,minHeight:0,border:`1px solid ${CLR.border}`,borderRadius:10}}>
      <table style={{borderCollapse:"collapse",width:"100%",minWidth:80+cols.length*130,tableLayout:"fixed"}}>

        </tr></thead>
        <tbody>{weekDays.map(x=>{const xi=iso(x);const tdy=xi===todayStr();const isSel=sel&&sel.date===xi;return <tr key={xi} style={{background:isSel?"#fef9c3":tdy?"#f0fdf4":"transparent"}}>

          {cols.map(w=>{const list=live.filter(a=>a.date===xi&&ofW(a,w)).sort((a,b)=>String(a.time||"").localeCompare(String(b.time||"")));
            return <td key={w.id} onClick={()=>goDay(x)} title="לחץ לתצוגה יומית" style={{cursor:"pointer",borderTop:`1px solid ${CLR.border}`,borderRight:`1px solid ${CLR.border}`,padding:4,verticalAlign:"top",minHeight:50}}>
              {list.length===0?<div style={{fontSize:11,color:"#94a3b8",textAlign:"center",padding:"10px 0"}}>פנוי כל היום</div>
              :list.map(a=><div key={a.id} style={{fontSize:11,lineHeight:1.3,borderRight:`3px solid ${w.color||CLR.primary}`,background:(w.color||CLR.primary)+"18",borderRadius:4,padding:"2px 5px",marginBottom:3,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}><b>{a.timeWindow||a.time}</b> {a.customerName}</div>)}
            </td>;})}
        </tr>;})}</tbody>
      </table>
    </div>}
    {techs.length>0&&mode==="month"&&(()=>{
      const first=new Date(d.getFullYear(),d.getMonth(),1), last=new Date(d.getFullYear(),d.getMonth()+1,0);
      const cells=Array.from({length:Math.ceil((first.getDay()+last.getDate())/7)*7},(_,i)=>{const n=i-first.getDay()+1;return n<1||n>last.getDate()?null:new Date(d.getFullYear(),d.getMonth(),n);});
      return <div style={{overflow:"auto",flex:1,minHeight:0}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:1,background:CLR.border,border:`1px solid ${CLR.border}`,borderRadius:10,overflow:"hidden"}}>
          {["א'","ב'","ג'","ד'","ה'","ו'","ש'"].map(l=><div key={l} style={{background:CLR.primary,color:"#fff",textAlign:"center",fontSize:12,fontWeight:700,padding:"6px 0"}}>{l}</div>)}
          {cells.map((x,i)=>{ if(!x) return <div key={i} style={{background:"#f8fafc",minHeight:62}}/>;
            const xi=iso(x); const tdy=xi===todayStr(); const isSel=sel&&sel.date===xi;
            return <div key={i} onClick={()=>goDay(x)} style={{background:isSel?"#fef9c3":tdy?"#e8f5ee":"#fff",minHeight:62,padding:4,cursor:"pointer",minWidth:0}}>

        </div>

              <span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:w.color||"#fff",marginLeft:4}}/>{w.name}
              <div style={{fontSize:10,opacity:.85,fontWeight:400}}>{dayAppts.filter(a=>String(a.workerId)===String(w.id)||a.workerName===w.name).length} תורים</div>
            </th>)}
          </tr></thead>
          <tbody>{hours.map(h=><tr key={h} style={{background:inSel(h)?"#fef9c3":"transparent"}}>
            <td style={{fontSize:11,color:CLR.muted,fontWeight:700,padding:"4px 6px",borderTop:`1px solid ${CLR.border}`,verticalAlign:"top",background:inSel(h)?"#fde68a":CLR.surface}}>{String(h).padStart(2,"0")}:00</td>
            {cols.map(w=>{
              const mine=dayAppts.filter(a=>(String(a.workerId)===String(w.id)||a.workerName===w.name)&&(()=>{const [st,en]=apptRange(a);return st<(h+1)*60&&en>h*60;})());
              const starts=mine.filter(a=>Math.floor(apptRange(a)[0]/60)===h||apptRange(a)[0]<7*60&&h===7);
              const busy=mine.length>0;
              const chosen=sel&&String(sel.workerId)===String(w.id)&&inSel(h);
              return <td key={w.id} onClick={()=>!busy&&onPick&&onPick({date:iso(d),time:String(h).padStart(2,"0")+":00",workerId:w.id})}
                style={{borderTop:`1px solid ${CLR.border}`,borderRight:`1px solid ${CLR.border}`,padding:3,verticalAlign:"top",height:40,cursor:busy?"default":"pointer",
                  background:chosen?(busy?"#fecaca":"#bbf7d0"):busy?(w.color||CLR.primary)+"22":"transparent"}}
                title={busy?"תפוס":"פנוי — לחץ לבחירה"}>
                {starts.map(a=><div key={a.id} style={{fontSize:11,lineHeight:1.3,borderRight:`3px solid ${w.color||CLR.primary}`,paddingRight:4,marginBottom:2,overflow:"hidden"}}>
                  <b>{(a.timeWindow||a.time||"")}</b><div style={{whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{a.customerName||"—"}</div>
                </div>)}
                {!busy&&<div style={{fontSize:10,color:"#cbd5e1",textAlign:"center",paddingTop:10}}>פנוי</div>}
              </td>;})}
          </tr>)}</tbody>
        </table>
      </div>}
    <div style={{fontSize:11,color:CLR.muted}}>{mode==="day"?"💡 לחיצה על משבצת פנויה ממלאת בהזמנה תאריך, שעה ומדביר. צהוב = החלון שבחרתם.":"💡 לחיצה על יום פותחת אותו בתצוגה יומית. צהוב = התאריך שבחרתם בהזמנה."}</div>
  </div>;
}
