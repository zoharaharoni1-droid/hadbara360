function RegionalStats({appointments,customers,workers,finance}){
  const [metric,setMetric]=useState("appointments"); // appointments | revenue | customers

  // Extract city from address
  const getCity=addr=>{
    if(!addr) return "לא ידוע";
    const parts=addr.split(",").map(p=>p.trim());
    return parts[parts.length-1]||parts[0]||"לא ידוע";
  };

  // Build city stats
  const cityStats=React.useMemo(()=>{
    const stats={};
    appointments.forEach(a=>{
      const city=getCity(a.address);
      if(!stats[city]) stats[city]={city,appts:0,done:0,revenue:0,customers:new Set()};
      stats[city].appts++;
      if(a.status==="בוצע") stats[city].done++;
      stats[city].revenue+=a.price;
      if(a.customerId) stats[city].customers.add(a.customerId);
    });
    return Object.values(stats).map(s=>({...s,customers:s.customers.size}))
      .sort((a,b)=>b[metric==="revenue"?"revenue":metric==="customers"?"customers":"appts"]-a[metric==="revenue"?"revenue":metric==="customers"?"customers":"appts"]);
  },[appointments,metric]);

  // Worker stats by zone
  const workerStats=workers.filter(w=>isTech(w)).map(w=>({
    ...w,
    appts:appointments.filter(a=>a.workerId===w.id).length,
    done:appointments.filter(a=>a.workerId===w.id&&a.status==="בוצע").length,
    revenue:appointments.filter(a=>a.workerId===w.id&&a.status==="בוצע").reduce((s,a)=>s+a.price,0),
    cities:[...new Set(appointments.filter(a=>a.workerId===w.id).map(a=>getCity(a.address)))].slice(0,5),
  })).sort((a,b)=>b.appts-a.appts);

  const maxVal=Math.max(...cityStats.map(c=>metric==="revenue"?c.revenue:metric==="customers"?c.customers:c.appts),1);

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
      <div>
        <h2 style={{color:CLR.primary,fontSize:17,margin:"0 0 4px"}}>🗺️ ניתוח אזורי</h2>
        <p style={{color:CLR.muted,fontSize:13,margin:0}}>התפלגות עבודה לפי עיר ואזור</p>
      </div>
      <div style={{display:"flex",gap:6}}>
        {[["appointments","תורים"],["revenue","הכנסות"],["customers","לקוחות"]].map(([k,l])=>(
          <button key={k} onClick={()=>setMetric(k)} style={{padding:"6px 14px",borderRadius:8,border:"1px solid "+(metric===k?CLR.primary:CLR.border),background:metric===k?CLR.primary:"transparent",color:metric===k?"#fff":CLR.muted,cursor:"pointer",fontWeight:600,fontSize:13}}>{l}</button>
        ))}
      </div>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:20}}>
      {/* City breakdown */}
      <div style={{background:CLR.white,border:"1px solid "+CLR.border,borderRadius:12,padding:18}}>
        <div style={{fontWeight:600,color:CLR.primary,marginBottom:14,fontSize:14}}>🏙️ לפי עיר</div>
        {cityStats.slice(0,10).map((c,i)=>{
          const val=metric==="revenue"?c.revenue:metric==="customers"?c.customers:c.appts;
          const pct=Math.round(val/maxVal*100);
          return <div key={i} style={{marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:3}}>
              <span style={{fontWeight:500}}>{c.city}</span>
              <span style={{color:CLR.muted,fontSize:12}}>
                {metric==="revenue"?"₪"+c.revenue.toLocaleString():val}
                {metric==="appointments"&&<span style={{color:CLR.muted}}> ({c.done} בוצעו)</span>}
              </span>
            </div>
            <div style={{background:"#f3f4f6",borderRadius:4,height:8}}>
              <div style={{background:CLR.primary,height:"100%",borderRadius:4,width:pct+"%"}}/>
            </div>
          </div>;
        })}
        {cityStats.length===0&&<div style={{color:CLR.muted,fontSize:13}}>אין נתונים</div>}
      </div>

      {/* Worker zone map */}
      <div style={{background:CLR.white,border:"1px solid "+CLR.border,borderRadius:12,padding:18}}>
        <div style={{fontWeight:600,color:CLR.primary,marginBottom:14,fontSize:14}}>👷 מדבירים לפי אזור</div>
        {workerStats.map((w,i)=>(
          <div key={i} style={{marginBottom:14,padding:"10px 12px",background:CLR.surface,borderRadius:8}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
              <div style={{width:10,height:10,borderRadius:"50%",background:w.color||CLR.primary,flexShrink:0}}/>
              <span style={{fontWeight:700,fontSize:13}}>{w.name}</span>
              <span style={{fontSize:11,color:CLR.muted,background:"#e5e7eb",borderRadius:10,padding:"1px 8px"}}>{w.zone||"ללא אזור"}</span>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,fontSize:11,marginBottom:6}}>
              <div style={{textAlign:"center"}}><div style={{color:CLR.muted}}>תורים</div><div style={{fontWeight:700}}>{w.appts}</div></div>
              <div style={{textAlign:"center"}}><div style={{color:CLR.muted}}>בוצעו</div><div style={{fontWeight:700}}>{w.done}</div></div>
              <div style={{textAlign:"center"}}><div style={{color:CLR.muted}}>הכנסות</div><div style={{fontWeight:700,color:CLR.primary}}>₪{w.revenue.toLocaleString()}</div></div>
            </div>
            {w.cities.length>0&&<div style={{fontSize:11,color:CLR.muted}}>🏙️ {w.cities.join(" · ")}</div>}
          </div>
        ))}
        {workerStats.length===0&&<div style={{color:CLR.muted,fontSize:13}}>אין מדבירים</div>}
      </div>
    </div>

    {/* Summary table */}
    <div style={{background:CLR.white,border:"1px solid "+CLR.border,borderRadius:12,overflow:"hidden"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
        <thead><tr style={{background:CLR.primary,color:"#fff"}}>
          {["עיר","תורים","בוצעו","הכנסות","לקוחות"].map(h=><th key={h} style={{padding:"10px 12px",textAlign:"right",fontWeight:600}}>{h}</th>)}
        </tr></thead>
        <tbody>
          {cityStats.map((c,i)=>(
            <tr key={i} style={{borderBottom:"1px solid "+CLR.border,background:i%2===0?"#f9fafb":"#fff"}}>
              <td style={{padding:"8px 12px",fontWeight:600}}>{c.city}</td>
              <td style={{padding:"8px 12px"}}>{c.appts}</td>
              <td style={{padding:"8px 12px"}}>{c.done} ({c.appts?Math.round(c.done/c.appts*100):0}%)</td>
              <td style={{padding:"8px 12px",fontWeight:600,color:CLR.primary}}>₪{c.revenue.toLocaleString()}</td>
              <td style={{padding:"8px 12px"}}>{c.customers}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  </div>;
}
// ─── תצוגת מדביר ─────────────────────────────────────────────────────────
function WorkerFieldView({currentUser, appointments, setAppointments, customers, execLogs, setExecLogs}){
  const today = todayStr();
  const [expandedId, setExpandedId] = React.useState(null);
  const [note, setNote] = React.useState({});

  // רק תורים של המדביר הזה להיום, ממוינים לפי שעה
  const myAppts = React.useMemo(()=>{
    return appointments
      .filter(a => (a.workerName ? String(a.workerName).trim()===String(currentUser.name||"").trim() : a.workerId===currentUser.id) && a.date===today)
      .sort((a,b)=>(a.timeFrom||"00:00").localeCompare(b.timeFrom||"00:00"));
  },[appointments, currentUser.id, today]);

  const total = myAppts.length;
  const done  = myAppts.filter(a=>a.status==="בוצע").length;

  const updateStatus = (appt, newStatus) => {
    setAppointments(prev => prev.map(a => a.id===appt.id ? {...a, status:newStatus, updatedAt:new Date().toISOString()} : a));
    // אם "בוצע" — שמור ביומן ביצוע אוטומטי
    if(newStatus==="בוצע"){
      const cust = customers.find(c=>c.id===appt.customerId||c.name===appt.customerName)||{};
      const logNote = note[appt.id]||"";
      setExecLogs(prev=>[...prev,{
        id: Date.now(),
        date: today,
        appointmentId: appt.id,
        workerId: currentUser.id,
        workerName: currentUser.name,
        customerName: appt.customerName,
        address: appt.address,
        pest: appt.pestType||appt.pest||"",
        status: "בוצע",
        notes: logNote,
        products: [],
        createdAt: new Date().toISOString(),
      }]);
      setNote(n=>({...n,[appt.id]:""}));
    }
  };

  const nextStatus = s => {
    if(s==="נקבע"||s==="ממתין") return "בדרך";
    if(s==="בדרך") return "הגעתי";
    if(s==="הגעתי") return "בוצע";
    return null;
  };
  const statusLabel = s => ({
    "נקבע":"✅ קבע תור","ממתין":"⏳ ממתין","בדרך":"🚗 בדרך","הגעתי":"📍 הגעתי","בוצע":"✔️ בוצע","בוטל":"🚫 בוטל"
  }[s]||s);
  const statusClr = s => ({
    "נקבע":"#2563eb","ממתין":"#64748b","בדרך":"#f59e0b","הגעתי":"#ea580c","בוצע":"#16a34a","בוטל":"#dc2626"
  }[s]||"#64748b");
  const nextBtn = s => ({
    "נקבע":"🚗 יצאתי","ממתין":"🚗 יצאתי","בדרך":"📍 הגעתי","הגעתי":"✔️ סיימתי"
  }[s]);

  // שם היום בעברית
  const todayHebrew = () => {
    const d = new Date();
    const days = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
    return `יום ${days[d.getDay()]}, ${d.toLocaleDateString("he-IL",{day:"numeric",month:"long"})}`;
  };

  return (
    <div style={{maxWidth:520,margin:"0 auto",padding:"0 0 80px"}}>
      {/* כרטיס ברכה */}
      <div style={{background:"linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%)",borderRadius:18,padding:"22px 20px",marginBottom:18,color:"#fff",boxShadow:"0 8px 32px rgba(15,23,42,0.25)"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
          <div style={{width:46,height:46,background:"#16a34a",borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>
            {currentUser.name.charAt(0)}
          </div>
          <div>
            <div style={{fontSize:18,fontWeight:800,letterSpacing:"-0.3px"}}>שלום, {currentUser.name}! 👋</div>
            <div style={{fontSize:12,color:"#94a3b8",marginTop:2}}>{todayHebrew()}</div>
          </div>
        </div>
        {/* מד התקדמות */}
        <div style={{background:"rgba(255,255,255,0.08)",borderRadius:12,padding:"12px 14px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontSize:12,color:"#94a3b8",fontWeight:600}}>התקדמות היום</span>
            <span style={{fontSize:18,fontWeight:800,color:done===total&&total>0?"#4ade80":"#fff"}}>{done}/{total} משימות</span>
          </div>
          <div style={{background:"rgba(255,255,255,0.12)",borderRadius:99,height:8,overflow:"hidden"}}>
            <div style={{height:"100%",background:done===total&&total>0?"#4ade80":"#16a34a",borderRadius:99,width:total?`${Math.round(done/total*100)}%`:"0%",transition:"width 0.4s ease"}}/>
          </div>
          {total===0&&<div style={{fontSize:12,color:"#64748b",marginTop:8,textAlign:"center"}}>אין משימות לפי לוח הזמנים היום</div>}
          {done===total&&total>0&&<div style={{fontSize:13,color:"#4ade80",marginTop:8,textAlign:"center",fontWeight:700}}>🎉 כל המשימות הושלמו! עבודה מצוינת!</div>}
        </div>
      </div>

      {/* רשימת תורים */}
      {myAppts.length===0 ? (
        <div style={{background:"#fff",borderRadius:16,padding:"40px 20px",textAlign:"center",boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>
          <div style={{fontSize:52,marginBottom:12}}>🌅</div>
          <div style={{fontSize:16,fontWeight:700,color:"#0f172a",marginBottom:6}}>אין תורים להיום</div>
          <div style={{fontSize:13,color:"#64748b"}}>תורים חדשים יופיעו כאן ברגע שיוזמנו</div>
        </div>
      ) : myAppts.map((appt,idx)=>{
        const cust = customers.find(c=>c.id===appt.customerId||c.name===appt.customerName)||{};
        const phone = cust.phone||appt.phone||"";
        const addr  = appt.address||"";
        const isExpanded = expandedId===appt.id;
        const isDone = appt.status==="בוצע"||appt.status==="בוטל";
        const next = nextBtn(appt.status);
        const waPhone = phone.replace(/[^0-9]/g,"").replace(/^0/,"972");
        const waMsg  = encodeURIComponent(`שלום ${appt.customerName}, אני ${currentUser.name} מהדברה 360, בדרכי אליך לטיפול ב${addr}`);

        return (
          <div key={appt.id} style={{background:isDone?"#f0fdf4":"#fff",borderRadius:16,marginBottom:14,boxShadow:isDone?"0 1px 6px rgba(22,163,74,0.12)":"0 4px 20px rgba(0,0,0,0.08)",border:isDone?"1.5px solid #bbf7d0":"1.5px solid #e2e8f0",overflow:"hidden",opacity:isDone?0.75:1,transition:"all 0.2s"}}>

            {/* כותרת הכרטיס */}
            <div style={{padding:"14px 16px",cursor:"pointer"}} onClick={()=>setExpandedId(isExpanded?null:appt.id)}>
              <div style={{display:"flex",alignItems:"flex-start",gap:12}}>
                {/* מספר סידורי */}
                <div style={{width:32,height:32,borderRadius:"50%",background:isDone?"#16a34a":statusClr(appt.status),display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:13,fontWeight:800,flexShrink:0,marginTop:1}}>
                  {isDone?"✓":idx+1}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                    <div style={{fontSize:15,fontWeight:800,color:"#0f172a",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{appt.customerName||"לקוח"}</div>
                    <div style={{fontSize:11,fontWeight:700,color:statusClr(appt.status),background:statusClr(appt.status)+"15",padding:"2px 8px",borderRadius:99,whiteSpace:"nowrap",flexShrink:0}}>{appt.status||"נקבע"}</div>
                  </div>
                  <div style={{fontSize:12,color:"#64748b",marginTop:3,display:"flex",gap:8,flexWrap:"wrap"}}>
                    {appt.timeFrom&&<span>🕐 {appt.timeFrom}{appt.timeTo&&`–${appt.timeTo}`}</span>}
                    {appt.pestType&&<span>🦟 {appt.pestType}</span>}
                  </div>
                  {addr&&<div style={{fontSize:12,color:"#475569",marginTop:3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>📍 {addr}</div>}
                </div>
                <div style={{fontSize:12,color:"#94a3b8",flexShrink:0}}>{isExpanded?"▲":"▼"}</div>
              </div>
            </div>

            {/* כפתורי פעולה מהירה — תמיד גלויים */}
            {!isDone&&<div style={{padding:"0 16px 12px",display:"flex",gap:7,flexWrap:"wrap"}}>
              {phone&&<>
                <a href={`tel:${phone}`} style={{display:"flex",alignItems:"center",gap:5,padding:"8px 11px",borderRadius:10,background:"#dcfce7",color:"#15803d",fontSize:12,fontWeight:700,textDecoration:"none",border:"none"}}>📞 שיחה</a>
                <a href={`https://wa.me/${waPhone}?text=${waMsg}`} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",gap:5,padding:"8px 11px",borderRadius:10,background:"#d1fae5",color:"#065f46",fontSize:12,fontWeight:700,textDecoration:"none"}}>💬 וואטסאפ</a>
              </>}
              {addr&&<>
                <a href={`https://waze.com/ul?q=${encodeURIComponent(addr)}&navigate=yes`} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",gap:5,padding:"8px 11px",borderRadius:10,background:"#dbeafe",color:"#1d4ed8",fontSize:12,fontWeight:700,textDecoration:"none"}}>🗺 Waze</a>
                <a href={`https://maps.google.com/?q=${encodeURIComponent(addr)}`} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",gap:5,padding:"8px 11px",borderRadius:10,background:"#fef3c7",color:"#b45309",fontSize:12,fontWeight:700,textDecoration:"none"}}>📍 מפות</a>
              </>}
            </div>}

            {/* כפתור עדכון סטטוס */}
            {!isDone&&next&&(
              <div style={{padding:"0 16px 14px"}}>
                <button onClick={()=>{
                  const ns = nextStatus(appt.status);
                  if(ns==="בוצע"&&!window.confirm(`לסמן את הטיפול אצל ${appt.customerName} כ"בוצע"?`)) return;
                  updateStatus(appt, ns);
                }}
                  style={{width:"100%",padding:"11px",borderRadius:12,border:"none",background:nextStatus(appt.status)==="בוצע"?"#16a34a":"#2563eb",color:"#fff",fontSize:14,fontWeight:800,cursor:"pointer",fontFamily:"inherit",boxShadow:nextStatus(appt.status)==="בוצע"?"0 2px 12px rgba(22,163,74,0.35)":"0 2px 12px rgba(37,99,235,0.25)",letterSpacing:"-0.2px"}}>

                </button>
              </div>
            )}

            {isExpanded&&<div style={{padding:"0 16px 16px",borderTop:"1px solid #f1f5f9",marginTop:4,paddingTop:14}}>

// ─── בנר תזכורות חכם ─────────────────────────────────────────────────────
function ReminderBanner({appointments, customers, scheduledMsgs, currentUser}){
  const [dismissed, setDismissed] = React.useState(() => {
    try{ return JSON.parse(localStorage.getItem('h360_rem_dismissed')||'{}'); }catch{ return {}; }
  });
  const dismiss = id => {
    const next = {...dismissed, [id]: todayStr()};
    setDismissed(next);
    try{ localStorage.setItem('h360_rem_dismissed', JSON.stringify(next)); }catch{}
  };

  const tomorrow = (() => { const d=new Date(); d.setDate(d.getDate()+1); return d.toISOString().split('T')[0]; })();
  const today    = todayStr();

  // תורים שצריכים תזכורת: היום ומחר, עם טלפון, שלא נשלחה להם תזכורת היום
  const sentToday = new Set((scheduledMsgs||[]).filter(m=>m.sentAt&&m.sentAt.startsWith(today)).map(m=>String(m.apptId)));

  const pending = (appointments||[]).filter(a => {
    if(a.status==="בוצע"||a.status==="בוטל") return false;
    if(a.date!==today && a.date!==tomorrow) return false;
    const cust = customers.find(c=>c.id===a.customerId||c.name===a.customerName)||{};
    if(!cust.phone) return false;
    if(sentToday.has(String(a.id))) return false;
    if(dismissed[a.id]===today) return false;
    return true;
  });

  if(pending.length===0 || currentUser?.role==="מדביר") return null;

  return (
    <div style={{background:"linear-gradient(90deg,#065f46,#047857)",borderRadius:14,padding:"14px 18px",marginBottom:18,boxShadow:"0 4px 16px rgba(5,150,105,0.25)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
        <div style={{display:"flex",gap:10,alignItems:"center",flexShrink:0}}>
          <div style={{fontSize:24}}>🔔</div>
          <div>
            <div style={{fontSize:14,fontWeight:800,color:"#fff",marginBottom:2}}>
              {pending.length} לקוח{pending.length!==1?'ות':''} ממתינ{pending.length!==1?'ים':''} לתזכורת
            </div>
            <div style={{fontSize:12,color:"#a7f3d0"}}>תורים של היום ומחר שלא קיבלו תזכורת WhatsApp</div>
          </div>
        </div>
        <button onClick={()=>pending.forEach(a=>dismiss(a.id))} style={{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:8,padding:"5px 10px",color:"#fff",fontSize:12,cursor:"pointer",flexShrink:0}}>✕ סגור</button>
      </div>
      <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:8}}>
        {pending.map(appt=>{
          const cust = customers.find(c=>c.id===appt.customerId||c.name===appt.customerName)||{};
          const phone = (cust.phone||'').replace(/[^0-9]/g,'').replace(/^0/,'972');
          const isToday = appt.date===today;
          const timeLabel = appt.timeFrom ? ` · ${appt.timeFrom}` : appt.time ? ` · ${appt.time}` : '';
          const txt = encodeURIComponent(
            `שלום ${appt.customerName} 👋\n\n` +
            (isToday
              ? `תזכורת: היום${timeLabel} יגיע המדביר${appt.workerName?` ${appt.workerName}`:''}` + (appt.address?` לטיפול ב${appt.address}`:'') + ` בנושא *${appt.pestType||'הדברה'}*.`
              : `תזכורת: מחר${timeLabel} יגיע המדביר${appt.workerName?` ${appt.workerName}`:''}` + (appt.address?` לטיפול ב${appt.address}`:'') + ` בנושא *${appt.pestType||'הדברה'}*.`) +
            `\n\nלשאלות — הדברה 360 🦟`
          );
          return (
            <div key={appt.id} style={{background:"rgba(255,255,255,0.1)",borderRadius:10,padding:"10px 14px",display:"flex",alignItems:"center",gap:10}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:700,color:"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                  {appt.customerName} — {appt.pestType||'הדברה'}
                  <span style={{marginRight:8,fontSize:11,background:isToday?"#fde68a":"#a7f3d0",color:isToday?"#92400e":"#065f46",padding:"1px 7px",borderRadius:99,fontWeight:700}}>{isToday?'היום':'מחר'}</span>
                </div>
                <div style={{fontSize:11,color:"#a7f3d0"}}>{appt.address||''}{timeLabel}</div>
              </div>
              <div style={{display:"flex",gap:6,flexShrink:0}}>
                <a href={`https://wa.me/${phone}?text=${txt}`} target="_blank" rel="noreferrer"
                  onClick={()=>dismiss(appt.id)}
                  style={{display:"flex",alignItems:"center",gap:5,padding:"7px 12px",borderRadius:9,background:"#25d366",color:"#fff",fontSize:12,fontWeight:700,textDecoration:"none",whiteSpace:"nowrap"}}>
                  💬 שלח תזכורת
                </a>
                <button onClick={()=>dismiss(appt.id)} style={{padding:"7px 10px",borderRadius:9,background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",fontSize:12,cursor:"pointer"}}>
                  ✓ נשלח
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Dashboard({customers,appointments,finance,workers,execLogs,maintenance=[],scheduledMsgs=[]}){
  // License expiry warnings
  const today=new Date(); today.setHours(0,0,0,0);
  const in30=new Date(today); in30.setDate(in30.getDate()+30);
  const FREQ_DAYS={"פעמיים בשבוע":3,"פעם בשבוע":7,"אחזקה חודשית":31,"כל חודשיים":62,"רבעוני (כל 3 חודשים)":92,"כל 6 חודשים":184,"שנתי":365};
  const overdueMaintenances=maintenance.filter(m=>{
    if(m.status!=="פעיל") return false;
    const freqDays=FREQ_DAYS[m.frequency]||92;
    const thresholdDate=new Date(today); thresholdDate.setDate(thresholdDate.getDate()-freqDays);
    const thresholdISO=thresholdDate.toISOString().split("T")[0];
    const lastVisit=appointments.filter(a=>(a.customerName===m.customerName||a.address===m.address)&&a.status==="בוצע").sort((a,b)=>b.date.localeCompare(a.date))[0];
    const lastDate=lastVisit?.date||m.startDate||"";
    return lastDate<thresholdISO;
  });
  // Tomorrow's appointments for reminders
  const tomorrow=new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
  const tomorrowISO=`${tomorrow.getFullYear()}-${String(tomorrow.getMonth()+1).padStart(2,"0")}-${String(tomorrow.getDate()).padStart(2,"0")}`;
  const tomorrowAppts=appointments.filter(a=>a.date===tomorrowISO&&a.status!=="בוטל").sort((a,b)=>a.time.localeCompare(b.time));

  // Yearly anniversary reminders — customers who had treatment ~1 year ago
  const oneYearAgoDate=new Date(today); oneYearAgoDate.setFullYear(oneYearAgoDate.getFullYear()-1);
  const windowStart=new Date(oneYearAgoDate); windowStart.setDate(windowStart.getDate()-7);
  const windowEnd=new Date(oneYearAgoDate); windowEnd.setDate(windowEnd.getDate()+7);
  const wsISO=windowStart.toISOString().split("T")[0];
  const weISO=windowEnd.toISOString().split("T")[0];
  const anniversaryCustomers=customers.filter(c=>{
    const lastTreat=c.lastTreatment||appointments.filter(a=>a.customerId===c.id&&a.status==="בוצע").sort((a,b)=>b.date.localeCompare(a.date))[0]?.date||"";
    return lastTreat>=wsISO&&lastTreat<=weISO&&c.status!=="לא פעיל";
  }).slice(0,5);

  const licenseWarnings=workers.filter(w=>isTech(w)&&w.licenseExpiry).map(w=>{
    const exp=new Date(w.licenseExpiry+"T00:00:00");
    const diff=Math.round((exp-today)/(1000*60*60*24));
    if(diff<0) return {name:w.name,msg:"פג תוקף ב-"+fmtDate(w.licenseExpiry),urgent:true};
    if(diff<=30) return {name:w.name,msg:"פג תוקף בעוד "+diff+" ימים ("+fmtDate(w.licenseExpiry)+")",urgent:diff<=7};
    return null;
  }).filter(Boolean);
  const income=finance.filter(f=>f.type==="הכנסה").reduce((s,f)=>s+f.amount,0);
  const expense=finance.filter(f=>f.type==="הוצאה").reduce((s,f)=>s+f.amount,0);
  const pending=appointments.filter(a=>a.status==="ממתין");
  const done=appointments.filter(a=>a.status==="בוצע").length;
  const debts=customers.filter(c=>c.status==="חוב");
  const payNotes=execLogs.filter(l=>!l.paymentDone&&l.paymentNote);
  const noInvoice=appointments.filter(a=>a.status==="בוצע"&&!finance.some(f=>f.apptId===a.id));
  const openDebt=finance.filter(f=>f.status==="חוב").reduce((s,f)=>s+f.amount,0);
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    const names=["ינו","פבר","מרץ","אפר","מאי","יוני","יולי","אוג","ספט","אוק","נוב","דצמ"];
    const inc=finance.filter(f=>f.type==="הכנסה"&&(f.date||"").startsWith(key)).reduce((s,f)=>s+f.amount,0);
    months.push({label:names[d.getMonth()],inc});
  }
  const maxVal=Math.max(...months.map(m=>m.inc),1);
  const workerStats=workers.filter(w=>isTech(w)).map(w=>({
    name:w.name, color:w.color||CLR.primary,
    total:appointments.filter(a=>a.workerId===w.id).length,
    done:appointments.filter(a=>a.workerId===w.id&&a.status==="בוצע").length,
  })).sort((a,b)=>b.done-a.done);
  return <div>
    <div style={{display:"flex",gap:12,marginBottom:20,flexWrap:"wrap"}}>
      <StatCard label="לקוחות פעילים" value={customers.filter(c=>c.status==="פעיל").length}/>
      <StatCard label="תורים ממתינים" value={pending.length} sub={done+" הושלמו"}/>
      <StatCard label="הכנסות" value={"₪"+income.toLocaleString()} bg="#dcfce7"/>
      <StatCard label="רווח נקי" value={"₪"+(income-expense).toLocaleString()} bg="#dbeafe"/>
      <StatCard label="חובות" value={"₪"+openDebt.toLocaleString()} bg="#fee2e2"/>
    </div>
    {/* Tomorrow reminders */}
    {tomorrowAppts.length>0&&<div style={{background:"#f0fdf4",border:"1px solid #86efac",borderRadius:12,padding:"14px 18px",marginBottom:16}}>
      <div style={{fontWeight:700,color:"#166534",marginBottom:10,fontSize:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span>📅 תורים מחר ({tomorrowAppts.length})</span>
        <span style={{fontSize:12,fontWeight:400,color:"#6b7280"}}>{String(tomorrow.getDate()).padStart(2,"0")}/{String(tomorrow.getMonth()+1).padStart(2,"0")}/{tomorrow.getFullYear()}</span>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {tomorrowAppts.map(a=>{
          const cust=customers.find(c=>c.id===a.customerId)||{};
          const phone=(cust.phone||"").replace(/[^0-9]/g,"").replace(/^0/,"972");
          const reminderText=["שלום *"+a.customerName+"* 👋","","תזכורת: מחר יגיע אלינו המדביר *"+a.workerName+"* לטיפול ב*"+a.pestType+"*.","📍 "+a.address,"🕐 "+(a.timeWindow||"בשעה "+a.time),"","לשאלות — "+COMPANY.name+" 🦟"].join("\n");
          return <div key={a.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#fff",borderRadius:8,padding:"8px 12px",border:"1px solid #bbf7d0"}}>
            <div>
              <span style={{fontWeight:600,fontSize:13}}>{a.customerName}</span>
              <span style={{fontSize:12,color:"#6b7280",marginRight:8}}>{" · "}{a.pestType}{" · "}{a.time}{" · "}{a.workerName}</span>
            </div>
            <div style={{display:"flex",gap:6}}>
              {cust.phone&&<a href={"https://wa.me/"+phone+"?text="+encodeURIComponent(reminderText)} target="_blank" rel="noopener"
                style={{padding:"4px 12px",borderRadius:6,background:"#dcfce7",color:"#166534",border:"1px solid #86efac",fontSize:12,fontWeight:600,textDecoration:"none"}}>
                💬 שלח תזכורת
              </a>}
              {!cust.phone&&<span style={{fontSize:11,color:"#9ca3af"}}>אין טלפון</span>}
            </div>
          </div>;
        })}
      </div>
    </div>}
    {(()=>{const ren=maintenance.filter(m=>m.status==="פעיל"&&maintDaysLeft(m)!=null&&maintDaysLeft(m)<=30);return ren.length>0&&<div style={{background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:12,padding:"12px 18px",marginBottom:16}}>
      <div style={{fontWeight:700,color:"#991b1b",marginBottom:6,fontSize:14}}>⏳ חוזי אחזקה לחידוש ({ren.length})</div>
      {ren.map(m=>{const d=maintDaysLeft(m);return <div key={m.id} style={{fontSize:13,padding:"2px 0"}}><b>{m.customerName}</b> — {d<0?`הסתיים לפני ${-d} ימים`:`מסתיים בעוד ${d} ימים`}</div>;})}
    </div>;})()}

// EXCEL EXPORT
function exportToCSV(filename,headers,rows){
  const esc=v=>{const s=String(v==null?"":v);if(s.includes(",")||s.includes('"')||s.includes("\n")){return '"'+s.replace(/"/g,'""')+'"';}return s;};
  const lines=[headers.map(esc).join(","),...rows.map(r=>r.map(esc).join(","))];
  const blob=new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=Object.assign(document.createElement("a"),{href:URL.createObjectURL(blob),download:filename});
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function exportCollabs(collabs, appointments){
  const headers=["שם","טלפון","אזור","רישיון","סטטוס","סוג עמלה","ערך עמלה","תורים משויכים","תורים שבוצעו","שווי עבודות","מגיע לו","שולם","נשאר לשלם","הערות"];
  const rows=collabs.map(c=>{
    const collabAppts=appointments.filter(a=>a.collabId===c.id);
    const doneAppts=collabAppts.filter(a=>a.status==="בוצע");
    const doneVal=doneAppts.reduce((s,a)=>s+a.price,0);
    const totalPaid=(c.payments||[]).reduce((s,p)=>s+p.amount,0);
    let freelancerOwed=0;
    if(c.commissionType==="אחוזים"&&c.commissionValue){
      freelancerOwed=Math.round(doneVal*(1-parseInt(c.commissionValue)/100));
    } else if(c.commissionType==="סכום קבוע"&&c.commissionValue){
      freelancerOwed=doneVal-doneAppts.length*parseInt(c.commissionValue||0);
    }
    const remaining=Math.max(0,freelancerOwed-totalPaid);
    return [c.name,c.phone||"",c.area||"",c.license||"",c.status,c.commissionType,c.commissionValue||"",
      collabAppts.length,doneAppts.length,doneVal,freelancerOwed,totalPaid,remaining,c.notes||""];
  });
  exportToCSV("שיתופי_פעולה_"+todayStr()+".csv", headers, rows);
}

// Table mapping: JS key -> Supabase table name
// נתוני הדוגמה שהגיעו עם המערכת — לא מוצגים יותר, ומנוקים מהמטמון המקומי
const DEMO_DATA = {customers:initCustomers,workers:initWorkers,appointments:initAppointments,finance:initFinance,notes:initNotes,maintenance:initMaintenance,projects:initProjects,collabs:initCollabs,scheduledMsgs:initScheduledMsgs,execLogs:initExecLogs};
function stripDemo(key, arr){
  const demo=DEMO_DATA[key]; if(!demo||!Array.isArray(arr)) return arr;
  const sig=new Set(demo.map(x=>JSON.stringify(x)));
  return arr.filter(x=>!sig.has(JSON.stringify(x)));
}
const SB_TABLES = {
  customers: "customers",
  workers: "workers",
  appointments: "appointments",
  finance: "finance",
  notes: "notes",
  maintenance: "maintenance",
  projects: "projects",
  execLogs: "exec_logs",
};

// useSB: like useLS but syncs with Supabase in real-time
function useLS(key, init){
  const tbl = SB_TABLES[key];
  const initVal = typeof init === 'function' ? init() : init;

  const [val, setVal] = React.useState(()=>{
    // Start with localStorage cache for instant load
    try {
      const s = localStorage.getItem('h360_' + key);
      if(!s) return initVal;
      const v = JSON.parse(s);
      const clean = stripDemo(key, v);
      if(clean!==v && clean.length!==v.length) try{ localStorage.setItem('h360_' + key, JSON.stringify(clean)); }catch(e){}
      return clean;
    } catch(e){ return initVal; }
  });

  // Load from Supabase on mount + poll every 10s
  React.useEffect(()=>{
    if(!sb || !tbl) return;

    // סנכרון מ-Supabase: מיזוג לפי updated_at
    // Supabase הוא source of truth — כל שורה שב-Supabase מנצחת
    const syncFromSupabase = () => {
      sb.from(tbl).select('*').order('updated_at', {ascending:true})
        .then(({data, error})=>{
          if(error || !data) return; // טבלה ריקה = אין נתונים (לא מציגים דוגמאות)
          const sbRows = data.map(r => r.data);
          // החלף לגמרי במה שב-Supabase — הוא ה-source of truth
          // הכתיבה שלנו כבר עלתה לשם, אז זה בטוח
          setVal(sbRows);
          try { localStorage.setItem('h360_' + key, JSON.stringify(sbRows)); } catch(e){}
        });
    };

    syncFromSupabase();
    const poll = setInterval(syncFromSupabase, 10000);
    window.addEventListener('h360-refresh', syncFromSupabase);
    return () => { clearInterval(poll); window.removeEventListener('h360-refresh', syncFromSupabase); };
  }, [tbl]);

  const set = React.useCallback(v => {
    setVal(prev => {
      const next = typeof v === 'function' ? v(prev) : v;
      // Save to localStorage immediately
      try { localStorage.setItem('h360_' + key, JSON.stringify(next)); } catch(e){}

      if(sb && tbl){
        const nextRows = Array.isArray(next) ? next : [next];
        const prevRows = Array.isArray(prev) ? prev : (prev ? [prev] : []);

        // מצא רק שורות שהשתנו או נוספו (השווה לפי JSON)
        const prevMap = new Map(prevRows.map(r => [String(r.id), JSON.stringify(r)]));
        const changed = nextRows.filter(r => prevMap.get(String(r.id)) !== JSON.stringify(r));

        // Upsert רק שורות שהשתנו
        if(changed.length > 0){
          const upsertData = changed.map(item => ({
            id: String(item.id),
            data: item,
            updated_at: new Date().toISOString()
          }));
          console.log('[SB] upserting changed', tbl, changed.length, 'rows');
          changed.slice(0,5).forEach(item=>{
            const wasThere = prevRows.some(r=>String(r.id)===String(item.id));
            const act = !wasThere ? "יצירה" : (item.deleted && !(prevRows.find(r=>String(r.id)===String(item.id))||{}).deleted ? "העברה לסל" : "עדכון");
            logActivity(act+" "+(LOG_LABELS[tbl]||tbl), itemLabel(item));
          });
          sb.from(tbl).upsert(upsertData, {onConflict:'id'})
            .then(({error})=>{
              if(error) console.warn('[SB] sync error:', tbl, error);
              else console.log('[SB] saved OK:', tbl);
            });
        }

        // מחק רק שורות שהמשתמש מחק במפורש (היו ב-prev, אינן ב-next)
        const prevIds = new Set(prevRows.map(r => String(r.id)));
        const nextIds = new Set(nextRows.map(r => String(r.id)));
        const deletedIds = [...prevIds].filter(id => !nextIds.has(id));
        if(deletedIds.length > 0){
          console.log('[SB] deleting', tbl, deletedIds);
          deletedIds.slice(0,5).forEach(id=>{ const it=prevRows.find(r=>String(r.id)===id); logActivity("מחיקה "+(LOG_LABELS[tbl]||tbl), itemLabel(it)); });
          sb.from(tbl).delete().in('id', deletedIds).then(()=>{});
        }
      }
      return next;
    });
  }, [key, tbl]);

  return [val, set];
}

// ─── Soft Delete — ארכיון במקום מחיקה לצמיתות ───────────────────────────
// במקום filter(x=>x.id!==id), קורא לזה: softDelete(setter, id)
// פריטים עם deleted:true נסוננים אוטומטית בתצוגה אבל שמורים ב-Supabase
function softDelete(setter, id){
  setter(prev => prev.map(x => x.id===id ? {...x, deleted:true, deletedAt:new Date().toISOString()} : x));
}
function softRestore(setter, id){
  setter(prev => prev.map(x => x.id===id ? {...x, deleted:false, deletedAt:null} : x));
}
// פילטר גלובלי — מסנן פריטים שנמחקו רכה
function activeOnly(arr){ return (arr||[]).filter(x=>!x.deleted); }

function exportBackup(){
  const DATA_KEYS=["customers","workers","appointments","finance","notes","maintenance","projects","collabs","execLogs"];
  const backup={version:1, exportedAt:new Date().toISOString(), data:{}};
  DATA_KEYS.forEach(k=>{
    try{ const v=localStorage.getItem("h360_"+k); backup.data[k]=v?JSON.parse(v):[]; }
    catch(e){ backup.data[k]=[]; }
  });
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
  const a=Object.assign(document.createElement("a"),{
    href:URL.createObjectURL(blob),
    download:"hadbara360_backup_"+new Date().toISOString().slice(0,10)+".json"
  });
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function importBackup(){
  const input=document.createElement("input");
  input.type="file"; input.accept=".json";
  input.onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const backup=JSON.parse(ev.target.result);
        if(!backup.data) throw new Error("קובץ גיבוי לא תקין");
        const count=Object.keys(backup.data).length;
        if(!window.confirm("⚠️ שחזור גיבוי מ-"+new Date(backup.exportedAt).toLocaleDateString("he-IL")+"\n\nפעולה זו תחליף את כל הנתונים הקיימים!\n\nלהמשיך?")) return;
        Object.entries(backup.data).forEach(([k,v])=>{
          localStorage.setItem("h360_"+k, JSON.stringify(v));
        });
        alert("✅ הגיבוי שוחזר בהצלחה! הדף יטען מחדש.");
        window.location.reload();
      } catch(err){
        alert("❌ שגיאה בטעינת הגיבוי: "+err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetAllData(){
  if(!window.confirm('⚠️ למחוק את כל הנתונים ולחזור להגדרות ברירת מחדל?\n\nפעולה זו אינה ניתנת לביטול!')) return;
  ['customers','workers','appointments','finance','notes','maintenance','projects','execLogs','calcPageState']
    .forEach(k => localStorage.removeItem('h360_' + k));
  window.location.reload();
}

// GLOBAL SEARCH
// ═══════════════════════════════════════════════════════
function GlobalSearch({customers, appointments, finance, execLogs, notes, workers, onNavigate, onClose}){
  const [q, setQ] = React.useState('');
  const [selIdx, setSelIdx] = React.useState(0);
  const [preview, setPreview] = React.useState(null);

  // פונקציה: הדגשת טקסט חיפוש
  const highlight = (str, term) => {
    if(!str||!term) return str||'';
    const idx = String(str).toLowerCase().indexOf(term.toLowerCase());
    if(idx===-1) return str;
    return <span>{String(str).slice(0,idx)}<mark style={{background:"#fde68a",borderRadius:2,padding:"0 1px"}}>{String(str).slice(idx,idx+term.length)}</mark>{String(str).slice(idx+term.length)}</span>;
  };

  const results = React.useMemo(()=>{
    const s = q.trim();
    if(s.length < 2) return [];
    const lc = s.toLowerCase();
    const match = str => str && String(str).toLowerCase().includes(lc);
    const out = [];
    customers.forEach(c=>{
      if(match(c.name)||match(c.phone)||match(c.address)||match(c.email)||match(c.city)){
        const cAppts = (appointments||[]).filter(a=>a.customerId===c.id||a.customerName===c.name);
        out.push({
          type:'customer', icon:'👤',
          label: c.name,
          sub: [c.phone, c.city||c.address].filter(Boolean).join(' · '),

          tab:'customers', data:c,
          actions: c.phone ? [{label:'📞 התקשר', href:`tel:${c.phone}`},{label:'💬 WhatsApp', href:`https://wa.me/${c.phone.replace(/[^0-9]/g,'').replace(/^0/,'972')}`}] : [],
        });
      }
    });
    appointments.forEach(a=>{
      if(match(a.customerName)||match(a.pestType)||match(a.address)||match(a.workerName)||match(a.notes)){
        const cust = customers.find(c=>c.id===a.customerId||c.name===a.customerName)||{};
        const isToday = a.date===todayStr();
        const isFuture = a.date>todayStr();
        out.push({

          label:`${a.customerName}`,
          sub:`${fmtDate(a.date)} ${a.timeFrom||a.time||''} · ${a.pestType||''} · ${a.address||''}`,

        });
      }
    });
    (finance||[]).filter(f=>f.category==='חשבונית').forEach(f=>{
      if(match(f.customer)||match(f.invoiceNum)||match(f.pestType)||match(String(f.amount||'')))
        out.push({type:'invoice', icon:'🧾', label:`חשבונית ${f.invoiceNum||''} — ${f.customer||''}`, sub:`₪${f.amount} · ${fmtDate(f.date)} · ${f.status}`, tab:'invoices', data:f});
    });
    (execLogs||[]).forEach(l=>{
      if(match(l.customerName||l.clientName)||match(l.address)||match(l.notes))
        out.push({type:'log', icon:'📋', label:`ביצוע — ${l.customerName||l.clientName||''}`, sub:`${fmtDate(l.date)} · ${l.workerName||''} · ${l.pest||l.pestType||''}`, tab:'execlog', data:l});
    });
    (notes||[]).forEach(n=>{
      if(match(n.title)||match(n.content))
        out.push({type:'note', icon:'📓', label:n.title, sub:`${n.author} · ${fmtDate(n.date)}`, tab:'notes', data:n});
    });
    (workers||[]).forEach(w=>{
      if(match(w.name)||match(w.phone)||match(w.zone)||match(w.specialty))
        out.push({type:'worker', icon:'👷', label:w.name, sub:`${w.role||''} · ${w.zone||''} · ${w.phone||''}`, tab:'workers', data:w, actions: w.phone ? [{label:'📞 התקשר', href:`tel:${w.phone}`}] : []});
    });
    return out.slice(0,30);
  }, [q, customers, appointments, finance, execLogs, notes, workers]);

    if(e.key==="ArrowDown"){ e.preventDefault(); setSelIdx(i=>Math.min(i+1,results.length-1)); return; }
    if(e.key==="ArrowUp"){ e.preventDefault(); setSelIdx(i=>Math.max(i-1,0)); return; }
    if(e.key==="Enter" && results[selIdx]){ onNavigate(results[selIdx].tab); onClose(); }

  // קבוצות לתצוגה
  const groups = [

    {type:'invoice',  label:'🧾 חשבוניות'},
    {type:'log',      label:'📋 ביצוע'},
    {type:'note',     label:'📓 הערות'},
    {type:'worker',   label:'👷 עובדים'},

  return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",zIndex:2500,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"50px 16px 16px",backdropFilter:"blur(2px)"}} onClick={onClose}>
    <div style={{background:"#fff",borderRadius:20,width:680,maxWidth:"98vw",maxHeight:"85vh",display:"flex",flexDirection:"column",direction:"rtl",boxShadow:"0 32px 100px rgba(0,0,0,0.4)"}} onClick={e=>e.stopPropagation()}>

      {/* שדה חיפוש */}
      <div style={{padding:"16px 20px",display:"flex",alignItems:"center",gap:12,borderBottom:"1px solid #f0f0f0"}}>
        <div style={{width:38,height:38,background:"#f1f5f9",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>🔍</div>
        <input ref={inputRef} value={q} onChange={e=>setQ(e.target.value)} onKeyDown={handleKey}
          placeholder="חפש לקוח, תור, כתובת, טלפון, חשבונית, מזיק..."
          style={{flex:1,border:"none",outline:"none",fontSize:16,background:"transparent",direction:"rtl",fontFamily:"inherit"}}/>
        {q&&<button onClick={()=>setQ('')} style={{background:"#f1f5f9",border:"none",borderRadius:6,width:26,height:26,cursor:"pointer",color:"#9ca3af",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>}
        <kbd style={{background:"#f1f5f9",border:"1px solid #e2e8f0",borderRadius:6,padding:"2px 7px",fontSize:11,color:"#6b7280",flexShrink:0,whiteSpace:"nowrap"}}>ESC</kbd>

            <div style={{fontSize:15,fontWeight:600,color:"#374151",marginBottom:6}}>חיפוש גלובלי</div>
            <div style={{fontSize:13,color:"#9ca3af",lineHeight:1.7}}>חפש לקוח, תור, כתובת, טלפון, חשבונית ועוד<br/><kbd style={{background:"#f1f5f9",border:"1px solid #e2e8f0",borderRadius:4,padding:"1px 6px",fontSize:11}}>Ctrl+K</kbd> לפתיחה מכל מקום · חצים לניווט · Enter לכניסה</div>

          </div>
        ) : groups.map(group=>(
          <div key={group.type}>

            {group.items.map((r,i)=>{

function DayView({date, appointments, workers, finance, execLogs, currentUser, onApptClick, onNewAppt}){
  const toISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const iso = toISO(date);
  const HALF_SLOTS = ["07:00","07:30","08:00","08:30","09:00","09:30","10:00","10:30","11:00","11:30",
    "12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00"];
  const slotHour = t => parseInt((t||"0").split(":")[0]);
  const slotMin  = t => parseInt(((t||"0").split(":")[1])||"0");
  const dayNames = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
  const fmtDay = d => `יום ${dayNames[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
  const wColor = wid => { const w=workers.find(x=>x.id===wid); return w?.color||"#1a5c3a"; };

  const dayAppts = (appointments||[]).filter(a => a.date===iso)
    .sort((a,b)=>String(a.time||"").localeCompare(String(b.time||"")));

  return <div style={{direction:"rtl"}}>
    <div style={{fontWeight:700,fontSize:15,color:"#1a5c3a",marginBottom:12,padding:"8px 0 10px",borderBottom:"2px solid #e8f5ee",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <span style={{fontSize:14}}>{dayAppts.length?"התורים של היום":""}</span>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <span style={{fontSize:13,fontWeight:400,color:"#6b7280"}}>{dayAppts.length} תורים</span>
        {dayAppts.length>0&&<button onClick={()=>printDaySchedule(date,appointments,workers)} style={{background:CLR.primary,color:"#fff",border:"none",borderRadius:6,padding:"4px 10px",fontSize:11,cursor:"pointer",fontWeight:600}}>🖨️ הדפס</button>}
      </div>
    </div>
    {dayAppts.length===0 && <div style={{textAlign:"center",padding:"60px 20px",color:"#9ca3af",fontSize:14}}>
      אין תורים ביום זה
      <div style={{marginTop:12}}><button onClick={()=>onNewAppt(iso,"09:00")} style={{background:"#1a5c3a",color:"#fff",border:"none",borderRadius:8,padding:"9px 20px",cursor:"pointer",fontWeight:600,fontSize:13}}>+ הוסף תור</button></div>
    </div>}
    <div style={{border:"1px solid #e5e7eb",borderRadius:10,overflow:"hidden"}}>
      {HALF_SLOTS.map(slot=>{
        // כל תור נכנס לחצי-השעה שלו (גם 10:15 / 06:00 / 21:00 יוצגו)
        const slotOf = t => { let h=slotHour(t), m=slotMin(t)>=30?30:0; if(isNaN(h)) h=9; if(h<7){h=7;m=0;} if(h>19||(h===19&&m>0)){h=19;m=0;} return String(h).padStart(2,"0")+":"+(m?"30":"00"); };
        const atSlot = dayAppts.filter(a=>slotOf(a.time)===slot);
        const isHour = slot.endsWith(":00");
        return <div key={slot} style={{display:"flex",minHeight:atSlot.length?72:36,borderBottom:"1px solid #f3f4f6",background:atSlot.length?"#fafffe":"#fff"}}>
          <div style={{width:54,flexShrink:0,padding:"6px 8px 0",fontSize:isHour?12:10,color:isHour?"#6b7280":"#d1d5db",fontWeight:isHour?600:400,borderLeft:"2px solid #e5e7eb",textAlign:"right"}}>{isHour?slot:""}</div>
          <div style={{flex:1,padding:"4px 8px",display:"flex",flexWrap:"wrap",gap:6,alignItems:"flex-start",cursor:atSlot.length?"default":"pointer"}}
            onClick={()=>atSlot.length===0&&onNewAppt(iso,slot)}>
            {atSlot.map(a=>{
              const prog=jobProgress(a,execLogs,finance);
              return <div key={a.id} onClick={e=>{e.stopPropagation();onApptClick(a);}}
                style={{background:"#fff",border:`2px solid ${wColor(a.workerId)}`,borderRadius:10,padding:"8px 12px",cursor:"pointer",flex:"1 1 220px",maxWidth:380,boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                  <span style={{fontWeight:700,fontSize:13,color:"#111"}}>{a.time} · {a.customerName}</span>
                  <span style={{fontSize:11,color:prog.color,fontWeight:600,background:prog.color+"18",padding:"1px 7px",borderRadius:20}}>{prog.label}</span>
                </div>
                <div style={{fontSize:12,color:"#6b7280",marginBottom:1}}>🐛 {a.pestType} · 💰 ₪{a.price}</div>
                <div style={{fontSize:11,color:"#9ca3af"}}>👷 {a.workerName} · 📍 {(a.address||"").slice(0,40)}</div>
              </div>;
            })}
            {atSlot.length===0&&<div style={{fontSize:10,color:"#f3f4f6",padding:"2px 0",width:"100%",userSelect:"none"}}>+</div>}
          </div>
        </div>;
      })}
    </div>
  </div>;
}

// ═══════════════════════════════════════════════════════
// MONTH VIEW
// ═══════════════════════════════════════════════════════
function MonthView({year, month, appointments, workers, finance, execLogs, currentUser, onDayClick}){
  const toISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const todayISO = toISO(new Date());
  const wColor = wid => { const w=workers.find(x=>x.id===wid); return w?.color||"#1a5c3a"; };

  const firstDay = new Date(year, month, 1);
  const lastDay  = new Date(year, month+1, 0);
  // Week starts Sunday (0). We want Sunday first.
  const startPad = firstDay.getDay(); // 0=Sun … 6=Sat
  const totalCells = Math.ceil((startPad + lastDay.getDate()) / 7) * 7;

  const days = [];
  for(let i=0; i<totalCells; i++){
    const dayNum = i - startPad + 1;
    if(dayNum < 1 || dayNum > lastDay.getDate()){ days.push(null); continue; }
    const d = new Date(year, month, dayNum);
    const iso = toISO(d);
    const appts = (appointments||[]).filter(a=>a.date===iso);
    days.push({dayNum, iso, appts, isToday: iso===todayISO});
  }

  const dayLabels = ["א'","ב'","ג'","ד'","ה'","ו'","ש'"];
  const monthNames = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];

  return <div style={{direction:"rtl"}}>
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:1,background:"#e5e7eb",border:"1px solid #e5e7eb",borderRadius:10,overflow:"hidden"}}>
      {dayLabels.map(l=><div key={l} style={{background:"#1a5c3a",color:"#fff",textAlign:"center",padding:"7px 0",fontSize:12,fontWeight:600}}>{l}</div>)}
      {days.map((day,i)=>(
        <div key={i} onClick={()=>day&&onDayClick(new Date(year,month,day.dayNum))}
          style={{background:day?.isToday?"#e8f5ee":"#fff",minHeight:64,padding:"4px",minWidth:0,overflow:"hidden",cursor:day?"pointer":"default",
            outline:day?.isToday?"2px solid #1a5c3a":"none",outlineOffset:"-2px",position:"relative"}}
          onMouseEnter={e=>day&&(e.currentTarget.style.background=day.isToday?"#d1fae5":"#f9fafb")}
          onMouseLeave={e=>day&&(e.currentTarget.style.background=day?.isToday?"#e8f5ee":"#fff")}>
          {day && <>
            <div style={{fontSize:12,fontWeight:day.isToday?700:500,color:day.isToday?"#1a5c3a":"#374151",marginBottom:3}}>{day.dayNum}</div>
            {day.appts.slice(0,3).map(a=>{
              const prog=jobProgress(a,execLogs,finance);
              return <div key={a.id} style={{fontSize:10,padding:"2px 5px",borderRadius:4,marginBottom:2,
                background:wColor(a.workerId)+"22",borderRight:`3px solid ${wColor(a.workerId)}`,
                overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis",color:"#111"}}>
                {a.time} {a.customerName}
              </div>;
            })}
            {day.appts.length>3&&<div style={{fontSize:10,color:"#6b7280",padding:"1px 4px"}}>+{day.appts.length-3} נוספים</div>}
          </>}
        </div>
      ))}
    </div>
  </div>;
}

// לידים מהאתר

const LEAD_STATUSES = ["חדש","נוצר קשר","הפך ללקוח","לא רלוונטי"];
const LEAD_COLORS = {"חדש":"#2563eb","נוצר קשר":"#d97706","הפך ללקוח":"#16a34a","לא רלוונטי":"#64748b"};
const SITE_BASE = "https://hadbara360.co.il";

function useLeads(enabled){
  const [leads,setLeads]=React.useState([]);
  const load=React.useCallback(()=>{
    if(!sb||!enabled) return;
    sb.from('leads').select('*').order('created_at',{ascending:false}).limit(500)
      .then(({data,error})=>{ if(!error&&data) setLeads(data); });
  },[enabled]);
  React.useEffect(()=>{ load(); const t=setInterval(load,30000); return ()=>clearInterval(t); },[load]);
  return [leads,load];
}

function leadPageName(l){
  const t=(l.page_title||"").split("|")[0].trim();
  if(t) return t;
  try{ return decodeURIComponent(l.page_path||"/"); }catch(e){ return l.page_path||"/"; }
}
function waPhone(p){
  let d=String(p||"").replace(/\D/g,"");
  if(d.startsWith("0")) d="972"+d.slice(1);
  return d;
}

function LeadsPage({leads,reload,customers,setCustomers,goToCustomers}){
  const [filter,setFilter]=React.useState("פתוחים");
  const [busy,setBusy]=React.useState(null);
  const shown=leads.filter(l=> filter==="הכל" ? true : filter==="פתוחים" ? (l.status==="חדש"||l.status==="נוצר קשר") : l.status===filter);

  const monthStart=new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
  const thisMonth=leads.filter(l=>new Date(l.created_at)>=monthStart);
  const converted=thisMonth.filter(l=>l.status==="הפך ללקוח").length;
  const byPage={}; thisMonth.forEach(l=>{const k=leadPageName(l); byPage[k]=(byPage[k]||0)+1;});
  const topPages=Object.entries(byPage).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const update=async(l,patch)=>{
    setBusy(l.id);
    const {error}=await sb.from('leads').update({...patch,updated_at:new Date().toISOString()}).eq('id',l.id);
    if(!error) logActivity("ליד: "+(patch.status||"עדכון"), l.name);
    setBusy(null);
    if(error) alert('שגיאה בשמירה: '+error.message); else reload();
  };
  const toCustomer=async(l)=>{
    const existing=(customers||[]).find(c=>String(c.phone||"").replace(/\D/g,"")===String(l.phone).replace(/\D/g,""));
    if(existing){ if(!confirm(`כבר קיים לקוח עם הטלפון הזה: ${existing.name}. לסמן את הליד כ"הפך ללקוח" בלי ליצור כפילות?`)) return; await update(l,{status:"הפך ללקוח",customer_id:String(existing.id)}); return; }
    const id=nextId(customers||[]);
    const c={id,name:l.name,phone:l.phone,email:"",address:"—",city:"",propertyType:"",rooms:"",floor:"",
      status:"פעיל",notes:`ליד מהאתר (${leadPageName(l)}), ${fmtDate((l.created_at||"").slice(0,10))}`,
      pestType:l.pest||"",pests:l.pest?[l.pest]:[],source:"אתר האינטרנט",totalPaid:0,lastTreatment:"",tag:"new"};
    setCustomers(cs=>[...cs,c]);
    await update(l,{status:"הפך ללקוח",customer_id:String(id)});
    if(confirm(`✅ ${l.name} נוסף ללקוחות. לעבור ללשונית הלקוחות?`)) goToCustomers();
  };

  const card={background:CLR.white,border:`1px solid ${CLR.border}`,borderRadius:12,padding:"14px 16px"};
  return <div style={{maxWidth:1100,margin:"0 auto",display:"flex",flexDirection:"column",gap:14}}>
    <div style={{display:"flex",flexWrap:"wrap",gap:12}}>
      <div style={{...card,flex:"1 1 160px"}}><div style={{fontSize:12,color:CLR.muted}}>לידים החודש</div><div style={{fontSize:28,fontWeight:800,color:CLR.primary}}>{thisMonth.length}</div></div>
      <div style={{...card,flex:"1 1 160px"}}><div style={{fontSize:12,color:CLR.muted}}>הפכו ללקוחות החודש</div><div style={{fontSize:28,fontWeight:800,color:"#16a34a"}}>{converted}</div></div>
      <div style={{...card,flex:"1 1 160px"}}><div style={{fontSize:12,color:CLR.muted}}>ממתינים לטיפול</div><div style={{fontSize:28,fontWeight:800,color:"#2563eb"}}>{leads.filter(l=>l.status==="חדש").length}</div></div>
      <div style={{...card,flex:"2 1 300px"}}><div style={{fontSize:12,color:CLR.muted,marginBottom:6}}>העמודים שהביאו הכי הרבה לידים החודש</div>
        {topPages.length===0?<div style={{fontSize:13,color:CLR.muted}}>עדיין אין נתונים</div>:
          topPages.map(([p,n])=><div key={p} style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"2px 0"}}><span>{p}</span><b>{n}</b></div>)}
      </div>
    </div>
    <div style={{display:"flex",flexWrap:"wrap",gap:8,alignItems:"center"}}>
      {["פתוחים",...LEAD_STATUSES,"הכל"].map(f=><button key={f} onClick={()=>setFilter(f)}
        style={{padding:"6px 14px",borderRadius:20,border:`1.5px solid ${filter===f?CLR.primary:CLR.border}`,background:filter===f?CLR.primaryLight:"#fff",color:filter===f?CLR.primary:CLR.muted,fontWeight:600,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>{f}</button>)}
      {window.Notification&&Notification.permission!=="granted"&&<button onClick={()=>{enablePush().then(()=>reload());}} style={{marginRight:"auto",padding:"6px 12px",borderRadius:8,border:`1px solid ${CLR.primary}`,background:CLR.primaryLight,color:CLR.primary,cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:"inherit"}}>🔔 הפעל התראות</button>}
      <button onClick={reload} style={{marginRight:window.Notification&&Notification.permission!=="granted"?0:"auto",padding:"6px 12px",borderRadius:8,border:`1px solid ${CLR.border}`,background:"#fff",cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>🔄 רענון</button>
    </div>
    {shown.length===0&&<div style={{...card,textAlign:"center",color:CLR.muted,padding:30}}>אין לידים להצגה</div>}
    {shown.map(l=><div key={l.id} style={{...card,display:"flex",flexWrap:"wrap",gap:"10px 18px",alignItems:"center",opacity:busy===l.id?0.6:1}}>
      <div style={{flex:"1 1 220px",minWidth:0}}>
        <div style={{fontWeight:700,fontSize:16}}>{l.name}</div>
        <div style={{fontSize:13,color:CLR.muted,direction:"ltr",textAlign:"right"}}>{l.phone}</div>
        <div style={{fontSize:12,color:CLR.muted,marginTop:2}}>{new Date(l.created_at).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'})}</div>
      </div>
      <div style={{flex:"1 1 200px",minWidth:0,fontSize:13}}>
        <div>🐜 <b>{l.pest||"לא צוין"}</b></div>
        <div style={{color:CLR.muted,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>📄 <a href={SITE_BASE+(l.page_path||"/")} target="_blank" rel="noopener" style={{color:CLR.info}}>{leadPageName(l)}</a></div>
      </div>
      <select value={l.status} onChange={e=>update(l,{status:e.target.value})}
        style={{padding:"6px 10px",borderRadius:8,border:`1.5px solid ${LEAD_COLORS[l.status]||CLR.border}`,color:LEAD_COLORS[l.status]||"#111",fontWeight:700,fontFamily:"inherit",fontSize:13,background:"#fff"}}>
        {LEAD_STATUSES.map(st=><option key={st} value={st}>{st}</option>)}
      </select>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        <a href={"tel:"+l.phone} onClick={()=>{if(l.status==="חדש")update(l,{status:"נוצר קשר"});}} style={{padding:"7px 12px",borderRadius:8,background:CLR.primary,color:"#fff",textDecoration:"none",fontSize:13,fontWeight:600}}>📞 חיוג</a>
        <a href={"https://wa.me/"+waPhone(l.phone)+"?text="+encodeURIComponent("שלום "+l.name+", כאן הדברה 360. קיבלנו את פנייתך מהאתר"+(l.pest?" בנושא "+l.pest:"")+". מתי נוח לדבר?")} target="_blank" rel="noopener"
          onClick={()=>{if(l.status==="חדש")update(l,{status:"נוצר קשר"});}} style={{padding:"7px 12px",borderRadius:8,background:"#25D366",color:"#fff",textDecoration:"none",fontSize:13,fontWeight:600}}>💬 וואטסאפ</a>
        {l.status!=="הפך ללקוח"&&<button onClick={()=>toCustomer(l)} style={{padding:"7px 12px",borderRadius:8,border:`1px solid ${CLR.primary}`,background:CLR.primaryLight,color:CLR.primary,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>➕ צור לקוח</button>}
      </div>
    </div>)}
  </div>;
}

function App(){
  const [authUser,setAuthUser]=React.useState(()=>{
    try{const u=localStorage.getItem('crm_auth');return u?JSON.parse(u):null;}catch{return null;}
  });
  const [showAdmin,setShowAdmin]=React.useState(false);
  if(authUser) __h360User=authUser;

  const doLogin=(u)=>{
    setAuthUser(u); __h360User=u; logActivity("כניסה למערכת","");
    try{localStorage.setItem('crm_auth',JSON.stringify(u));}catch{}
  };
  const doLogout=()=>{
    setAuthUser(null);
    try{localStorage.removeItem('crm_auth');}catch{}
    try{ sb && sb.auth.signOut(); }catch{}
  };
  // בלי סשן מאובטח תקף — חוזרים למסך הכניסה
  React.useEffect(()=>{
    if(!sb) return;
    sb.auth.getSession().then(({data})=>{ if(!data.session) { setAuthUser(null); try{localStorage.removeItem('crm_auth');}catch{} } });
    const {data:sub} = sb.auth.onAuthStateChange((ev, session)=>{ if(ev==='SIGNED_OUT' || !session){ setAuthUser(null); try{localStorage.removeItem('crm_auth');}catch{} } });
    return ()=>{ try{sub.subscription.unsubscribe();}catch{} };
  },[]);

  // Map authUser to legacy user object (used after all hooks)
  const user = authUser ? {
    id: authUser.id,
    name: authUser.name,
    role: authUser.role,
  } : {id:null,name:"",role:""};
  const defaultTab = authUser?.role==="מדביר" ? "fieldview" : "dashboard";
  const [tab,setTab]=useState(()=>{
    try{
      const saved=localStorage.getItem("h360_last_tab");
      if(saved && authUser?.role==="מדביר" && saved==="fieldview") return saved;
      if(saved && authUser?.role!=="מדביר" && saved!=="fieldview") return saved;
    }catch(e){}
    return defaultTab;
  });
  // שמור tab בכל שינוי
  React.useEffect(()=>{try{localStorage.setItem("h360_last_tab",tab)}catch(e){}},[tab]);
  const [showSearch,setShowSearch]=useState(false);
  const [isMobile,setIsMobile]=React.useState(()=>window.innerWidth<900);
  const [drawerOpen,setDrawerOpen]=React.useState(false);
  React.useEffect(()=>{
    const check=()=>setIsMobile(window.innerWidth<900);
    window.addEventListener("resize",check);
    return()=>window.removeEventListener("resize",check);
  },[]);
  const [customers,setCustomers]=useLS("customers", []);
  const [leads,reloadLeads]=useLeads(!!authUser);
  const newLeadsCount=leads.filter(l=>l.status==="חדש").length;
  const seenLeads=React.useRef(null);
  React.useEffect(()=>{
    const ids=new Set(leads.map(l=>l.id));
    if(seenLeads.current){
      const fresh=leads.filter(l=>!seenLeads.current.has(l.id)&&l.status==="חדש");
      if(fresh.length&&window.Notification&&Notification.permission==="granted"){
        try{ new Notification("🌐 ליד חדש מהאתר",{body:fresh.map(l=>l.name+(l.pest?" · "+l.pest:"")).join("\n"),icon:"logo.png",tag:"h360-lead"}); }catch(e){}
      }
    }
    if(leads.length||seenLeads.current) seenLeads.current=ids;
  },[leads]);
  const [workers,setWorkers]=useLS("workers", []);
  // משתמשי המערכת (מנהל ראשי, פקידות) מופיעים אוטומטית ברשימת העובדים; המנהל הראשי גם מדביר
  React.useEffect(()=>{
    if(!sb||!authUser||authUser.role!=="מנהל") return;
    let dead=false;
    (async()=>{
      const [{data:us0},{data:wr}]=await Promise.all([sb.from('crm_users').select('id,name,role,active').order('id'), sb.from('workers').select('data')]);
      if(dead||!us0) return;
      let us=us0;
      // שם המשתמש המחובר מתעדכן אם שונה בניהול משתמשים
      const me=us.find(u=>String(u.id)===String(authUser.id));
      if(me&&me.name&&me.name!==authUser.name){ const nu={...authUser,name:me.name}; setAuthUser(nu); __h360User=nu; try{localStorage.setItem('crm_auth',JSON.stringify(nu));}catch{} }
      const remote=(wr||[]).map(r=>r.data);
      const COLORS={"מנהל":"#7c3aed","פקידה":"#2563eb","מדביר":"#16a34a"};
      setWorkers(ws=>{
        const base=remote.length?remote:ws.filter(w=>w.crmUserId!=null);
        let out=[...base], changed=false;
        us.filter(u=>u.active!==false).forEach(u=>{
          const i=out.findIndex(w=>String(w.crmUserId)===String(u.id));
          if(i<0){
            if(out.some(w=>!w.deleted&&String(w.name||"").trim()===String(u.name||"").trim())){
              out=out.map(w=>(!w.deleted&&String(w.name||"").trim()===String(u.name||"").trim()&&w.crmUserId==null)?{...w,crmUserId:u.id,alsoTech:w.alsoTech||u.role==="מנהל"}:w);
            } else {
              out=[...out,{id:nextId(out.length?out:ws),name:u.name,role:u.role==="מדביר"?"מדביר":roleLabel(u.role),phone:"",licenseNum:"",licenseExpiry:"",specialty:"",zone:"",status:"פעיל",color:COLORS[u.role]||"#0891b2",notes:"",crmUserId:u.id,alsoTech:u.role==="מנהל"}];
            }
            changed=true;
          } else if(out[i].name!==u.name){ out=out.map((w,j)=>j===i?{...w,name:u.name}:w); changed=true; }
        });
        const mgr=us.filter(u=>u.role==="מנהל").sort((a,b)=>a.id-b.id)[0];
        if(mgr){ out=out.map(w=>(String(w.crmUserId)===String(mgr.id)&&!w.licenseNum)?(changed=true,{...w,licenseNum:"2849",license:"מדביר שטחים פתוחים",licenseType:"מדביר שטחים פתוחים"}):w); }
        return changed?out:ws;
      });
    })();
    return ()=>{dead=true;};
  },[authUser&&authUser.id, authUser&&authUser.role]);
  const isAlsoWorker=(workers||[]).some(w=>!w.deleted&&isTech(w)&&w.status==="פעיל"&&authUser&&String(w.name||"").trim()===String(authUser.name||"").trim());
  const [appointments,setAppointments]=useLS("appointments", []);
  const [finance,setFinance]=useLS("finance", []);
  // תיקון תורים בלי שם לקוח (נוצרו מכרטיס הלקוח/שכפול) — משלים את השם מכרטיס הלקוח
  React.useEffect(()=>{
    if(!customers||!customers.length||!appointments||!appointments.length) return;
    const byId=new Map(customers.map(c=>[String(c.id),c]));
    const needs=a=>!String(a.customerName||"").trim()&&a.customerId!=null&&byId.get(String(a.customerId))?.name;
    if(!appointments.some(needs)) return;
    setAppointments(as=>as.map(a=>needs(a)?{...a,customerName:byId.get(String(a.customerId)).name}:a));
  },[customers,appointments]);

  const [notes,setNotes]=useLS("notes", []);
  const [maintenance,setMaintenance]=useLS("maintenance", []);
  const [projects,setProjects]=useLS("projects", []);
  const [collabs,setCollabs]=useLS("collabs", []);
  const [scheduledMsgs,setScheduledMsgs]=useLS("scheduledMsgs", []);

  // ── פריטים פעילים בלבד (מסנן deleted:true) ──
  const activeWorkers = React.useMemo(()=>activeOnly(workers),[workers]);
  const activeAppointments = React.useMemo(()=>{
    const live=activeOnly(appointments);
    if(!customers||!customers.length) return live;
    const all=new Map(customers.map(c=>[String(c.id),c]));
    // תורים של לקוח שנמחק (או הועבר לסל) לא מוצגים; שחזור הלקוח מחזיר אותם
    return live.filter(a=>{ if(a.customerId==null||a.customerId===""||a.projectId) return true; const c=all.get(String(a.customerId)); return !!c&&!c.deleted; });
  },[appointments,customers]);
  const activeFinance = React.useMemo(()=>activeOnly(finance),[finance]);
  const activeNotes = React.useMemo(()=>activeOnly(notes),[notes]);
  const activeMaintenance = React.useMemo(()=>activeOnly(maintenance),[maintenance]);
  const activeProjects = React.useMemo(()=>activeOnly(projects),[projects]);
  const activeScheduledMsgs = React.useMemo(()=>activeOnly(scheduledMsgs),[scheduledMsgs]);
  const deletedItems = React.useMemo(()=>[
    ...customers.filter(x=>x.deleted).map(x=>({...x,_type:"לקוח",_setter:()=>softRestore(setCustomers,x.id)})),
    ...workers.filter(x=>x.deleted).map(x=>({...x,_type:"עובד",_setter:()=>softRestore(setWorkers,x.id)})),
    ...appointments.filter(x=>x.deleted).map(x=>({...x,_type:"פגישה",_setter:()=>softRestore(setAppointments,x.id)})),
    ...finance.filter(x=>x.deleted).map(x=>({...x,_type:"כספים",_setter:()=>softRestore(setFinance,x.id)})),
    ...notes.filter(x=>x.deleted).map(x=>({...x,_type:"הערה",_setter:()=>softRestore(setNotes,x.id)})),
    ...maintenance.filter(x=>x.deleted).map(x=>({...x,_type:"חוזה",_setter:()=>softRestore(setMaintenance,x.id)})),
    ...projects.filter(x=>x.deleted).map(x=>({...x,_type:"פרויקט",_setter:()=>softRestore(setProjects,x.id)})),
  ],[customers,workers,appointments,finance,notes,maintenance,projects]);

  const [msgTemplates,setMsgTemplates]=useLS("msgTemplates",[
    {id:1,name:"תזכורת לתור",emoji:"📅",text:"שלום *{שם}* 👋\n\nתזכורת: מחר {תאריך} יגיע המדביר *{מדביר}* לטיפול ב*{מזיק}*.\n📍 {כתובת}\n🕐 {שעה}\n\nלשאלות — "+COMPANY.name+" 🦟"},
    {id:2,name:"אישור הזמנה",emoji:"✅",text:"שלום *{שם}* 👋\n\nקיבלנו את הזמנתך!\n📅 {תאריך} · 🕐 {שעה}\n📍 {כתובת}\n🐛 טיפול: {מזיק}\n\nלשאלות — "+COMPANY.name+" 🦟"},
    {id:3,name:"תודה לאחר טיפול",emoji:"🙏",text:"שלום *{שם}* 👋\n\nתודה שבחרת ב-"+COMPANY.name+"!\nהטיפול בוצע בהצלחה.\n\nנשמח לעמוד לשירותך שוב 😊"},
    {id:4,name:"תזכורת תשלום",emoji:"💳",text:"שלום *{שם}* 👋\n\nבהתאם לבדיקתנו, ישנו חוב פתוח עבור הטיפול שביצענו.\nנשמח להסדיר את התשלום בהקדם.\n\n"+COMPANY.name+" 🦟"},
  ]);
  const [execLogs,setExecLogs]=useLS("execLogs", []);
  // One-time: give old logs (EL-xxxxxx) simple serial numbers starting at 1001, in creation order
  React.useEffect(()=>{
    if(!execLogs.some(l=>l&&l.docNum!==undefined&&String(parseInt(l.docNum,10))!==String(l.docNum))) return;
    setExecLogs(prev=>{ let n=parseInt(nextExecNum(prev),10);
      const legacy=prev.filter(l=>String(parseInt(l.docNum,10))!==String(l.docNum)).sort((a,b)=>(a.id||0)-(b.id||0)).map(l=>l.id);
      const map={}; legacy.forEach(id=>{map[id]=String(n++);});
      return prev.map(l=>map[l.id]?{...l,docNum:map[l.id],oldDocNum:l.docNum}:l); });
  },[execLogs]);

  const TABS=[
    {id:"dashboard",label:"📊 דשבורד",short:"📊",hideFor:"מדביר"},
    {id:"fieldview",label:"📋 המשימות שלי",short:"📋",workerOnly:true},
    {id:"neworder",label:"📝 הזמנת עבודה",short:"📝",hideFor:"מדביר"},

    {id:"customers",label:"👤 לקוחות",short:"👤"},
    {id:"leads",label:"🌐 לידים מהאתר"+(newLeadsCount?` (${newLeadsCount})`:""),short:"🌐",hideFor:"מדביר"},
    {id:"calendar",label:"📅 יומן תורים",short:"📅"},
    {id:"execlog",label:"📋 יומן ביצוע",short:"📋"},
    {id:"invoices",label:"🧾 חשבוניות",short:"🧾",hideFor:"מדביר"},
    {id:"maintenance",label:"🔁 אחזקות",short:"🔁",hideFor:"מדביר"},
    {id:"projects",label:"🏗️ פרויקטים",short:"🏗️",hideFor:"מדביר"},
    {id:"notes",label:"📓 הערות",short:"📓"},
    {id:"templates",label:"💬 תבניות הודעה",short:"💬",hideFor:"מדביר"},
    {id:"scheduler",label:"⏰ הודעות מתוזמנות",short:"⏰",hideFor:"מדביר"},
    {id:"regional",label:"🗺️ ניתוח אזורי",short:"🗺️",hideFor:"מדביר"},
    {id:"finance",label:"💰 כספים",short:"💰"},
    {id:"collabs",label:"🤝 שיתופי פעולה",short:"🤝",hideFor:"מדביר"},
    {id:"workers",label:"👥 עובדים",short:"👥",adminOnly:true},
  ].filter(t=>{
    if(!user || !user.role) return true;
    if(t.hideFor===user.role) return false;
    if(t.workerOnly && user.role!=="מדביר" && !isAlsoWorker) return false;
    if(t.adminOnly && user.role==="מדביר") return false;
    // Check permissions from authUser
    const permMap={"finance":"finance","invoices":"invoices","workers":"workers",
      "collabs":"collabs","regional":"regional","projects":"projects",
      "maintenance":"maintenance","scheduler":"scheduler","templates":"templates"};
    if(permMap[t.id] && authUser && authUser.role!=="מנהל"){
      return authUser.permissions?.[permMap[t.id]]===true;
    }
    return true;
  });

  // exec log tab has its own dark bg – no padding wrapper
  const isFullTab=false; // exec log now uses sidebar like other tabs

  // Ctrl+K global search shortcut
  React.useEffect(()=>{
    const h=e=>{ if((e.ctrlKey||e.metaKey)&&e.key==="k"){e.preventDefault();setShowSearch(s=>!s);} };
    window.addEventListener("keydown",h);
    return()=>window.removeEventListener("keydown",h);
  },[]);

  const tabLabel={fieldview:"המשימות שלי",dashboard:"דשבורד",neworder:"הזמנת עבודה",customers:"לקוחות",leads:"לידים מהאתר",calendar:"יומן תורים",execlog:"יומן ביצוע",invoices:"חשבוניות",maintenance:"אחזקות",projects:"פרויקטים",notes:"הערות",templates:"תבניות הודעה",scheduler:"הודעות מתוזמנות",regional:"ניתוח אזורי",finance:"כספים",collabs:"שיתופי פעולה",workers:"עובדים"};

  if(!authUser) return <LoginScreen onLogin={doLogin}/>;

  return(
    <div style={{direction:"rtl",fontFamily:"'Inter','Segoe UI',system-ui,sans-serif",minHeight:"100vh",background:"#f8fafc"}}>
      {showSearch&&<GlobalSearch customers={customers} appointments={appointments} finance={finance} execLogs={execLogs} notes={notes} workers={activeWorkers} onNavigate={t=>setTab(t)} onClose={()=>setShowSearch(false)}/>}

      {/* ── SIDEBAR (desktop only) ── */}
      {!isFullTab&&!isMobile&&<aside style={{position:"fixed",top:0,right:0,bottom:0,width:230,background:"#0f172a",display:"flex",flexDirection:"column",zIndex:200,overflow:"hidden"}}>
        {/* Logo */}
        <div style={{padding:"16px",borderBottom:"1px solid #1e293b",display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
          <div style={{background:"#fff",borderRadius:10,padding:"4px 10px",display:"flex",alignItems:"center",flexShrink:0}}><img src="logo.png" alt="הדברה 360" style={{height:34,width:"auto",display:"block"}}/></div>
          <div>
            <div style={{fontSize:13,fontWeight:700,color:"#fff",letterSpacing:"-0.3px"}}>מערכת ניהול</div>
            <div style={{fontSize:10,color:"#94a3b8",marginTop:1}}>מערכת CRM</div>
          </div>
        </div>
        {/* Nav */}
        <nav style={{flex:1,padding:"10px 8px",overflowY:"auto"}}>
          {[
            {lbl:"ראשי",items:[{id:"fieldview",icon:"📋",name:"המשימות שלי",workerOnly:true},{id:"dashboard",icon:"📊",name:"דשבורד",hide:"מדביר"},{id:"neworder",icon:"📝",name:"הזמנת עבודה",hide:"מדביר"},{id:"customers",icon:"👤",name:"לקוחות",hide:null},{id:"leads",icon:"🌐",name:"לידים מהאתר"+(newLeadsCount?` (${newLeadsCount})`:""),hide:"מדביר"}]},
            {lbl:"עבודה",items:[{id:"calendar",icon:"📅",name:"יומן תורים",hide:null},{id:"execlog",icon:"📋",name:"יומן ביצוע",hide:null},{id:"maintenance",icon:"🔁",name:"אחזקות",hide:"מדביר"},{id:"projects",icon:"🏗️",name:"פרויקטים",hide:"מדביר"}]},

<script>
// Online/offline indicator
function updateOnlineStatus(){
  const ind = document.getElementById('sync-indicator');
  if(!ind) return;
  if(navigator.onLine){
    // בדוק אם יש תור offline ממתין
    try {
      const dbReq = indexedDB.open('h360-offline-queue', 1);
      dbReq.onsuccess = e => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains('queue')){ db.close(); return; }
        const tx = db.transaction('queue', 'readonly');
        const countReq = tx.objectStore('queue').count();
        countReq.onsuccess = () => {
          db.close();
          if(countReq.result > 0){
            ind.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:#f59e0b;display:inline-block"></span> מסנכרן (${countReq.result})`;
            ind.style.color = '#f59e0b';
          } else {
            ind.innerHTML = '<span style="width:7px;height:7px;border-radius:50%;background:#16a34a;display:inline-block"></span> מסונכרן';
            ind.style.color = '#16a34a';
          }
        };
      };
      dbReq.onerror = () => {
        ind.innerHTML = '<span style="width:7px;height:7px;border-radius:50%;background:#16a34a;display:inline-block"></span> מסונכרן';
        ind.style.color = '#16a34a';
      };
    } catch(e){
      ind.innerHTML = '<span style="width:7px;height:7px;border-radius:50%;background:#16a34a;display:inline-block"></span> מסונכרן';
      ind.style.color = '#16a34a';
    }
  } else {
    ind.innerHTML = '<span style="width:7px;height:7px;border-radius:50%;background:#f59e0b;display:inline-block"></span> ללא קליטה — נשמר מקומית';
    ind.style.color = '#f59e0b';
  }
}
window.addEventListener('online', () => { updateOnlineStatus(); });
window.addEventListener('offline', updateOnlineStatus);
setTimeout(updateOnlineStatus, 1000);

// Pull-to-Refresh חסום ב-CSS (overscroll-behavior-y:none) — בלי לחסום גלילה רגילה

// ─── Service Worker — עדכון אוטומטי + Offline Queue ─────────────────────
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/hadbara360/sw.js?v=2').then(reg => {
    console.log('[App] SW registered', reg.scope);

    // אם יש worker חדש שמחכה — הצג בנר
    const showUpdateBanner = () => {
      let banner = document.getElementById('sw-update-banner');
      if(!banner){
        banner = document.createElement('div');
        banner.id = 'sw-update-banner';
        banner.style.cssText = [
          'position:fixed','bottom:0','left:0','right:0','z-index:9999',
          'background:#16a34a','color:#fff','padding:14px 20px',
          'display:flex','align-items:center','justify-content:space-between',
          'font-family:inherit','font-size:15px','direction:rtl',
          'box-shadow:0 -2px 12px rgba(0,0,0,0.3)'
        ].join(';');
        banner.innerHTML = `
          <span>🚀 גרסה חדשה זמינה!</span>
          <button onclick="window._applyUpdate()" style="
            background:#fff;color:#16a34a;border:none;padding:7px 18px;
            border-radius:8px;font-weight:700;cursor:pointer;font-size:14px
          ">עדכן עכשיו</button>
        `;
        document.body.appendChild(banner);
      }
    };

    // Worker כבר ממתין?
    if(reg.waiting) showUpdateBanner();

    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
          showUpdateBanner();
        }
      });
    });

    // כשהעדכון ב-SKIP_WAITING → reload
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      window.location.reload();
    });

    // בדוק עדכון ברקע כל 30 דקות
    setInterval(() => reg.update(), 30 * 60 * 1000);

    // שלח flush כשחוזר אינטרנט
    window.addEventListener('online', () => {
      if(reg.active) reg.active.postMessage({ type: 'ONLINE' });
      console.log('[App] Back online — flushing offline queue');
    });

  }).catch(err => console.warn('[App] SW registration failed:', err));

  // פונקציה לאישור עדכון
  window._applyUpdate = () => {
    navigator.serviceWorker.getRegistration().then(reg => {
      if(reg && reg.waiting){
        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      }
    });
  };

  // קבל הודעה מ-SW שהסנכרון הצליח
  navigator.serviceWorker.addEventListener('message', e => {
    if(e.data && e.data.type === 'OFFLINE_SYNC_DONE'){
      console.log('[App] Offline sync done:', e.data.count, 'requests');
      // עדכן אינדיקטור
      const ind = document.getElementById('sync-indicator');
      if(ind){
        ind.innerHTML = '<span style="width:7px;height:7px;border-radius:50%;background:#16a34a;display:inline-block"></span> סונכרן ✓';
        setTimeout(() => updateOnlineStatus(), 3000);
      }
    }
  });
}

// PWA Install prompt
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  // Show install button
  const btn = document.getElementById('pwa-install-btn');
  if(btn) btn.style.display = 'flex';
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  const btn = document.getElementById('pwa-install-btn');
  if(btn) btn.style.display = 'none';
});

window._installPWA = async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const {outcome} = await deferredPrompt.userChoice;
  deferredPrompt = null;
  if(outcome === 'accepted'){
    const btn = document.getElementById('pwa-install-btn');
    if(btn) btn.style.display = 'none';
  }
};
</script>
